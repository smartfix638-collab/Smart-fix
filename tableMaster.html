<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TableMaster Pro — Secure Cloud Restaurant Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<!-- Firebase Standard UMD SDKs (App, Auth, Firestore) -->
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --primary: #2563eb;
  --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  --bg: #f8fafc;
  --surface: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
  --shadow-md: 0 8px 24px -4px rgba(15,23,42,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text-main); font-size: 14px; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }

/* Auth Screen */
.auth-wrap {
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: radial-gradient(ellipse at top left, #1e293b 0%, #0f172a 60%), #0f172a;
}
.auth-card {
  background: #fff; padding: 28px 22px; border-radius: 20px; width: 100%; max-width: 420px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); text-align: left;
}
.auth-brand { text-align: center; margin-bottom: 20px; }
.auth-brand .icon {
  width: 48px; height: 48px; background: var(--primary-gradient); border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; color: #fff; margin-bottom: 8px;
}
.auth-tabs { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 12px; margin-bottom: 18px; }
.auth-tab {
  flex: 1; padding: 9px; border-radius: 8px; border: none; background: transparent;
  color: var(--text-muted); font-weight: 700; font-size: 13px; cursor: pointer;
}
.auth-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }

/* Top Header */
.topbar {
  position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
}
.brand-box { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; color: var(--primary); }
.brand-icon {
  width: 34px; height: 34px; background: var(--primary-gradient);
  border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff;
  overflow: hidden;
}
.brand-icon img { width: 100%; height: 100%; object-fit: cover; }
.top-actions { display: flex; align-items: center; gap: 6px; }

.sync-badge {
  font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 700;
  display: flex; align-items: center; gap: 4px;
}
.sync-badge.online { background: #dcfce7; color: #15803d; }
.sync-badge.syncing { background: #fef3c7; color: #b45309; }

.lang-toggle-btn {
  display: flex; align-items: center; gap: 4px; padding: 5px 10px;
  border-radius: 16px; border: 1px solid var(--border); background: #fff;
  font-size: 11px; font-weight: 700; color: var(--primary); cursor: pointer;
}

.btn-icon {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer;
}

/* Layout Wrapper */
.main-wrapper { 
  flex: 1; padding: 14px; padding-bottom: calc(90px + env(safe-area-inset-bottom)); 
  max-width: 900px; margin: 0 auto; width: 100%; 
}

.tm-card {
  background: var(--surface); border-radius: var(--radius-xl); padding: 16px;
  box-shadow: var(--shadow-md); border: 1px solid rgba(226, 232, 240, 0.8); margin-bottom: 14px;
}
.tm-card-title {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; font-weight: 700; font-size: 14.5px;
}

/* Quick Action Tiles */
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
@media (min-width: 600px) {
  .quick-grid { grid-template-columns: repeat(4, 1fr); }
}
.quick-tile {
  background: var(--surface); border-radius: var(--radius-lg); padding: 14px;
  border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex;
  flex-direction: column; align-items: flex-start; gap: 6px; cursor: pointer;
  border-left: 4px solid var(--primary);
}
.quick-tile.amber { border-left-color: var(--warning); }
.quick-tile.emerald { border-left-color: var(--success); }
.quick-tile.purple { border-left-color: #8b5cf6; }
.tile-bubble {
  width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; background: #eff6ff; color: var(--primary);
}
.quick-tile.amber .tile-bubble { background: #fffbeb; color: var(--warning); }
.quick-tile.emerald .tile-bubble { background: #ecfdf5; color: var(--success); }
.quick-tile.purple .tile-bubble { background: #f3e8ff; color: #8b5cf6; }
.tile-title { font-weight: 700; font-size: 13.5px; }
.tile-desc { font-size: 11px; color: var(--text-muted); }

/* Floor Table Visuals */
.table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.table-card {
  background: #fff; border: 2px solid var(--border); border-radius: var(--radius-md);
  padding: 14px 10px; text-align: center; cursor: pointer; position: relative;
}
.table-card.available { border-color: #a7f3d0; background: linear-gradient(180deg, #ecfdf5 0%, #fff 100%); }
.table-card.occupied { border-color: #fde68a; background: linear-gradient(180deg, #fffbeb 0%, #fff 100%); }
.table-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; }
.table-card.available .table-dot { background: var(--success); }
.table-card.occupied .table-dot { background: var(--warning); animation: pulse 1.4s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* POS Menu */
.cat-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-btn {
  padding: 6px 14px; border-radius: 99px; background: #f1f5f9; border: none;
  font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer;
}
.cat-btn.active { background: var(--primary-gradient); color: #fff; }

.dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.dish-card {
  background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-md);
  padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; min-height: 80px;
}
.dish-name { font-weight: 600; font-size: 13px; line-height: 1.3; }
.dish-price { font-weight: 800; color: var(--primary); margin-top: 4px; font-size: 13.5px; }

/* Sticky Cart */
.floating-cart {
  position: fixed; bottom: calc(64px + env(safe-area-inset-bottom)); left: 12px; right: 12px;
  background: var(--text-main); color: #fff; border-radius: 14px; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 10px 25px rgba(15,23,42,0.3); z-index: 95;
}
.btn-place {
  background: var(--success); color: #fff; border: none; border-radius: 8px;
  padding: 8px 16px; font-weight: 700; font-size: 12.5px; cursor: pointer;
}

/* Quantity Control Box */
.qty-ctrl-box {
  display: flex; align-items: center; gap: 6px; background: #f1f5f9;
  padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border);
}
.qty-btn {
  background: #fff; border: 1px solid var(--border); width: 26px; height: 26px;
  border-radius: 4px; font-weight: 800; font-size: 14px; color: var(--primary);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.qty-display { font-size: 12.5px; font-weight: 700; min-width: 18px; text-align: center; }

/* Profit Banner & Reports */
.profit-banner {
  padding: 16px; border-radius: var(--radius-lg); margin-bottom: 14px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
}
.profit-banner.profit { background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%); border-left: 4px solid #059669; }
.profit-banner.loss { background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%); border-left: 4px solid #dc2626; }
.profit-banner .label { font-size: 11px; font-weight: 800; text-transform: uppercase; }
.profit-banner.profit .label { color: #047857; }
.profit-banner.loss .label { color: #b91c1c; }
.profit-banner .val { font-size: 26px; font-weight: 800; }
.profit-banner.profit .val { color: #065f46; }
.profit-banner.loss .val { color: #991b1b; }
.profit-breakdown { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; }
.profit-breakdown div { display: flex; flex-direction: column; }
.profit-breakdown span:first-child { color: #64748b; font-weight: 700; font-size: 9.5px; text-transform: uppercase; }
.profit-breakdown span:last-child { font-size: 13.5px; font-weight: 800; margin-top: 1px; }

.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.filter-chip {
  padding: 5px 12px; border-radius: 99px; background: #f1f5f9; border: none;
  font-size: 11.5px; font-weight: 600; color: var(--text-muted); cursor: pointer;
}
.filter-chip.active { background: var(--primary-gradient); color: #fff; }

.custom-date-box {
  background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
  padding: 10px; margin-bottom: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}

.bar-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
.bar-label { flex: 0 0 38%; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; height: 7px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--primary-gradient); }
.bar-fill.green { background: linear-gradient(90deg, #10b981, #059669); }
.bar-val { flex: 0 0 auto; font-size: 11.5px; font-weight: 700; text-align: right; min-width: 65px; }

/* Table Elements */
.table-responsive { width: 100%; overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
.data-table th, .data-table td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; }
.data-table th { background: #f8fafc; font-weight: 700; color: var(--text-muted); font-size: 10.5px; text-transform: uppercase; }

.badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.badge.cat-raw { background: #fee2e2; color: #b91c1c; }
.badge.cat-util { background: #fef3c7; color: #b45309; }
.badge.cat-sal { background: #e0e7ff; color: #4338ca; }
.badge.cat-rent { background: #dbeafe; color: #1e40af; }
.badge.cat-other { background: #f1f5f9; color: #475569; }

/* Bottom Nav */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border); display: flex; justify-content: space-around;
  padding: 6px 2px calc(6px + env(safe-area-inset-bottom));
}
.bar-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: transparent; border: none; font-size: 9.5px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 8px; flex: 1;
}
.bar-item.active { color: var(--primary); background: #eff6ff; }
.bar-item svg { width: 18px; height: 18px; }

/* Developer Watermark Footer */
.dev-footer {
  text-align: center; padding: 14px 10px; font-size: 11.5px; color: var(--text-muted);
  border-top: 1px solid var(--border); margin-top: 20px;
}
.dev-footer b { color: var(--primary); font-weight: 800; }

/* Modal Sheet */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center;
  z-index: 200;
}
.sheet-backdrop.active { display: flex; }
.sheet-modal {
  background: #fff; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0;
  padding: 18px; max-height: 85dvh; overflow-y: auto; display: flex; flex-direction: column;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sheet-title { font-size: 16px; font-weight: 800; }
.btn-x { background: #f1f5f9; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; }

input, select, textarea {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 13.5px; margin-bottom: 10px; background: #fff;
}
label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }

.btn-primary { width: 100%; background: var(--primary-gradient); color: #fff; border: none; padding: 11px; border-radius: 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.btn-danger { background: var(--danger); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.btn-sm-outline { border: 1px solid var(--border); background: #fff; padding: 5px 10px; border-radius: 6px; font-weight: 700; font-size: 11.5px; cursor: pointer; }

/* Thermal Receipt Paper */
.receipt-paper {
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; background: #fff;
  color: #000; padding: 12px; border: 1px dashed #cbd5e1; border-radius: 8px;
  width: 280px; margin: 0 auto; text-align: left; line-height: 1.35;
}
.receipt-paper hr { border: none; border-top: 1px dashed #000; margin: 6px 0; }
.receipt-paper .c { text-align: center; }
.receipt-paper .r { text-align: right; }
.receipt-paper .qr-img { width: 100px; height: 100px; display: block; margin: 0 auto; }
.receipt-logo { max-width: 80px; max-height: 50px; display: block; margin: 0 auto 4px; filter: grayscale(100%); }
.receipt-dev { text-align: center; font-size: 9px; font-weight: 800; margin-top: 6px; border-top: 1px dotted #000; padding-top: 4px; text-transform: uppercase; }

@media print {
  body > * { display: none !important; }
  #print-area { display: block !important; width: 100%; margin: 0; padding: 0; }
  .receipt-paper { width: 100% !important; border: none !important; padding: 0 !important; }
}
#print-area { display: none; }
</style>
</head>
<body>

<!-- AUTHENTICATION SCREEN -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="icon">
        <svg width="24" height="24" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 3v18M3 8h4a4 4 0 010 8H3M17 3v18M17 8c0-2 3-2 3 0v6c0 2 3 2 3 0V3"/></svg>
      </div>
      <h2 style="font-size:20px;font-weight:800;color:#0f172a">TableMaster Pro</h2>
      <p style="font-size:11.5px;color:var(--text-muted);margin-top:2px">Multi-Tenant Secure Cloud Management</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" type="button" onclick="switchAuthTab('login')" id="tab-login">Login</button>
      <button class="auth-tab" type="button" onclick="switchAuthTab('register')" id="tab-register">Register Cafe</button>
    </div>
    <form id="form-login" onsubmit="handleLogin(event)">
      <label>Email Address</label>
      <input id="log-email" type="email" required placeholder="owner@cafe.com" autocomplete="email">
      <label>Password</label>
      <input id="log-pass" type="password" required placeholder="••••••••" autocomplete="current-password">
      <button type="submit" class="btn-primary" style="margin-top:6px" id="btn-login-submit">Sign In →</button>
    </form>
    <form id="form-register" style="display:none" onsubmit="handleRegister(event)">
      <label>Restaurant / Cafe Name</label>
      <input id="reg-name" required placeholder="e.g. Royal Cafe">
      <label>Owner Name</label>
      <input id="reg-owner" required placeholder="Full Name">
      <label>Phone Number</label>
      <input id="reg-phone" required placeholder="+91 XXXXX XXXXX">
      <label>Email Address</label>
      <input id="reg-email" type="email" required placeholder="owner@cafe.com" autocomplete="email">
      <label>Password (Min 6 chars)</label>
      <input id="reg-pass" type="password" required minlength="6" placeholder="Password" autocomplete="new-password">
      <label>Master PIN (4 Digits)</label>
      <input id="reg-pin" type="password" pattern="[0-9]{4}" required placeholder="e.g. 1234">
      <button type="submit" class="btn-primary" style="margin-top:6px" id="btn-reg-submit">Register & Launch My Cafe →</button>
    </form>
    <div style="text-align:center;font-size:10.5px;color:#94a3b8;margin-top:14px;">
      Enterprise Security by <b>Debapriya Sarkar</b>
    </div>
  </div>
</div>

<!-- MAIN DASHBOARD SHELL -->
<div id="app-container" style="display:none;">
  <header class="topbar">
    <div class="brand-box">
      <div class="brand-icon" id="header-logo-container">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 3v18M3 8h4a4 4 0 010 8H3M17 3v18M17 8c0-2 3-2 3 0v6c0 2 3 2 3 0V3"/></svg>
      </div>
      <span id="txt-cafe-name">TableMaster Pro</span>
    </div>
    <div class="top-actions">
      <div class="sync-badge syncing" id="sync-status">🔄 Connecting...</div>
      <button class="lang-toggle-btn" onclick="toggleLanguage()" id="btn-lang-toggle">🌐 <span>English</span></button>
      <button class="btn-icon" id="btn-staff-header" onclick="openStaffModal()" title="Staff"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></button>
      <button class="btn-icon" id="btn-settings-header" onclick="openSettingsSheet()" title="Settings"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
      <button class="btn-icon" onclick="handleLogout()" title="Logout" style="color:var(--danger)"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </header>

  <main class="main-wrapper" id="main-view"></main>
  <nav class="bottom-bar" id="app-bottom-bar"></nav>
</div>

<!-- Modal Sheet -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="sheetBackdropClick(event)">
  <div class="sheet-modal" id="sheet-modal">
    <div class="sheet-head">
      <div class="sheet-title" id="sheet-title">Title</div>
      <button class="btn-x" onclick="closeSheet()">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="print-area"></div>

  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

window.RESTAURANT_DATA = null;
window.getData = function() { return window.RESTAURANT_DATA || {}; };

// Realtime Listener for the authenticated cafe
function bindCafeCloudListener(cafeId) {
  if (!db || !cafeId) return;

  if (currentCafeListener) {
    currentCafeListener();
  }

  const badge = document.getElementById('sync-status');
  if (badge) {
    badge.className = 'sync-badge syncing';
    badge.innerHTML = '🔄 Connecting...';
  }

  const docRef = db.collection("cafes").doc(cafeId);

  currentCafeListener = docRef.onSnapshot((docSnap) => {
    if (docSnap.exists) {
      window.RESTAURANT_DATA = docSnap.data();
      localStorage.setItem('tmpro_cafe_cache_' + cafeId, JSON.stringify(window.RESTAURANT_DATA));
    }
    if (badge) {
      badge.className = 'sync-badge online';
      badge.innerHTML = '☁️ Online';
    }
    renderCurrentView();
  }, (err) => {
    console.warn("Firestore sync warning:", err);
    if (badge) {
      badge.className = 'sync-badge syncing';
      badge.innerHTML = '⚡ Local Mode';
    }
  });
}

window.cloudSave = function() {
  const data = window.getData();
  if (!data || !data.cafeId || !db) return;

  try {
    localStorage.setItem('tmpro_cafe_cache_' + data.cafeId, JSON.stringify(data));
  } catch(e){}

  const badge = document.getElementById('sync-status');
  if (badge) {
    badge.className = 'sync-badge syncing';
    badge.innerHTML = '🔄 Syncing...';
  }

  db.collection("cafes").doc(data.cafeId).set(data).then(() => {
    if (badge) {
      badge.className = 'sync-badge online';
      badge.innerHTML = '☁️ Online';
    }
  }).catch(err => {
    console.error("Cloud save failed:", err);
    if (badge) {
      badge.className = 'sync-badge syncing';
      badge.innerHTML = '⚠️ Error';
    }
  });
};

function checkAuth() {
  if (!auth) return;

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      const cafeId = 'cafe_' + user.uid;
      const cached = localStorage.getItem('tmpro_cafe_cache_' + cafeId);
      if (cached) {
        window.RESTAURANT_DATA = JSON.parse(cached);
      }

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';

      bindCafeCloudListener(cafeId);
      setupNavigation();
      renderCurrentView();
    } else {
      if (currentCafeListener) {
        currentCafeListener();
        currentCafeListener = null;
      }
      window.RESTAURANT_DATA = null;
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-container').style.display = 'none';
    }
  });
}

function switchAuthTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('log-email').value.trim();
  const pass = document.getElementById('log-pass').value.trim();
  const btn = document.getElementById('btn-login-submit');

  btn.disabled = true;
  btn.innerText = "Signing in...";

  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch (err) {
    alert("Login Failed: " + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "Sign In →";
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const name = document.getElementById('reg-name').value.trim();
  const owner = document.getElementById('reg-owner').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value.trim();
  const pin = document.getElementById('reg-pin').value.trim();
  const btn = document.getElementById('btn-reg-submit');

  if (!email || !pass || !name) {
    alert("Please fill in all required fields!");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Registering Cafe...";

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    const cafeId = 'cafe_' + uid;

    const newCafe = createNewCafeTemplate(cafeId, uid, name, owner, phone, pin);
    window.RESTAURANT_DATA = newCafe;

    await db.collection("cafes").doc(cafeId).set(newCafe);
    localStorage.setItem('tmpro_cafe_cache_' + cafeId, JSON.stringify(newCafe));

    alert(`✓ Registration Successful for "${name}"!`);
  } catch (err) {
    alert("Registration Error: " + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "Register & Launch My Cafe →";
  }
}

async function handleLogout() {
  if (!confirm('Log out from your Cafe account?')) return;
  try {
    await auth.signOut();
  } catch (err) {
    console.error(err);
  }
}

function createSafeQR(text) {
  if (!text) return '';
  try {
    const qr = qrcode(0, 'M');
    qr.addData(String(text));
    qr.make();
    return qr.createDataURL(4);
  } catch (err) { return ''; }
}

function onSearchKeyInput(query) {
  posSearchQuery = query;
  const grid = document.getElementById('pos-dish-grid-container');
  if (!grid || !window.getData) return;

  const data = window.getData();
  const q = query.toLowerCase().trim();
  let dishes = posCategoryFilter === 'All' ? (data.menu || []) : (data.menu || []).filter(m => m.category === posCategoryFilter);

  if (q) {
    dishes = dishes.filter(d => (d.name && d.name.toLowerCase().includes(q)) || (d.category && d.category.toLowerCase().includes(q)));
  }

  if (dishes.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--text-muted);">No matching food items found!</div>';
    return;
  }

  grid.innerHTML = dishes.map(d => `
    <div class="dish-card" onclick="addItemToCart('${d.id}')">
      <div class="dish-name">${d.name}</div>
      <div class="dish-price">₹ ${d.price}</div>
    </div>
  `).join('');
}

    if (reportFilter === 'today') {

    } else if (reportFilter === 'week') {
      const weekAgo = new Date();
      weekAgo.setDate(weekAgo.getDate() - 7);
      const weekStr = weekAgo.toISOString().split('T')[0];
      filteredOrders = filteredOrders.filter(o => (o.date || today) >= weekStr);
      filteredExpenses = filteredExpenses.filter(e => (e.date || today) >= weekStr);
    } else if (reportFilter === 'month') {
      const monthPrefix = today.slice(0, 7);
      filteredOrders = filteredOrders.filter(o => (o.date || today).startsWith(monthPrefix));
      filteredExpenses = filteredExpenses.filter(e => (e.date || today).startsWith(monthPrefix));

    const dayMap = {};
    filteredOrders.forEach(o => {
      const d = o.date || today;
      if (!dayMap[d]) dayMap[d] = { sales: 0, exp: 0 };
      dayMap[d].sales += o.total;
    });
    filteredExpenses.forEach(e => {
      const d = e.date || today;

                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      ${developerFooterHtml}
    `;
  }

  else if (activeTab === 'menu') {
    container.innerHTML = `
      <div class="tm-card">
        <div class="tm-card-title">
          <span>${t('digitalMenuCard')}</span>

function handleTableSelect(tblId) {
  cartState.tableId = tblId;
  navigate('pos');
}

function addItemToCart(dishId) {
  const data = window.getData();
  const dish = (data.menu || []).find(d => d.id === dishId);
  if (!dish) return;
  const item = cartState.items.find(i => i.dishId === dishId);
  if (item) item.qty += 1;
  else cartState.items.push({ dishId, name: dish.name, price: dish.price, qty: 1 });
  renderCurrentView();
}

function changeCartItemQty(index, change) {
  if (!cartState.items[index]) return;
  cartState.items[index].qty += change;
  if (cartState.items[index].qty <= 0) {
    cartState.items.splice(index, 1);
  }
  if (cartState.items.length === 0) {
    closeSheet();
    renderCurrentView();
  } else {
    openCartReviewSheet();
  }
}

function openCartReviewSheet() {
  const data = window.getData();
  if (!cartState.tableId) {
    alert(t('selectDishWarning'));
    return;
  }
  const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
  const gstRate = parseFloat(data.gstRate) || 0;
  const serviceRate = parseFloat(data.serviceRate) || 0;

  const gst = gstRate > 0 ? (subtotal * (gstRate / 100)) : 0;
  const service = serviceRate > 0 ? (subtotal * (serviceRate / 100)) : 0;
  const grandTotal = subtotal + gst + service;

  const tbl = (data.tables || []).find(tData => tData.id === cartState.tableId);
  const existingOrder = (data.orders || []).find(o => o.tableId === cartState.tableId && o.status !== 'completed');

  const body = `
    <div style="font-weight:700;margin-bottom:10px;">${t('table')}: ${tbl ? tbl.name : ''}</div>
    ${existingOrder ? `<div style="font-size:11px;color:#1e40af;margin-bottom:8px;">Appending items to Running Bill #${existingOrder.billNo}</div>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
      ${cartState.items.map((it, idx) => `
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9;padding-bottom:6px;">
          <div>
            <div style="font-weight:700;">${it.name}</div>
            <div style="font-size:11px;color:var(--text-muted);">₹ ${it.price} each</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="qty-ctrl-box">
              <button class="qty-btn" onclick="changeCartItemQty(${idx}, -1)">−</button>

              <button class="qty-btn" onclick="changeCartItemQty(${idx}, 1)">+</button>
            </div>
            <strong style="min-width:55px;text-align:right;">₹ ${(it.price * it.qty).toFixed(2)}</strong>
          </div>
        </div>
      `).join('')}
    </div>

    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
      <span>${t('subtotal')}:</span><span>₹ ${subtotal.toFixed(2)}</span>
    </div>

    ${gstRate > 0 ? `
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
        <span>${t('tax')} (${gstRate}%):</span><span>₹ ${gst.toFixed(2)}</span>
      </div>
    ` : ''}

    ${serviceRate > 0 ? `
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:10px;">
        <span>${t('serviceCharge')} (${serviceRate}%):</span><span>₹ ${service.toFixed(2)}</span>
      </div>
    ` : ''}

    <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800;margin-top:6px;margin-bottom:14px;border-top:1px dashed var(--border);padding-top:6px;">
      <span>${t('grandTotal')}:</span><span>₹ ${grandTotal.toFixed(2)}</span>
    </div>
    <button class="btn-primary" onclick="submitOrderToKitchen()">${t('sendToKitchen')}</button>
  `;
  openSheet(t('orderConfirmation'), body);
}

function submitOrderToKitchen() {
  const data = window.getData();
  const gstRate = parseFloat(data.gstRate) || 0;
  const serviceRate = parseFloat(data.serviceRate) || 0;

  if (!data.orders) data.orders = [];

  const existingOrder = data.orders.find(o => o.tableId === cartState.tableId && o.status !== 'completed');

  if (existingOrder) {
    cartState.items.forEach(newItem => {
      const match = existingOrder.items.find(i => i.dishId === newItem.dishId);
      if (match) match.qty += newItem.qty;
      else existingOrder.items.push({ ...newItem });
    });
    existingOrder.subtotal = existingOrder.items.reduce((s, i) => s + (i.price * i.qty), 0);
    existingOrder.gst = gstRate > 0 ? (existingOrder.subtotal * (gstRate / 100)) : 0;
    existingOrder.gstRate = gstRate;
    existingOrder.service = serviceRate > 0 ? (existingOrder.subtotal * (serviceRate / 100)) : 0;
    existingOrder.serviceRate = serviceRate;
    existingOrder.total = existingOrder.subtotal + existingOrder.gst + existingOrder.service;
    existingOrder.status = 'preparing';
  } else {
    const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
    const gst = gstRate > 0 ? (subtotal * (gstRate / 100)) : 0;
    const service = serviceRate > 0 ? (subtotal * (serviceRate / 100)) : 0;
    const orderNum = 100 + data.orders.length + 1;

    data.orders.push({
      id: 'ord_' + Date.now(),
      kotNo: orderNum,
      billNo: orderNum,
      tableId: cartState.tableId,
      items: [...cartState.items],
      subtotal: subtotal,
      gst: gst,
      gstRate: gstRate,
      service: service,
      serviceRate: serviceRate,
      total: subtotal + gst + service,
      status: 'preparing',
      date: window.todayStr(),
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
  }

  const tbl = (data.tables || []).find(tData => tData.id === cartState.tableId);
  if (tbl) tbl.status = 'occupied';

  window.cloudSave();

  cartState = { tableId: '', items: [] };
  closeSheet();
  navigate('kitchen');
}

function completeKOT(orderId) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (o) {
    o.status = 'ready_to_serve';
    window.cloudSave();
    renderCurrentView();
  }
}

function settleBillAndReleaseTable(orderId) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (!o) return;

  if (!confirm(`Confirm payment of ₹ ${o.total.toFixed(2)} for Bill #${o.billNo}? Table will be marked AVAILABLE.`)) return;

  o.status = 'completed';
  const tbl = (data.tables || []).find(tData => tData.id === o.tableId);
  if (tbl) tbl.status = 'available';

  window.cloudSave();
  renderCurrentView();
}

      ${o.items.map(i => `
        <div style="display:flex;justify-content:space-between;">
          <span>${i.name} x${i.qty}</span>
          <span>₹ ${(i.price * i.qty).toFixed(2)}</span>
        </div>
      `).join('')}
      <hr>
      <div style="display:flex;justify-content:space-between;">
        <span>${t('subtotal')}:</span>
        <span>₹ ${o.subtotal.toFixed(2)}</span>
      </div>

      ${hasTax ? `
        <div style="display:flex;justify-content:space-between;">
          <span>${t('tax')} (${o.gstRate}%):</span>
          <span>₹ ${o.gst.toFixed(2)}</span>
        </div>
      ` : ''}

      ${hasService ? `
        <div style="display:flex;justify-content:space-between;">
          <span>${t('serviceCharge')} (${o.serviceRate}%):</span>
          <span>₹ ${o.service.toFixed(2)}</span>
        </div>
      ` : ''}

      <hr>
      <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:12px;">
        <span>${t('grandTotal')}:</span>
        <span>₹ ${o.total.toFixed(2)}</span>
      </div>
      <hr>
      ${upiQrImg ? `
        <div class="c" style="margin:6px 0;">
          <div style="font-size:9.5px;margin-bottom:3px;font-weight:bold;">${t('scanToPay')}</div>
          <img src="${upiQrImg}" class="qr-img">
        </div>
      ` : ''}
      ${reviewQrImg ? `
        <div class="c" style="margin-top:6px;">
          <div style="font-size:8.5px;">${t('reviewPrompt')}</div>
          <img src="${reviewQrImg}" style="width:65px;height:65px;margin-top:2px;">
        </div>
      ` : ''}
      <div class="c" style="font-size:9.5px;margin-top:6px;">${t('thankYou')}</div>
      <div class="receipt-dev">Software Developed by: Debapriya Sarkar</div>
    </div>
    <button class="btn-primary" style="margin-top:12px;" onclick="triggerPrint()">${t('printThermalReceipt')}</button>
  `;

}

function triggerPrint() {
  document.getElementById('print-area').innerHTML = document.getElementById('paper-element').innerHTML;
  window.print();
}

function exportReportsCSV() {
  const data = window.getData();
  let csv = "TableMaster Pro - Sales & Profit Report\n";
  csv += "Software Developed by,Debapriya Sarkar\n";
  csv += "Type,Date,Description,Amount\n";
  (data.orders || []).filter(o => o.status === 'completed').forEach(o => {
    csv += `Sales,${o.date || window.todayStr()},Bill #${o.billNo},${o.total.toFixed(2)}\n`;
  });
  (data.expenses || []).forEach(e => {
    csv += `Expense,${e.date || window.todayStr()},"${e.desc}",${e.amount.toFixed(2)}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `report_${window.todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function saveExpense() {

  const staffListHtml = (data.staff || []).map(s => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;">
      <div>

  `).join('');

function saveStaffMember() {

  const pass = document.getElementById('stf-pass').value.trim();

function deleteStaff(id) {
  const data = window.getData();

  window.cloudSave();

function openSettingsSheet() {
  const data = window.getData();
  const form = `
    <label>${t('restaurantName')}</label>
    <input type="text" id="cfg-name" value="${data.name || ''}">
    
    <label>${t('uploadLogo')}</label>
    <input type="file" id="cfg-logo-file" accept="image/*" onchange="handleLogoUpload(event)">
    ${data.logo ? `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <img src="${data.logo}" style="width:45px;height:45px;border-radius:6px;object-fit:cover;border:1px solid var(--border);">
        <button class="btn-danger" style="padding:4px 8px;font-size:10.5px;" onclick="removeLogo()">Remove Logo</button>
      </div>
    ` : ''}

    <label>${t('phone')}</label>
    <input type="text" id="cfg-phone" value="${data.phone || ''}">
    <label>${t('address')}</label>
    <input type="text" id="cfg-addr" value="${data.address || ''}">
    <label>${t('upiId')}</label>
    <input type="text" id="cfg-upi" value="${data.upi || ''}">
    <label>${t('googleReviewUrl')}</label>
    <input type="text" id="cfg-review" value="${data.googleReview || ''}">
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div>
        <label>${t('gstRate')}</label>
        <input type="number" id="cfg-gst" value="${data.gstRate || 0}" step="0.01">
      </div>
      <div>
        <label>${t('serviceRate')}</label>
        <input type="number" id="cfg-service" value="${data.serviceRate || 0}" step="0.01">
      </div>
    </div>

    <label>Master PIN (4 Digits)</label>
    <input type="password" id="cfg-pin" pattern="[0-9]{4}" value="${data.masterPin || '1234'}">
    <button class="btn-primary" onclick="saveSettings()">${t('save')}</button>
  `;
  openSheet(t('restaurantSettings'), form);
}

function handleLogoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const data = window.getData();
    data.logo = evt.target.result;
    window.cloudSave();
    openSettingsSheet();
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  const data = window.getData();
  data.logo = '';
  window.cloudSave();
  openSettingsSheet();
}

function saveSettings() {
  const data = window.getData();
  data.name = document.getElementById('cfg-name').value.trim();
  data.phone = document.getElementById('cfg-phone').value.trim();
  data.address = document.getElementById('cfg-addr').value.trim();
  data.upi = document.getElementById('cfg-upi').value.trim();
  data.googleReview = document.getElementById('cfg-review').value.trim();
  data.gstRate = parseFloat(document.getElementById('cfg-gst').value) || 0;
  data.serviceRate = parseFloat(document.getElementById('cfg-service').value) || 0;
  data.masterPin = document.getElementById('cfg-pin').value.trim() || data.masterPin;
  window.cloudSave();
  closeSheet();
  renderCurrentView();
}

  checkAuth();
});
