<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFix Phone Test</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-5 text-center font-sans">
  <div class="max-w-md mx-auto mt-10">
    <h1 class="text-2xl font-bold text-sky-400 mb-2">SmartFix Hardware Test</h1>
    <p class="text-xs text-slate-400 mb-8">Reading your device hardware...</p>
    
    <div id="statusBox" class="bg-slate-800 p-5 rounded-xl border border-slate-700">
      <div class="animate-pulse text-emerald-400 font-bold" id="statusText">Testing in progress...</div>
    </div>

    <div id="resultsBox" class="hidden mt-5 text-left text-sm space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-700">
      <div class="flex justify-between border-b border-slate-800 pb-2"><span class="text-slate-400">Device RAM:</span> <span id="resRam" class="font-bold text-white">-</span></div>
      <div class="flex justify-between border-b border-slate-800 pb-2"><span class="text-slate-400">Battery Level:</span> <span id="resBat" class="font-bold text-white">-</span></div>
      <div class="flex justify-between border-b border-slate-800 pb-2"><span class="text-slate-400">Charging Status:</span> <span id="resCharge" class="font-bold text-white">-</span></div>
      <div class="flex justify-between border-b border-slate-800 pb-2"><span class="text-slate-400">Screen Size:</span> <span id="resScreen" class="font-bold text-white">-</span></div>
      <div class="flex justify-between"><span class="text-slate-400">Network:</span> <span id="resNet" class="font-bold text-white">-</span></div>
    </div>

    <button onclick="window.close()" class="mt-8 bg-sky-600 px-6 py-2 rounded-lg font-bold text-white w-full">Close Window</button>
  </div>

  <script>
    // রিয়েল ডেটা রিড করার ফাংশন
    async function runTest() {
      let data = {};

      // ১. র‍্যাম চেক (navigator.deviceMemory)
      data.ram = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown';

      // ২. ব্যাটারি চেক (HTML5 Battery API)
      try {
        const battery = await navigator.getBattery();
        data.battery = Math.round(battery.level * 100) + '%';
        data.charging = battery.charging ? 'Yes (Charging)' : 'No (Discharging)';
      } catch(e) {
        data.battery = 'Not Supported';
        data.charging = 'N/A';
      }

      // ৩. স্ক্রিন রেজোলিউশন
      data.screen = window.screen.width + ' x ' + window.screen.height + ' px';

      // ৪. নেটওয়ার্ক স্টেটাস
      if(navigator.connection) {
        data.network = navigator.connection.effectiveType.toUpperCase() + ' Connection';
      } else {
        data.network = 'Online';
      }

      // UI আপডেট
      document.getElementById('statusText').innerText = 'Test Completed!';
      document.getElementById('statusText').className = 'text-emerald-400 font-bold';
      document.getElementById('resultsBox').classList.remove('hidden');

      document.getElementById('resRam').innerText = data.ram;
      document.getElementById('resBat').innerText = data.battery;
      document.getElementById('resCharge').innerText = data.charging;
      document.getElementById('resScreen').innerText = data.screen;
      document.getElementById('resNet').innerText = data.network;

      // ⭐ কম্পিউটারে ডেটা পাঠানোর লজিক (URL প্যারামিটার দিয়ে)
      // কম্পিউটারের ডক্টর স্ক্রিনে যে আইডি দেখানো হবে, সেটি এখানে ব্যবহার হবে
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('id');
      
      if(sessionId) {
        // লোকাল স্টোরেজের মাধ্যমে কম্পিউটারে পাঠানো (যদি সেম ডিভাইস হয়)
        // অথবা সরাসরি কম্পিউটারে পুশ করা (এখানে সিমুলেট করা হলো)
        const eventData = { id: sessionId, ...data, timestamp: Date.now() };
        localStorage.setItem('sfp_doc_session_' + sessionId, JSON.stringify(eventData));
      }
    }

    // পেজ লোড হলে টেস্ট শুরু হবে
    window.onload = () => {
      setTimeout(runTest, 1000);
    };
  </script>
</body>
</html>
