<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFix Total Diagnostic</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .loader { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-[#060b14] text-white p-4 font-sans min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🩺</div>
      <h1 class="text-xl font-black text-sky-400">SmartFix Total Diagnostics</h1>
      <p class="text-xs text-slate-400 mt-1">Scanning hardware & network...</p>
    </div>
    
    <!-- Loading Box -->
    <div id="statusBox" class="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl flex flex-col items-center justify-center min-h-[150px] shadow-lg">
      <div class="loader mb-4"></div>
      <div class="text-emerald-400 font-bold text-sm" id="statusText">Running Tests...</div>
      <div class="text-[10px] text-slate-500 mt-2" id="subText">Please do not close this window</div>
    </div>

    <!-- Results Box (Hidden initially) -->
    <div id="resultsBox" class="hidden mt-4 space-y-2 text-xs">
      
      <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
        <span class="text-slate-400">📶 Network Type:</span> 
        <span id="resNet" class="font-bold text-sky-300">-</span>
      </div>
      
      <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
        <span class="text-slate-400">🔋 Battery Level:</span> 
        <span id="resBat" class="font-bold text-emerald-300">-</span>
      </div>

      <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
        <span class="text-slate-400">⚡ Charging State:</span> 
        <span id="resCharge" class="font-bold text-emerald-300">-</span>
      </div>

      <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
        <span class="text-slate-400">🧠 RAM / Memory:</span> 
        <span id="resRam" class="font-bold text-purple-300">-</span>
      </div>

      <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
        <span class="text-slate-400">⚙️ CPU Cores:</span> 
        <span id="resCpu" class="font-bold text-amber-300">-</span>
      </div>

      <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
        <span class="text-slate-400">🖥️ Screen Resolution:</span> 
        <span id="resScreen" class="font-bold text-blue-300">-</span>
      </div>

      <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
        <span class="text-slate-400">💾 Browser Storage:</span> 
        <span id="resStorage" class="font-bold text-rose-300">-</span>
      </div>
    </div>

    <!-- Close Button -->
    <button onclick="window.close()" id="closeBtn" class="hidden mt-6 w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-sm transition">
      Close Window
    </button>
  </div>

  <script>
    async function runTotalDiagnostic() {
      let data = {};

      // ১. নেটওয়ার্ক চেক (3G/4G/5G)
      if(navigator.connection) {
        const conn = navigator.connection;
        let netType = conn.effectiveType ? conn.effectiveType.toUpperCase() : 'Unknown';
        if (netType === '4G') netType = '4G / LTE / 5G';
        data.network = `${netType} (${conn.downlink ? conn.downlink + ' Mbps' : 'Speed N/A'})`;
      } else {
        data.network = navigator.onLine ? 'Online (Type Unknown)' : 'Offline';
      }

      // ২. ব্যাটারি ও চার্জিং চেক
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          data.battery = Math.round(battery.level * 100) + '%';
          data.charging = battery.charging ? 'Yes (Charging)' : 'No (Discharging)';
        } else {
          data.battery = 'API Not Supported';
          data.charging = 'N/A';
        }
      } catch(e) {
        data.battery = 'Access Denied';
        data.charging = 'N/A';
      }

      // ৩. র‍্যাম (মেমোরি) চেক
      data.ram = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Restricted by Browser';

      // ৪. সিপিইউ কোর চেক
      data.cpu = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + ' Cores' : 'Unknown';

      // ৫. স্ক্রিন রেজোলিউশন
      data.screen = `${window.screen.width} x ${window.screen.height} px (DPR: ${window.devicePixelRatio})`;

      // ৬. স্টোরেজ চেক (ব্রাউজার কতটুকু জায়গা পাচ্ছে)
      try {
        if (navigator.storage && navigator.storage.estimate) {
          const estimate = await navigator.storage.estimate();
          const quotaGB = (estimate.quota / (1024 * 1024 * 1024)).toFixed(1);
          data.storage = `Available: ${quotaGB} GB`;
        } else {
          data.storage = 'Not Supported';
        }
      } catch(e) {
        data.storage = 'Unknown';
      }

      // ৭. ডিভাইস ও ওএস ইনফো
      const ua = navigator.userAgent;
      if (ua.includes("Android")) {
        data.os = "Android Device";
        const match = ua.match(/Android\s([0-9\.]*)/);
        if (match) data.os += " (v" + match[1] + ")";
      } else if (ua.includes("iPhone") || ua.includes("iPad")) {
        data.os = "Apple iOS";
      } else {
        data.os = "Desktop / Other";
      }

      // UI আপডেট করা
      document.getElementById('statusBox').innerHTML = `
        <div class="text-4xl mb-2">✅</div>
        <div class="text-emerald-400 font-black text-lg">Test Completed!</div>
        <div class="text-[10px] text-slate-400 mt-1">Data sent to PC successfully</div>
      `;
      
      document.getElementById('resultsBox').classList.remove('hidden');
      document.getElementById('closeBtn').classList.remove('hidden');

      document.getElementById('resNet').innerText = data.network;
      document.getElementById('resBat').innerText = data.battery;
      document.getElementById('resCharge').innerText = data.charging;
      document.getElementById('resRam').innerText = data.ram;
      document.getElementById('resCpu').innerText = data.cpu;
      document.getElementById('resScreen').innerText = data.screen;
      document.getElementById('resStorage').innerText = data.storage;

      // ⭐ কম্পিউটারে ডেটা পাঠানোর জন্য লোকাল স্টোরেজে সেভ করা
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('id');
      
      if(sessionId) {
        const syncData = { 
          os: data.os,
          network: data.network, 
          battery: data.battery, 
          charging: data.charging,
          ram: data.ram,
          cpu: data.cpu,
          screen: data.screen,
          storage: data.storage
        };
        localStorage.setItem('sfp_doc_session_' + sessionId, JSON.stringify(syncData));
      }
    }

    // পেজ লোড হওয়ার ১.৫ সেকেন্ড পর টেস্ট শুরু হবে
    window.onload = () => {
      setTimeout(runTotalDiagnostic, 1500);
    };
  </script>
</body>
</html>
