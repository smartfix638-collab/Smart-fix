<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Bills — SmartFix ERP</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%230ea5e9'/%3E%3Cstop offset='1' stop-color='%230369a1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='100' fill='url(%23g)'/%3E%3Ctext x='50%25' y='65%25' font-size='300' text-anchor='middle' fill='white'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E">

<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SmartFix — My Bills">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdn.tailwindcss.com"></script>

<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: #020617;
    color: #e2e8f0;
    overflow-x: hidden;
  }

  .bg-blob {
    position: fixed; border-radius: 50%;
    filter: blur(90px); opacity: 0.3;
    pointer-events: none; z-index: 0;
  }
  .blob-1 {
    width: 380px; height: 380px;
    top: -140px; left: -140px;
    background: radial-gradient(circle, #0ea5e9 0%, transparent 70%);
  }
  .blob-2 {
    width: 340px; height: 340px;
    bottom: -120px; right: -120px;
    background: radial-gradient(circle, #6366f1 0%, transparent 70%);
  }

  .glass {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(56, 189, 248, 0.15);
  }

  .fade-in {
    animation: fadeInUp 0.35s ease-out;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .inv-card {
    transition: all 0.15s ease;
  }
  .inv-card:hover {
    border-color: rgba(56, 189, 248, 0.4);
    transform: translateY(-1px);
  }

  @media print {
    @page { size: A4 portrait; margin: 6mm; }
    body { background: white !important; color: black !important; }
    header, footer, .no-print, .bg-blob { display: none !important; }
    .glass {
      background: white !important;
      border: 1px solid #cbd5e1 !important;
      backdrop-filter: none !important;
    }
    .inv-card { page-break-inside: avoid; }
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: rgba(15,23,42,0.5); }
  ::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.3); border-radius: 3px; }
</style>
</head>

<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="relative z-10 glass border-b border-slate-800 sticky top-0">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">

    <div class="w-9 h-9 flex-shrink-0 rounded-xl bg-gradient-to-br from-sky-500 to-sky-800 flex items-center justify-center text-white text-base shadow-lg shadow-sky-500/30">
      🔧
    </div>

    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <h1 class="text-sm font-black text-white truncate" id="hdrShopName">Store</h1>
        <span class="text-[9px] bg-sky-950/60 text-sky-400 border border-sky-800/60 px-1.5 py-0.5 rounded font-mono" id="hdrShopCode">—</span>
      </div>
      <p class="text-[10px] text-slate-400">My Bills & Warranty</p>
    </div>

    <button type="button" onclick="exitPortal()"
            class="text-[10px] bg-slate-800/70 hover:bg-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition">
      ✕ Exit
    </button>

  </div>
</header>


<!-- ============================================================
     MAIN
     ============================================================ -->
<main class="relative z-10 max-w-4xl mx-auto px-4 py-5 space-y-4">

  <!-- Welcome card -->
  <div class="glass rounded-2xl p-5 fade-in">
    <div class="flex items-start gap-3">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-500 to-emerald-800 flex items-center justify-center text-white text-xl flex-shrink-0">
        ✓
      </div>
      <div class="min-w-0 flex-1">
        <div class="text-[10px] uppercase font-bold text-emerald-400 tracking-wider">Welcome</div>
        <div class="text-lg font-black text-white mt-0.5" id="welcomeName">Customer</div>
        <div class="text-[11px] text-slate-400 mt-1">
          <span class="font-mono" id="welcomePhone">—</span>
          <span class="mx-1.5">•</span>
          <span id="welcomeCount">0 invoices found</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Search again button -->
  <button type="button" onclick="searchAgain()"
          class="w-full bg-sky-950/40 hover:bg-sky-950/60 border border-sky-800/60 text-sky-300 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
    🔍 Search another bill
  </button>

  <!-- Invoices list -->
  <div id="invoiceList" class="space-y-3"></div>

  <!-- Empty state (fallback) -->
  <div id="emptyState" style="display:none" class="glass rounded-2xl p-8 text-center">
    <div class="text-5xl mb-3">📭</div>
    <div class="text-white font-bold text-sm mb-1">No bills found</div>
    <div class="text-slate-400 text-xs mb-4">
      Try searching again or contact the shop directly.
    </div>
    <button type="button" onclick="searchAgain()"
            class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-5 py-2 rounded-lg text-xs">
      Search Again
    </button>
  </div>

  <!-- Shop contact -->
  <div class="glass rounded-2xl p-5">
    <div class="text-[10px] uppercase font-bold text-sky-400 tracking-wider mb-2">📞 Shop Contact</div>
    <div class="space-y-1 text-xs">
      <div class="flex items-start gap-2">
        <span class="text-slate-500 w-16 flex-shrink-0">Name:</span>
        <span class="font-semibold text-slate-200" id="shopContactName">—</span>
      </div>
      <div class="flex items-start gap-2">
        <span class="text-slate-500 w-16 flex-shrink-0">Phone:</span>
        <a id="shopContactPhone" href="tel:" class="font-mono text-sky-400 hover:text-sky-300 font-semibold">—</a>
      </div>
      <div class="flex items-start gap-2">
        <span class="text-slate-500 w-16 flex-shrink-0">Address:</span>
        <span class="text-slate-300 text-[11px] leading-relaxed" id="shopContactAddress">—</span>
      </div>
    </div>
  </div>

  <!-- Footer note -->
  <div class="text-center text-[10px] text-slate-500 py-3">
    <div>SmartFix ERP © 2026 • Secure customer portal</div>
    <div class="mt-0.5">Your data is encrypted and never shared</div>
  </div>

</main>


<!-- ============================================================
     INVOICE DETAILS MODAL
     ============================================================ -->
<div id="invModal" class="fixed inset-0 z-[9999] hidden"
     style="background:rgba(0,0,0,0.8); backdrop-filter:blur(6px);">
  <div class="flex items-end sm:items-center justify-center h-full p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl max-w-2xl w-full max-h-[95vh] sm:max-h-[90vh] overflow-hidden shadow-2xl flex flex-col">

      <!-- Modal header -->
      <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/70 flex-shrink-0">
        <div class="min-w-0 flex-1">
          <h3 id="invModalTitle" class="font-bold text-white text-sm truncate">Invoice Details</h3>
          <p id="invModalSubtitle" class="text-[11px] text-slate-400 mt-0.5 truncate">—</p>
        </div>
        <button type="button" onclick="closeModal()"
                class="text-slate-400 hover:text-white text-2xl font-bold w-9 h-9 flex items-center justify-center rounded-lg hover:bg-slate-800 flex-shrink-0">
          ✕
        </button>
      </div>

      <!-- Modal body -->
      <div id="invModalBody" class="p-4 overflow-y-auto flex-1 space-y-3">
        <!-- injected -->
      </div>

      <!-- Modal footer -->
      <div class="p-3 border-t border-slate-800 bg-slate-950/70 flex gap-2 flex-shrink-0">
        <button type="button" onclick="printCurrentInvoice()"
                class="flex-1 bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-lg text-xs transition">
          🖨️ Print / Save PDF
        </button>
        <button type="button" onclick="shareCurrentInvoice()"
                class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-xs transition">
          📤 Share
        </button>
      </div>

    </div>
  </div>
</div>


<!-- ============================================================
     HIDDEN PRINT CONTAINER
     ============================================================ -->
<div id="printArea" style="display:none"></div>


<!-- ============================================================
     MODULE LOGIC
     ============================================================ -->
<script>
(function () {
  'use strict';

  /* ============================================================
     STATE
     ============================================================ */
  const PORTAL = {
    session: null,
    invoices: [],
    currentInvoice: null,
    storeProfile: null
  };


  /* ============================================================
     1. INIT
     ============================================================ */
  function init() {
    console.log('%c🛍 Customer portal loading...', 'color:#10b981;font-weight:bold');

    /* Load session */
    const raw = sessionStorage.getItem('sfp_customer_session');
    if (!raw) {
      console.warn('No session found — redirecting to login');
      showEmptyState();
      return;
    }

    try {
      const session = JSON.parse(raw);
      if (!session || !session.invoices || session.invoices.length === 0) {
        showEmptyState();
        return;
      }
      PORTAL.session = session;
      PORTAL.invoices = session.invoices || [];
    } catch (e) {
      console.error('Session parse error:', e);
      showEmptyState();
      return;
    }

    /* Update header */
    const shopName = document.getElementById('hdrShopName');
    if (shopName) shopName.textContent = PORTAL.session.shopName || 'Store';
    const shopCode = document.getElementById('hdrShopCode');
    if (shopCode) shopCode.textContent = PORTAL.session.shopCode || '';

    /* Welcome card */
    const wname = document.getElementById('welcomeName');
    if (wname) {
      const firstInv = PORTAL.invoices[0];
      wname.textContent = firstInv.customerName || 'Customer';
    }
    const wphone = document.getElementById('welcomePhone');
    if (wphone) wphone.textContent = PORTAL.session.phone || '—';
    const wcount = document.getElementById('welcomeCount');
    if (wcount) {
      wcount.textContent = PORTAL.invoices.length + ' invoice' +
        (PORTAL.invoices.length !== 1 ? 's' : '') + ' found';
    }

    /* Fetch store profile from Firestore (public read) */
    loadStoreProfile();

    /* Render invoices */
    renderInvoices();

    /* Update shop contact */
    updateShopContact();
  }


  /* ============================================================
     2. LOAD STORE PROFILE (public read of profile doc)
     ============================================================ */
  async function loadStoreProfile() {
    const storeId = PORTAL.session?.storeId;
    if (!storeId) return;

    try {
      /* Use dynamic import of firebase to fetch profile */
      const mod = await import('./js/firebase-config.js');
      const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const snap = await getDoc(doc(mod.db, 'stores', storeId, 'profile', 'main'));
      if (snap.exists()) {
        PORTAL.storeProfile = snap.data();
        updateShopContact();
      }
    } catch (e) {
      console.warn('Could not load store profile:', e);
      /* Fallback: derive from session */
      PORTAL.storeProfile = {
        name: PORTAL.session.shopName || 'Store',
        phone: '',
        address: ''
      };
      updateShopContact();
    }
  }

  function updateShopContact() {
    const p = PORTAL.storeProfile || {};
    const nameEl = document.getElementById('shopContactName');
    if (nameEl) nameEl.textContent = p.name || PORTAL.session?.shopName || '—';

    const phoneEl = document.getElementById('shopContactPhone');
    if (phoneEl) {
      const rawPhone = (p.phone || '').replace(/^Ph:\s*/i, '').replace(/\D/g, '');
      if (rawPhone) {
        phoneEl.textContent = p.phone;
        phoneEl.href = 'tel:' + rawPhone;
      } else {
        phoneEl.textContent = '—';
        phoneEl.href = 'tel:';
      }
    }

    const addrEl = document.getElementById('shopContactAddress');
    if (addrEl) addrEl.textContent = p.address || '—';
  }


  /* ============================================================
     3. RENDER INVOICES
     ============================================================ */
  function renderInvoices() {
    const container = document.getElementById('invoiceList');
    const emptyEl = document.getElementById('emptyState');
    if (!container) return;

    if (!PORTAL.invoices.length) {
      container.innerHTML = '';
      if (emptyEl) emptyEl.style.display = 'block';
      return;
    }

    if (emptyEl) emptyEl.style.display = 'none';

    /* Sort: latest first */
    const sorted = [...PORTAL.invoices].sort((a, b) => {
      const da = new Date((a.date || '') + 'T12:00:00');
      const db = new Date((b.date || '') + 'T12:00:00');
      return db - da;
    });

    container.innerHTML = sorted.map((inv, idx) => {
      const total = inv.totalGross || 0;
      const itemCount = (inv.items || []).length;
      const warranty = computeWarrantyStatus(inv);

      /* Warranty badge */
      let warrantyBadge = '';
      if (warranty) {
        if (warranty.expired) {
          warrantyBadge = `<span class="text-[9px] bg-slate-800 text-slate-400 border border-slate-700 px-2 py-0.5 rounded font-bold">⌛ WARRANTY EXPIRED</span>`;
        } else {
          const days = warranty.daysLeft;
          const cls = days <= 30
            ? 'bg-amber-950/60 text-amber-400 border-amber-800/60'
            : 'bg-emerald-950/60 text-emerald-400 border-emerald-800/60';
          warrantyBadge = `<span class="text-[9px] ${cls} border px-2 py-0.5 rounded font-bold">🛡️ WARRANTY ACTIVE — ${days} days left</span>`;
        }
      }

      return `
        <div class="inv-card glass rounded-2xl p-4 fade-in cursor-pointer"
             onclick="openInvoice(${idx}, '${C_escape(inv.invoiceNo || '')}')">

          <!-- Top: type + total -->
          <div class="flex justify-between items-start gap-3 mb-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[10px] bg-indigo-950/60 text-indigo-300 border border-indigo-800/60 px-2 py-0.5 rounded font-bold">
                  TAX INVOICE
                </span>
                <span class="text-[10px] font-mono text-slate-500">${C_escape(inv.date || '')}</span>
              </div>
              <div class="text-base font-black text-white font-mono truncate">
                ${C_escape(inv.invoiceNo || '')}
              </div>
            </div>
            <div class="text-right flex-shrink-0">
              <div class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Total</div>
              <div class="text-lg font-black font-mono text-emerald-400">
                ${C_money(total)}
              </div>
            </div>
          </div>

          <!-- Middle: item preview -->
          <div class="bg-slate-950/60 border border-slate-800/60 rounded-lg p-2.5 mb-3">
            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">
              ${itemCount} Item${itemCount !== 1 ? 's' : ''}
            </div>
            <div class="space-y-1">
              ${(inv.items || []).slice(0, 3).map((it) => `
                <div class="flex justify-between items-start gap-2 text-[11px]">
                  <div class="min-w-0 flex-1">
                    <div class="text-slate-200 font-semibold truncate">${C_escape(it.model || '')}</div>
                    ${it.imei ? `<div class="text-[10px] text-sky-500 font-mono truncate">IMEI: ${C_escape(it.imei)}</div>` : ''}
                  </div>
                  <div class="text-slate-400 font-mono text-[10.5px] flex-shrink-0">
                    ₹${((it.rate || 0) * (it.qty || 1)).toFixed(2)}
                  </div>
                </div>
              `).join('')}
              ${itemCount > 3 ? `
                <div class="text-[10px] text-slate-500 italic pt-1">
                  + ${itemCount - 3} more item${itemCount - 3 !== 1 ? 's' : ''}
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Bottom: warranty + action -->
          <div class="flex justify-between items-center gap-2 flex-wrap">
            <div class="flex items-center gap-1.5 flex-wrap">
              ${warrantyBadge}
            </div>
            <div class="text-[10px] text-sky-400 font-bold flex items-center gap-1">
              <span>View Details</span>
              <span>›</span>
            </div>
          </div>

        </div>
      `;
    }).join('');
  }


  /* ============================================================
     4. WARRANTY CALC
     ============================================================ */
  function computeWarrantyStatus(inv) {
    if (!inv.date) return null;
    if (!inv.items || inv.items.length === 0) return null;

    /* Check if any item qualifies for warranty */
    /* Categories like "Mobile Phone" typically have 12 months;
       accessories have 6 months. We use a simple heuristic. */
    const catToMonths = {
      'Mobile Phone': 12,
      'Tablet': 12,
      'Smart Watch': 12,
      'Laptop': 12,
      'Mobile Cover': 0,       /* no warranty */
      'Tempered Glass': 0,
      'Cable': 3,
      'Charger': 6,
      'Earphone': 6,
      'Power Bank': 6,
      'Memory Card': 12,
      'Other': 0
    };

    /* Find max warranty from items */
    let maxMonths = 0;
    (inv.items || []).forEach((it) => {
      const cat = it.category || 'Mobile Phone';
      const m = catToMonths[cat] ?? 12;
      if (m > maxMonths) maxMonths = m;
    });

    if (maxMonths === 0) return null;

    /* Calculate expiry */
    const purchaseDate = new Date(inv.date + 'T12:00:00');
    if (isNaN(purchaseDate.getTime())) return null;

    const expiryDate = new Date(purchaseDate);
    expiryDate.setMonth(expiryDate.getMonth() + maxMonths);

    const now = new Date();
    const diffMs = expiryDate - now;
    const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

    return {
      expiryDate,
      months: maxMonths,
      expired: daysLeft < 0,
      daysLeft: Math.max(0, daysLeft)
    };
  }


  /* ============================================================
     5. OPEN INVOICE MODAL
     ============================================================ */
  function openInvoice(idx, invoiceNo) {
    /* Find actual invoice (by invoiceNo to be safe) */
    let inv = PORTAL.invoices.find((x) => x.invoiceNo === invoiceNo);
    if (!inv) inv = PORTAL.invoices[idx];
    if (!inv) {
      alert('Invoice not found');
      return;
    }

    PORTAL.currentInvoice = inv;

    /* Set title */
    const titleEl = document.getElementById('invModalTitle');
    if (titleEl) titleEl.textContent = inv.invoiceNo || 'Invoice';

    const subEl = document.getElementById('invModalSubtitle');
    if (subEl) {
      subEl.textContent = (inv.date || '') + ' • ' + C_money(inv.totalGross || 0);
    }

    /* Build body */
    const body = document.getElementById('invModalBody');
    if (!body) return;

    const items = inv.items || [];
    const warranty = computeWarrantyStatus(inv);

    /* Calculate tax */
    const totalTaxable = inv.totalTaxable || 0;
    const totalTax = (inv.totalCGST || 0) + (inv.totalSGST || 0) + (inv.totalIGST || 0);
    const taxType = inv.taxType || 'INTRA';

    body.innerHTML = `
      <!-- Invoice meta -->
      <div class="bg-slate-950/70 border border-slate-800 rounded-lg p-3 space-y-1.5 text-xs">
        <div class="flex justify-between">
          <span class="text-slate-500">Invoice No:</span>
          <span class="font-mono font-bold text-sky-400">${C_escape(inv.invoiceNo || '')}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Date:</span>
          <span class="font-mono text-slate-200">${C_escape(inv.date || '')}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Customer:</span>
          <span class="font-semibold text-slate-200">${C_escape(inv.customerName || '')}</span>
        </div>
        ${inv.customerPhone ? `
          <div class="flex justify-between">
            <span class="text-slate-500">Phone:</span>
            <span class="font-mono text-slate-200">${C_escape(inv.customerPhone)}</span>
          </div>
        ` : ''}
        ${inv.customerGSTIN ? `
          <div class="flex justify-between">
            <span class="text-slate-500">GSTIN:</span>
            <span class="font-mono text-slate-200 text-[10.5px]">${C_escape(inv.customerGSTIN)}</span>
          </div>
        ` : ''}
        <div class="flex justify-between">
          <span class="text-slate-500">Payment:</span>
          <span class="text-slate-200">${C_escape(shortLedger(inv.ledger))}</span>
        </div>
      </div>

      <!-- Warranty card -->
      ${warranty ? `
        <div class="border rounded-lg p-3 ${warranty.expired ? 'bg-slate-950/70 border-slate-700' : 'bg-emerald-950/30 border-emerald-800/60'}">
          <div class="flex items-center justify-between mb-1.5">
            <div class="text-[10px] font-bold uppercase tracking-wider ${warranty.expired ? 'text-slate-400' : 'text-emerald-400'}">
              🛡️ Warranty Status
            </div>
            <div class="text-[10px] font-bold ${warranty.expired ? 'text-slate-400' : 'text-emerald-400'}">
              ${warranty.expired ? 'EXPIRED' : warranty.daysLeft + ' days left'}
            </div>
          </div>
          <div class="text-[11px] text-slate-300 leading-relaxed">
            <div><strong>Period:</strong> ${warranty.months} months from purchase</div>
            <div><strong>Expires on:</strong> <span class="font-mono text-slate-200">${C_fmtDatePretty(warranty.expiryDate)}</span></div>
          </div>
        </div>
      ` : ''}

      <!-- Items -->
      <div>
        <div class="text-[10px] font-bold uppercase text-slate-500 mb-1.5 tracking-wider">
          📦 Items (${items.length})
        </div>
        <div class="space-y-2">
          ${items.map((it, i) => `
            <div class="bg-slate-950/70 border border-slate-800 rounded-lg p-3 text-xs">
              <div class="flex justify-between items-start gap-2 mb-1">
                <div class="font-bold text-white min-w-0 flex-1">${C_escape(it.model || '')}</div>
                <div class="font-mono font-bold text-slate-200 flex-shrink-0">
                  ₹${((it.rate || 0) * (it.qty || 1)).toFixed(2)}
                </div>
              </div>
              ${it.imei ? `
                <div class="font-mono text-[10.5px] text-sky-400 mb-0.5">
                  IMEI: ${C_escape(it.imei)}
                </div>
              ` : ''}
              <div class="text-[10.5px] text-slate-500">
                ${it.qty || 1} × ₹${(it.rate || 0).toFixed(2)}
                <span class="mx-1.5">•</span>
                GST ${it.gst || 18}%
                ${it.hsn ? `<span class="mx-1.5">•</span>HSN ${C_escape(it.hsn)}` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- Totals -->
      <div class="bg-slate-950/70 border border-slate-800 rounded-lg p-3 space-y-1.5 text-xs">
        <div class="flex justify-between">
          <span class="text-slate-400">Taxable Amount:</span>
          <span class="font-mono text-slate-200">₹${totalTaxable.toFixed(2)}</span>
        </div>
        ${inv.discount > 0 ? `
          <div class="flex justify-between">
            <span class="text-rose-400">Discount:</span>
            <span class="font-mono text-rose-400">-₹${(inv.discount || 0).toFixed(2)}</span>
          </div>
        ` : ''}
        <div class="flex justify-between">
          <span class="text-slate-400">${taxType === 'INTRA' ? 'CGST + SGST' : 'IGST'}:</span>
          <span class="font-mono text-slate-200">₹${totalTax.toFixed(2)}</span>
        </div>
        <div class="flex justify-between border-t border-slate-800 pt-1.5 mt-1">
          <span class="font-bold text-white">Total:</span>
          <span class="font-mono font-black text-emerald-400 text-base">
            ₹${(inv.totalGross || 0).toFixed(2)}
          </span>
        </div>
      </div>

      <!-- Info notice -->
      <div class="bg-sky-950/30 border border-sky-800/40 rounded-lg p-3 text-[10.5px] text-sky-200 leading-relaxed">
        💡 <strong>Need service?</strong> Call the shop at the number below. Keep your IMEI ready — it's printed above for quick reference.
      </div>
    `;

    /* Show modal */
    const modal = document.getElementById('invModal');
    if (modal) modal.classList.remove('hidden');
  }

  function closeModal() {
    const modal = document.getElementById('invModal');
    if (modal) modal.classList.add('hidden');
  }


  /* ============================================================
     6. PRINT / SHARE
     ============================================================ */
  function printCurrentInvoice() {
    const inv = PORTAL.currentInvoice;
    if (!inv) return;

    const target = document.getElementById('printArea');
    if (!target) return;

    const p = PORTAL.storeProfile || {};
    const items = inv.items || [];
    const totalTaxable = inv.totalTaxable || 0;
    const totalTax = (inv.totalCGST || 0) + (inv.totalSGST || 0) + (inv.totalIGST || 0);
    const taxType = inv.taxType || 'INTRA';

    target.innerHTML = `
      <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:11px;color:#0f172a;padding:6mm">

        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0284c7;padding-bottom:8px;margin-bottom:12px">
          <div>
            <div style="font-size:20px;font-weight:900;color:#075985;line-height:1">${C_escape(p.name || PORTAL.session.shopName)}</div>
            <div style="font-size:10px;color:#475569;margin-top:4px;max-width:280px;line-height:1.3">${C_escape(p.address || '')}</div>
            <div style="font-size:10px;font-weight:700;color:#1e293b;margin-top:2px">${C_escape(p.phone || '')}</div>
            ${p.gstin ? `<div style="font-size:10px;color:#475569;margin-top:1px">GSTIN: <span style="font-family:monospace;color:#0369a1">${C_escape(p.gstin)}</span></div>` : ''}
          </div>
          <div style="text-align:right">
            <div style="display:inline-block;background:#075985;color:white;font-size:9px;font-weight:800;padding:3px 10px;border-radius:4px;letter-spacing:1px">
              TAX INVOICE
            </div>
            <div style="font-family:monospace;font-size:14px;font-weight:900;color:#0c4a6e;margin-top:6px">${C_escape(inv.invoiceNo)}</div>
            <div style="font-size:10px;color:#64748b;font-family:monospace">${C_escape(inv.date)}</div>
          </div>
        </div>

        <!-- Customer -->
        <div style="background:#f0f9ff;border:1px solid #bae6fd;padding:8px;border-radius:6px;margin-bottom:12px;font-size:11px">
          <div style="font-weight:800;color:#0369a1;font-size:9px;text-transform:uppercase;margin-bottom:4px">Billed To</div>
          <div><strong>${C_escape(inv.customerName || '')}</strong></div>
          ${inv.customerPhone ? `<div style="font-family:monospace;color:#475569">${C_escape(inv.customerPhone)}</div>` : ''}
          ${inv.customerGSTIN ? `<div style="font-family:monospace;font-size:10px;color:#475569">GSTIN: ${C_escape(inv.customerGSTIN)}</div>` : ''}
        </div>

        <!-- Items table -->
        <table style="width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:10px">
          <thead>
            <tr style="background:#e0f2fe;color:#0c4a6e;font-size:9px;text-transform:uppercase;font-weight:700">
              <th style="border:1px solid #0284c7;padding:5px;text-align:center;width:24px">#</th>
              <th style="border:1px solid #0284c7;padding:5px;text-align:left">Item</th>
              <th style="border:1px solid #0284c7;padding:5px;text-align:center;width:36px">Qty</th>
              <th style="border:1px solid #0284c7;padding:5px;text-align:right;width:70px">Rate ₹</th>
              <th style="border:1px solid #0284c7;padding:5px;text-align:right;width:80px">Amount ₹</th>
            </tr>
          </thead>
          <tbody>
            ${items.map((it, i) => `
              <tr>
                <td style="border:1px solid #0284c7;padding:5px;text-align:center;font-weight:700">${i + 1}</td>
                <td style="border:1px solid #0284c7;padding:5px">
                  <div style="font-weight:700">${C_escape(it.model || '')}</div>
                  ${it.imei ? `<div style="font-size:9px;color:#0369a1;font-family:monospace">IMEI: ${C_escape(it.imei)}</div>` : ''}
                  <div style="font-size:9px;color:#64748b">HSN: ${C_escape(it.hsn || '8517')} • GST: ${it.gst || 18}%</div>
                </td>
                <td style="border:1px solid #0284c7;padding:5px;text-align:center;font-weight:700">${it.qty || 1}</td>
                <td style="border:1px solid #0284c7;padding:5px;text-align:right;font-family:monospace">${(it.rate || 0).toFixed(2)}</td>
                <td style="border:1px solid #0284c7;padding:5px;text-align:right;font-family:monospace;font-weight:700">${((it.rate || 0) * (it.qty || 1)).toFixed(2)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <!-- Totals -->
        <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
          <table style="font-size:10.5px;min-width:280px">
            <tr>
              <td style="padding:3px 8px;color:#475569;text-align:right">Taxable Amount:</td>
              <td style="padding:3px 8px;text-align:right;font-family:monospace">₹${totalTaxable.toFixed(2)}</td>
            </tr>
            ${inv.discount > 0 ? `
              <tr>
                <td style="padding:3px 8px;color:#be123c;text-align:right">Discount:</td>
                <td style="padding:3px 8px;text-align:right;font-family:monospace;color:#be123c">-₹${(inv.discount || 0).toFixed(2)}</td>
              </tr>
            ` : ''}
            <tr>
              <td style="padding:3px 8px;color:#475569;text-align:right">${taxType === 'INTRA' ? 'CGST + SGST' : 'IGST'}:</td>
              <td style="padding:3px 8px;text-align:right;font-family:monospace">₹${totalTax.toFixed(2)}</td>
            </tr>
            <tr style="background:#e0f2fe">
              <td style="padding:6px 8px;font-weight:900;font-size:13px;text-align:right;color:#0c4a6e;border-top:2px solid #0284c7">TOTAL:</td>
              <td style="padding:6px 8px;text-align:right;font-family:monospace;font-weight:900;font-size:14px;color:#0c4a6e;border-top:2px solid #0284c7">₹${(inv.totalGross || 0).toFixed(2)}</td>
            </tr>
          </table>
        </div>

        <!-- Thanks -->
        <div style="text-align:center;padding:10px;border-top:1px solid #e2e8f0;font-size:10px;color:#64748b">
          Thank you for your purchase!
        </div>

        <div style="text-align:center;margin-top:6px;font-size:8px;color:#94a3b8;font-family:monospace">
          SmartFix ERP © 2026 • ${C_escape(p.name || '')}
        </div>
      </div>
    `;

    target.style.display = 'block';
    setTimeout(() => {
      window.print();
      setTimeout(() => {
        target.innerHTML = '';
        target.style.display = 'none';
      }, 500);
    }, 150);
  }

  async function shareCurrentInvoice() {
    const inv = PORTAL.currentInvoice;
    if (!inv) return;

    const p = PORTAL.storeProfile || {};
    const shopName = p.name || PORTAL.session.shopName;
    const itemList = (inv.items || []).map((it) => '• ' + (it.model || '') + (it.imei ? ' (IMEI: ' + it.imei + ')' : '')).join('\n');

    const text =
      `*${shopName}*\n` +
      `—————————————\n` +
      `Invoice: *${inv.invoiceNo}*\n` +
      `Date: ${inv.date}\n` +
      `Customer: ${inv.customerName || ''}\n\n` +
      `*Items:*\n${itemList}\n\n` +
      `Total: *₹${(inv.totalGross || 0).toFixed(2)}*\n\n` +
      `Thanks for shopping! 🙏`;

    /* Try native share */
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'Invoice ' + inv.invoiceNo,
          text
        });
        return;
      } catch (e) {
        /* User cancelled */
        if (e.name === 'AbortError') return;
      }
    }

    /* Fallback: WhatsApp */
    const waUrl = 'https://wa.me/?text=' + encodeURIComponent(text);
    window.open(waUrl, '_blank');
  }


  /* ============================================================
     7. SEARCH AGAIN / EXIT
     ============================================================ */
  function searchAgain() {
    sessionStorage.removeItem('sfp_customer_session');
    location.href = './index.html#customer';
  }

  function exitPortal() {
    if (!confirm('Exit customer portal?')) return;
    sessionStorage.removeItem('sfp_customer_session');
    location.href = './index.html';
  }


  /* ============================================================
     8. EMPTY STATE
     ============================================================ */
  function showEmptyState() {
    const list = document.getElementById('invoiceList');
    if (list) list.innerHTML = '';
    const empty = document.getElementById('emptyState');
    if (empty) empty.style.display = 'block';

    const header = document.querySelector('header h1');
    if (header) header.textContent = 'SmartFix ERP';
  }


  /* ============================================================
     9. HELPERS
     ============================================================ */
  function C_escape(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function C_money(n) {
    const v = Number(n) || 0;
    return '₹' + v.toLocaleString('en-IN', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function C_fmtDatePretty(d) {
    if (!d) return '—';
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dd = String(d.getDate()).padStart(2, '0');
    return `${dd}-${months[d.getMonth()]}-${d.getFullYear()}`;
  }

  function shortLedger(name) {
    if (!name) return '—';
    if (name === 'Cash-in-Hand') return 'Cash';
    if (name === 'Bank / UPI') return 'Bank / UPI';
    if (name === 'Card Payment') return 'Card';
    if (name === 'Bajaj / EMI Finance') return 'Bajaj EMI';
    if (name === 'Credit / Sundry Debtors') return 'Udhar';
    return name;
  }


  /* ============================================================
     10. KEYBOARD / CLICK HANDLERS
     ============================================================ */
  /* Escape key closes modal */
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  /* Click outside modal to close */
  const modal = document.getElementById('invModal');
  if (modal) {
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
  }

  /* Print styles — inject on load */
  const style = document.createElement('style');
  style.textContent = `
    @media print {
      body > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; }
      @page { size: A4 portrait; margin: 6mm; }
    }
  `;
  document.head.appendChild(style);


  /* ============================================================
     11. EXPOSE API
     ============================================================ */
  window.openInvoice = openInvoice;
  window.closeModal = closeModal;
  window.printCurrentInvoice = printCurrentInvoice;
  window.shareCurrentInvoice = shareCurrentInvoice;
  window.searchAgain = searchAgain;
  window.exitPortal = exitPortal;


  /* ============================================================
     12. BOOT
     ============================================================ */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  console.log('%c🛍 Customer portal ready', 'color:#10b981;font-weight:bold');
})();
</script>

</body>
</html>
