<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SmartFix ERP — Dashboard</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%230ea5e9'/%3E%3Cstop offset='1' stop-color='%230369a1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='100' fill='url(%23g)'/%3E%3Ctext x='50%25' y='65%25' font-size='300' text-anchor='middle' fill='white'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%230ea5e9'/%3E%3Cstop offset='1' stop-color='%230369a1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='100' fill='url(%23g)'/%3E%3Ctext x='50%25' y='65%25' font-size='300' text-anchor='middle' fill='white'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E">

<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SmartFix ERP">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdn.tailwindcss.com"></script>

<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; background: #060b14; color: #e2e8f0; overflow: hidden; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.4); }

/* Sidebar */
.sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #94a3b8; transition: all 0.2s; text-decoration: none; margin-bottom: 2px; cursor: pointer; outline: none; }
.sidebar-link:hover { background: rgba(30, 41, 59, 0.6); color: #e2e8f0; }
.sidebar-link:focus { background: rgba(14, 165, 233, 0.2); color: #38bdf8; box-shadow: inset 0 0 0 1px #0ea5e9; }
.sidebar-link.active { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border-right: 3px solid #38bdf8; }
.sidebar-cat-title { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #475569; letter-spacing: 1px; padding: 16px 16px 8px 16px; }

/* Top Bar */
.glass-header { background: rgba(6, 11, 20, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(30, 41, 59, 0.6); }

/* Animations */
.fade-in { animation: sfFadeIn 0.3s ease-out; }
@keyframes sfFadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* Print Isolation */
@media screen { #isolatedPrintContainer { display: none !important; } }
@media print {
  @page { size: A4 portrait; margin: 4mm; }
  html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; color: #000 !important; width: 100% !important; height: 100% !important; overflow: visible !important; }
  #app-sidebar, .no-print, #topbar { display: none !important; }
  #isolatedPrintContainer { display: flex !important; flex-direction: column !important; justify-content: space-between !important; position: static !important; width: 100% !important; max-width: 202mm !important; min-height: 285mm !important; height: 285mm !important; margin: 0 auto !important; padding: 2mm 3mm !important; box-sizing: border-box !important; page-break-after: avoid !important; page-break-inside: avoid !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}

/* Loader */
.sf-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(56, 189, 248, 0.2); border-top-color: #0ea5e9; border-radius: 50%; animation: sfSpin 0.7s linear infinite; }
@keyframes sfSpin { to { transform: rotate(360deg); } }

/* Status Dot */
.status-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #10b981; margin-right: 5px; }
</style>
</head>

<body>

<div id="isolatedPrintContainer"></div>

<!-- MAIN APP WRAPPER (Flex Layout) -->
<div class="flex h-screen w-full overflow-hidden relative">

  <!-- SIDEBAR (LEFT) -->
  <aside id="app-sidebar" class="w-64 flex-shrink-0 bg-[#0b1120] border-r border-slate-800 flex flex-col transition-all duration-300 z-50 absolute md:relative h-full -translate-x-full md:translate-x-0">
    
    <!-- Logo Area -->
    <div class="h-16 flex items-center px-4 border-b border-slate-800">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-sky-500 to-blue-700 flex items-center justify-center text-white text-sm shadow-lg shadow-sky-500/30 mr-2">🔧</div>
      <span class="text-base font-black tracking-tight text-white">SmartFix <span class="text-sky-400">ERP</span></span>
      <!-- Close btn for mobile -->
      <button onclick="toggleSidebar()" class="ml-auto md:hidden text-slate-400 hover:text-white">✕</button>
    </div>

    <!-- Dynamic Nav Links (Injected by router.js) -->
    <div id="sidebarNavContainer" class="flex-1 overflow-y-auto py-2">
      <!-- router.js will populate this -->
      <div class="p-4 text-center text-xs text-slate-500">Loading menu...</div>
    </div>

    <!-- Collapse Footer -->
    <div class="p-3 border-t border-slate-800">
      <button onclick="toggleSidebar()" class="w-full flex items-center justify-center gap-2 py-2 text-[11px] font-bold text-slate-500 hover:text-slate-300 transition">
        <span>«</span> Collapse
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA (RIGHT) -->
  <div class="flex-1 flex flex-col h-full min-w-0 bg-[#060b14] relative">

    <!-- TOP BAR -->
    <header id="topbar" class="h-16 flex-shrink-0 glass-header flex items-center justify-between px-3 sm:px-5 z-40 relative">
      
      <!-- Left: Mobile Menu Btn & Store Name -->
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white text-xl">☰</button>
        <div class="hidden sm:flex items-center">
           <span class="text-sm font-bold text-white" data-store-name>Loading...</span>
           <span class="text-[10px] text-emerald-400 ml-2 flex items-center"><span class="status-dot"></span>Online</span>
        </div>
      </div>

      <!-- Center: Global Search -->
      <div class="flex-1 max-w-md mx-4 hidden md:block">
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">🔍</span>
          <input type="text" placeholder="Search 'Ctrl + K'" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg pl-9 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500 transition-colors">
          <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded font-mono border border-slate-700">Ctrl K</span>
        </div>
      </div>

      <!-- Right: Actions & Profile -->
      <div class="flex items-center gap-2 sm:gap-3">
        
        <!-- ⭐ Backup Button (One Click) -->
        <button onclick="triggerQuickBackup()" class="w-8 h-8 rounded-lg bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-800/50 text-emerald-400 flex items-center justify-center text-sm transition-colors" title="Quick Backup">💾</button>
        
        <!-- ⭐ Settings Button (Direct Link) -->
        <button onclick="SF.router.go('settings')" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 text-sm transition-colors" title="Settings">⚙️</button>
        
        <div class="w-px h-6 bg-slate-700 mx-1 hidden sm:block"></div>

        <!-- ⭐ User Profile (Store Name) -->
        <div class="flex items-center gap-2 cursor-pointer p-1 pr-2 rounded-lg hover:bg-slate-800/50 transition" onclick="SF.router.go('settings')">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold shadow-lg">🏪</div>
          <div class="hidden sm:block text-left">
            <div class="text-[12px] font-bold text-white leading-tight truncate max-w-[120px]" data-store-name>Store Name</div>
            <div class="text-[9px] text-slate-400">Manage Account</div>
          </div>
        </div>

        <button type="button" id="logoutBtn" class="w-8 h-8 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/50 text-rose-400 flex items-center justify-center text-sm ml-1 transition-colors" title="Sign out">⏏</button>
      </div>
    </header>

    <!-- MODULE CONTAINER -->
    <main id="moduleContainer" class="flex-1 overflow-y-auto relative fade-in p-3 sm:p-4">
      <!-- Modules load here -->
    </main>

  </div>
</div>

<!-- Mobile Overlay (Closes sidebar) -->
<div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

<style>
@supports(padding: max(0px)) { body { padding-bottom: env(safe-area-inset-bottom, 0); } }
</style>

<script type="module" src="./js/app-init.js"></script>
<script type="module" src="./js/pwa-install.js"></script>

<script>
// Sidebar Toggle Logic
window.toggleSidebar = function() {
  const sidebar = document.getElementById('app-sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  
  if (sidebar.classList.contains('-translate-x-full')) {
    sidebar.classList.remove('-translate-x-full');
    overlay.classList.remove('hidden');
  } else {
    sidebar.classList.add('-translate-x-full');
    overlay.classList.add('hidden');
  }
}

// ⭐ One-Click Backup Logic
window.triggerQuickBackup = async function() {
  try {
    // Try using the settings module if loaded
    if (window.SF && window.SF.settings && typeof window.SF.settings.runDailyBackupNow === 'function') {
      await window.SF.settings.runDailyBackupNow();
      return;
    }
    
    // Fallback: simple JSON download from localStorage
    const keys = ['sfp_store_profile', 'sfp_invoices', 'sfp_stock', 'sfp_parties', 'sfp_purchases', 'sfp_vouchers', 'sfp_credit_notes', 'sfp_staff', 'sfp_repairs'];
    const backup = { exportedAt: new Date().toISOString(), app: 'SmartFix ERP' };
    
    keys.forEach(k => {
      try { backup[k] = JSON.parse(localStorage.getItem(k) || '[]'); } catch(e) {}
    });
    
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `SmartFix_Backup_${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    if (window.SF && window.SF.common && window.SF.common.toast) {
      window.SF.common.toast('✅ Backup downloaded successfully', 'success');
    } else {
      alert('✅ Backup downloaded successfully');
    }
  } catch (err) {
    alert('Backup failed: ' + err.message);
  }
};

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then((reg) => console.log('✅ SW registered:', reg.scope))
      .catch((err) => console.log('SW registration skipped:', err.message));
  });
}

// Hash routing default
window.addEventListener('load', () => {
  if (!window.location.hash) {
    history.replaceState(null, '', '#dashboard');
  }
});
</script>

</body>
</html>
