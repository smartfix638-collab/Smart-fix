<!-- ============================================================
     SMARTFIX ERP — Mobile Repair / Job Card Module (v4.3.0)
     File: modules/repair.html
     ============================================================ -->

<section id="repairModule" class="grid grid-cols-1 lg:grid-cols-12 gap-4">

  <!-- ============================================================
       LEFT PANEL — JOB FORM
       ============================================================ -->
  <div class="lg:col-span-5 space-y-3">

    <!-- Job header -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h2 class="font-bold text-xs uppercase tracking-wider text-white" id="repFormTitle">🔧 New Job Card</h2>
        <button type="button" onclick="SF.repair.resetForm()" id="repResetBtn"
                class="text-[10px] text-slate-500 hover:text-slate-300 font-bold hidden">✕ Cancel Edit</button>
      </div>
      <input type="hidden" id="repEditId" value="">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Job No (Auto)</label>
          <input type="text" id="repJobNo" readonly
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono font-bold text-emerald-300">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Date</label>
          <input type="date" id="repDate"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100">
        </div>
      </div>
    </div>

    <!-- Customer info -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h3 class="text-[11px] font-bold uppercase tracking-wider text-sky-400 border-b border-slate-800 pb-2">👤 Customer</h3>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Name *</label>
          <input type="text" id="repCustName" list="repCustomerList" placeholder="Customer name"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
          <datalist id="repCustomerList"></datalist>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Phone *</label>
          <input type="tel" id="repCustPhone" maxlength="10" placeholder="10-digit" inputmode="numeric"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono">
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Address</label>
        <input type="text" id="repCustAddr" placeholder="City / Address"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
      </div>
    </div>

    <!-- Device info -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h3 class="text-[11px] font-bold uppercase tracking-wider text-sky-400 border-b border-slate-800 pb-2">📱 Device</h3>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Brand</label>
          <input type="text" id="repBrand" list="repBrandList" placeholder="Samsung / iPhone"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold">
          <datalist id="repBrandList">
            <option value="Apple"><option value="Samsung"><option value="Xiaomi">
            <option value="OnePlus"><option value="OPPO"><option value="Vivo">
            <option value="Realme"><option value="Motorola"><option value="Google">
            <option value="Nokia"><option value="Other">
          </datalist>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Model *</label>
          <input type="text" id="repModel" placeholder="Galaxy A15"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">IMEI</label>
          <input type="text" id="repIMEI" placeholder="Optional" maxlength="20"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Color</label>
          <input type="text" id="repColor" placeholder="Black / Blue"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Device Password / Pattern</label>
        <input type="text" id="repPassword" placeholder="If provided (optional)"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono">
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Accessories Received</label>
        <div class="flex flex-wrap gap-3 text-[11px] text-slate-300">
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="SIM" data-key="sim"> SIM</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="Memory Card" data-key="sdcard"> Memory Card</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="Cover" data-key="cover"> Cover</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="Charger" data-key="charger"> Charger</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="Box" data-key="box"> Box</label>
        </div>
      </div>
    </div>

    <!-- Issue + cost -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h3 class="text-[11px] font-bold uppercase tracking-wider text-sky-400 border-b border-slate-800 pb-2">🛠 Issue & Cost</h3>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Problem Description *</label>
        <textarea id="repIssue" rows="3" placeholder="e.g. Screen broken, not charging..."
                  class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs resize-none"></textarea>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Est. Cost ₹</label>
          <input type="number" id="repEstimate" placeholder="0" step="0.01"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold text-amber-300 text-right">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Advance ₹</label>
          <input type="number" id="repAdvance" placeholder="0" step="0.01"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold text-emerald-300 text-right">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Warranty</label>
          <select id="repWarrantyDays"
                  class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs">
            <option value="0">No warranty</option>
            <option value="15">15 days</option>
            <option value="30" selected>30 days</option>
            <option value="60">60 days</option>
            <option value="90">90 days</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Technician</label>
        <select id="repTechnician"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
          <option value="">— Unassigned —</option>
        </select>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Internal Notes</label>
        <input type="text" id="repNotes" placeholder="Optional note"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
      </div>
    </div>

    <!-- Save -->
    <button type="button" id="repSaveBtn" onclick="SF.repair.save()"
            class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-black py-3.5 rounded-2xl text-sm shadow-lg shadow-indigo-600/30 transition">
      💾 Save Job Card
    </button>

  </div>


  <!-- ============================================================
       RIGHT PANEL — JOB LIST
       ============================================================ -->
  <div class="lg:col-span-7 space-y-3">

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      <div class="bg-sky-950/40 border border-sky-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-sky-400">Total Jobs</div>
        <div id="repStatTotal" class="text-lg font-black text-sky-300 mt-0.5">0</div>
      </div>
      <div class="bg-amber-950/40 border border-amber-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-amber-400">In Progress</div>
        <div id="repStatProgress" class="text-lg font-black text-amber-300 mt-0.5">0</div>
      </div>
      <div class="bg-emerald-950/40 border border-emerald-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-emerald-400">Ready</div>
        <div id="repStatReady" class="text-lg font-black text-emerald-300 mt-0.5">0</div>
      </div>
      <div class="bg-violet-950/40 border border-violet-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-violet-400">Delivered</div>
        <div id="repStatDelivered" class="text-lg font-black text-violet-300 mt-0.5">0</div>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-3 flex flex-wrap gap-2 items-center">
      <input type="text" id="repSearchInput" oninput="SF.repair.renderList()"
             placeholder="🔍 Job no / Name / Phone / IMEI / Model..."
             class="flex-1 min-w-[200px] bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
      <select id="repStatusFilter" onchange="SF.repair.renderList()"
              class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
        <option value="ALL">All Status</option>
        <option value="RECEIVED">📥 Received</option>
        <option value="DIAGNOSED">🔬 Diagnosed</option>
        <option value="WAITING_APPROVAL">⏳ Waiting Approval</option>
        <option value="IN_REPAIR">🔧 In Repair</option>
        <option value="READY">✅ Ready</option>
        <option value="DELIVERED">📦 Delivered</option>
        <option value="CANCELLED">❌ Cancelled</option>
      </select>
      <select id="repTechFilter" onchange="SF.repair.renderList()"
              class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
        <option value="ALL">All Technicians</option>
      </select>
    </div>

    <!-- Job list -->
    <div id="repJobList" class="space-y-2">
      <div class="text-center py-10 text-slate-500 text-xs">Loading...</div>
    </div>

  </div>

</section>


<!-- ============================================================
     JOB DETAIL MODAL
     ============================================================ -->
<div id="repDetailModal" class="fixed inset-0 z-[9999] hidden" style="background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);">
  <div class="flex items-end sm:items-center justify-center h-full p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl max-w-3xl w-full max-h-[95vh] sm:max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/70 flex-shrink-0">
        <div class="min-w-0 flex-1">
          <h3 id="repModalTitle" class="font-bold text-white text-sm truncate">Job Card Details</h3>
          <p id="repModalSubtitle" class="text-[11px] text-slate-400 mt-0.5 truncate">—</p>
        </div>
        <button type="button" onclick="SF.repair.closeModal()"
                class="text-slate-400 hover:text-white text-2xl font-bold w-9 h-9 flex items-center justify-center rounded-lg hover:bg-slate-800 flex-shrink-0">✕</button>
      </div>
      <div id="repModalBody" class="p-4 overflow-y-auto flex-1 space-y-3"></div>
      <div class="p-3 border-t border-slate-800 bg-slate-950/70 flex flex-wrap gap-2 flex-shrink-0">
        <button type="button" onclick="SF.repair.printSlip()"
                class="flex-1 min-w-[120px] bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-lg text-xs transition">🖨️ Print Slip</button>
        <button type="button" onclick="SF.repair.shareWhatsApp()"
                class="flex-1 min-w-[120px] bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-xs transition">📱 WhatsApp</button>
        <button type="button" onclick="SF.repair.deleteJob()"
                class="bg-rose-950/60 hover:bg-rose-900/60 text-rose-300 font-bold py-2.5 px-3 rounded-lg text-xs border border-rose-800/60 transition">🗑 Delete</button>
      </div>
    </div>
  </div>
</div>


<script>
(function () {
  'use strict';

  const S  = window.SF?.state?.state;
  const C  = window.SF?.common;
  const Cl = window.SF?.cloud;

  if (!S || !C) { console.error('Repair: SF globals not ready'); return; }

  const STORE_ID_KEY = 'sfp_current_store';

  const STATUS = {
    RECEIVED:         { label: 'Received',          color: 'sky',     icon: '📥', bg: 'bg-sky-950/60',     text: 'text-sky-300',     border: 'border-sky-800/60' },
    DIAGNOSED:        { label: 'Diagnosed',         color: 'purple',  icon: '🔬', bg: 'bg-purple-950/60',  text: 'text-purple-300',  border: 'border-purple-800/60' },
    WAITING_APPROVAL: { label: 'Waiting Approval',  color: 'amber',   icon: '⏳', bg: 'bg-amber-950/60',   text: 'text-amber-300',   border: 'border-amber-800/60' },
    IN_REPAIR:        { label: 'In Repair',         color: 'orange',  icon: '🔧', bg: 'bg-orange-950/60',  text: 'text-orange-300',  border: 'border-orange-800/60' },
    READY:            { label: 'Ready',             color: 'emerald', icon: '✅', bg: 'bg-emerald-950/60', text: 'text-emerald-300', border: 'border-emerald-800/60' },
    DELIVERED:        { label: 'Delivered',         color: 'violet',  icon: '📦', bg: 'bg-violet-950/60',  text: 'text-violet-300',  border: 'border-violet-800/60' },
    CANCELLED:        { label: 'Cancelled',         color: 'rose',    icon: '❌', bg: 'bg-rose-950/60',    text: 'text-rose-300',    border: 'border-rose-800/60' }
  };

  const RM = {
    editingId: null,
    currentJob: null
  };

  function requirePerm(perm, msg) {
    if (!window.SF?.perms?.can?.(perm)) {
      C.toast('🔒 ' + (msg || 'Permission denied'), 'error', 3000);
      return false;
    }
    return true;
  }

  function getStoreId() {
    const meta = window.SF?.perms?.getUserMeta?.() || {};
    const store = S.store || {};
    return meta.storeId || store.storeId || store.uid;
  }

  async function nextJobNo() {
    try {
      const d = new Date();
      const fy = C.getFY(d).short;
      const storeId = getStoreId();
      if (!storeId) return 'JOB-' + fy + '-TMP';
      const no = await Cl.nextAtomicNumber('repair', fy);
      if (no) return no.replace('SFP', 'JOB').replace('PUR', 'JOB').replace('CRN', 'JOB');
      return 'JOB-' + fy + '-TMP';
    } catch (e) {
      return 'JOB-' + C.getFY(new Date()).short + '-TMP' + Date.now().toString().slice(-4);
    }
  }


  /* ============================================================
     INIT
     ============================================================ */
  async function init_repairModule() {
    console.log('%c🔧 Repair module initialized (v4.3.0)', 'color:#8b5cf6;font-weight:bold');

    if (!window.SF?.perms?.can?.('repair.view')) {
      const c = document.getElementById('moduleContainer');
      if (c) c.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:28px;background:#1e1b2e;border:1px solid #7f1d1d;border-radius:16px;text-align:center;"><div style="font-size:42px;margin-bottom:12px">🔒</div><div style="font-size:16px;font-weight:800;color:#fca5a5;">Access Denied</div></div>';
      return { onUnload: () => {} };
    }

    RM.editingId = null;
    RM.currentJob = null;

    /* Date + job no */
    const dEl = document.getElementById('repDate');
    if (dEl && !dEl.value) dEl.value = C.fmtDate(new Date());
    const jobNoEl = document.getElementById('repJobNo');
    if (jobNoEl) jobNoEl.value = await nextJobNo();

    /* Technicians */
    populateTechnicians();
    populateCustomerList();

    /* Render */
    renderList();

    /* Subscribe */
    if (window.SF?.state?.on) {
      window.SF.state.on('change:repairs', () => renderList());
      window.SF.state.on('change:staff', () => populateTechnicians());
      window.SF.state.on('change:parties', () => populateCustomerList());
    }

    return { onUnload: () => {} };
  }

  function populateTechnicians() {
    const sel = document.getElementById('repTechnician');
    const filterSel = document.getElementById('repTechFilter');
    const staff = (S.staff || []).filter((s) => {
      const d = (s.designation || '').toLowerCase();
      return d.includes('tech') || d.includes('repair') || d.includes('service') || d === '';
    });

    const options = staff.map((s) => `<option value="${s.id}">${C.escapeHTML(s.name)}${s.designation ? ' — ' + C.escapeHTML(s.designation) : ''}</option>`).join('');

    if (sel) sel.innerHTML = '<option value="">— Unassigned —</option>' + options;
    if (filterSel) {
      filterSel.innerHTML = '<option value="ALL">All Technicians</option>' + options;
    }
  }

  function populateCustomerList() {
    const dl = document.getElementById('repCustomerList');
    if (!dl) return;
    const parties = (S.parties || []).filter((p) => p.type === 'CUSTOMER');
    dl.innerHTML = parties.map((p) => `<option value="${C.escapeHTML(p.name)}">${C.escapeHTML(p.phone || '')}</option>`).join('');
  }


  /* ============================================================
     SAVE JOB
     ============================================================ */
  async function save() {
    if (!requirePerm('repair.create', 'Cannot create job cards')) return;

    const jobNo = document.getElementById('repJobNo')?.value || '';
    const date = document.getElementById('repDate')?.value || C.fmtDate(new Date());
    const custName = (document.getElementById('repCustName')?.value || '').trim();
    const custPhone = (document.getElementById('repCustPhone')?.value || '').trim();
    const custAddr = (document.getElementById('repCustAddr')?.value || '').trim();
    const brand = (document.getElementById('repBrand')?.value || '').trim();
    const model = (document.getElementById('repModel')?.value || '').trim();
    const imei = (document.getElementById('repIMEI')?.value || '').trim();
    const color = (document.getElementById('repColor')?.value || '').trim();
    const password = (document.getElementById('repPassword')?.value || '').trim();
    const issue = (document.getElementById('repIssue')?.value || '').trim();
    const estimate = parseFloat(document.getElementById('repEstimate')?.value) || 0;
    const advance = parseFloat(document.getElementById('repAdvance')?.value) || 0;
    const warrantyDays = parseInt(document.getElementById('repWarrantyDays')?.value, 10) || 0;
    const techId = document.getElementById('repTechnician')?.value || '';
    const notes = (document.getElementById('repNotes')?.value || '').trim();

    /* Accessories */
    const accessories = [];
    document.querySelectorAll('.rep-acc:checked').forEach((cb) => {
      accessories.push(cb.value);
    });

    /* Validation */
    if (!custName || custName.length < 2) { C.toast('Enter customer name', 'warning'); return; }
    if (!/^\d{10}$/.test(custPhone)) { C.toast('Enter valid 10-digit phone', 'warning'); return; }
    if (!model) { C.toast('Enter device model', 'warning'); return; }
    if (!issue || issue.length < 3) { C.toast('Describe the problem', 'warning'); return; }

    /* Technician name */
    let techName = '';
    if (techId) {
      const t = (S.staff || []).find((x) => x.id === techId);
      if (t) techName = t.name;
    }

    const storeId = getStoreId();
    if (!storeId) { C.toast('Store not resolved', 'error'); return; }

    const record = {
      id: RM.editingId || jobNo,
      jobNo: RM.editingId ? (document.getElementById('repEditId')?.value || jobNo) : jobNo,
      date,
      customerName: custName,
      customerPhone: custPhone,
      customerAddress: custAddr,
      deviceBrand: brand,
      deviceModel: model,
      deviceIMEI: ime,
      deviceColor: color,
      devicePassword: password,
      accessories,
      issueDescription: issue,
      estimatedCost: +estimate.toFixed(2),
      advancePaid: +advance.toFixed(2),
      finalCost: 0,
      balanceDue: 0,
      status: RM.editingId ? (RM.currentJob?.status || 'RECEIVED') : 'RECEIVED',
      technicianId: techId,
      technicianName: techName,
      notes,
      warrantyDays,
      partsUsed: RM.editingId ? (RM.currentJob?.partsUsed || []) : [],
      statusHistory: RM.editingId
        ? (RM.currentJob?.statusHistory || [])
        : [{ status: 'RECEIVED', timestamp: new Date().toISOString(), by: (window.SF?.perms?.getUserMeta?.()?.name || 'Staff') }],
      createdAt: RM.editingId ? (RM.currentJob?.createdAt || new Date().toISOString()) : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };

    /* If editing and status DELIVERED, keep final cost */
    if (RM.editingId && RM.currentJob?.status === 'DELIVERED') {
      record.finalCost = RM.currentJob.finalCost || 0;
      record.balanceDue = record.finalCost - record.advancePaid;
    }

    if (!Array.isArray(S.repairs)) S.repairs = [];

    if (RM.editingId) {
      const idx = S.repairs.findIndex((x) => x.id === RM.editingId);
      if (idx !== -1) S.repairs[idx] = record;
      C.toast('Job updated: ' + record.jobNo, 'success');
    } else {
      S.repairs.unshift(record);
      C.toast('Job created: ' + record.jobNo, 'success');
    }

    C.safeSave('sfp_repairs', S.repairs);
    C.playBeep();

    try { await Cl.pushOne('repairs', record); } catch (e) { C.toast('Saved locally. Sync pending.', 'warning', 3000); }
    try { window.SF.state.logAudit(RM.editingId ? 'REPAIR_UPDATE' : 'REPAIR_CREATE', record.jobNo + ' | ' + custName + ' | ' + model); } catch (e) {}

    resetForm();
    renderList();
  }


  function resetForm() {
    RM.editingId = null;
    RM.currentJob = null;

    ['repCustName','repCustPhone','repCustAddr','repBrand','repModel','repIMEI','repColor','repPassword','repIssue','repEstimate','repAdvance','repNotes'].forEach((id) => {
      const el = document.getElementById(id);

  /* ============================================================
     RENDER LIST
     ============================================================ */
  function renderList() {
    const listEl = document.getElementById('repJobList');
    if (!listEl) return;

    const repairs = S.repairs || [];
    const q = (document.getElementById('repSearchInput')?.value || '').trim().toLowerCase();
    const statusFilter = document.getElementById('repStatusFilter')?.value || 'ALL';
    const techFilter = document.getElementById('repTechFilter')?.value || 'ALL';

    /* Stats */
    const total = repairs.length;
    const progress = repairs.filter((r) => ['RECEIVED','DIAGNOSED','WAITING_APPROVAL','IN_REPAIR'].includes(r.status)).length;
    const ready = repairs.filter((r) => r.status === 'READY').length;
    const delivered = repairs.filter((r) => r.status === 'DELIVERED').length;

    setText('repStatTotal', total);
    setText('repStatProgress', progress);
    setText('repStatReady', ready);
    setText('repStatDelivered', delivered);

    /* Filter */
    let filtered = repairs;
    if (statusFilter !== 'ALL') filtered = filtered.filter((r) => r.status === statusFilter);
    if (techFilter !== 'ALL') filtered = filtered.filter((r) => r.technicianId === techFilter);
    if (q) {
      filtered = filtered.filter((r) => {
        const blob = (
          (r.jobNo || '') + ' ' +
          (r.customerName || '') + ' ' +
          (r.customerPhone || '') + ' ' +
          (r.deviceBrand || '') + ' ' +
          (r.deviceModel || '') + ' ' +
          (r.deviceIMEI || '') + ' ' +
          (r.issueDescription || '')
        ).toLowerCase();
        return blob.includes(q);
      });
    }

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-10 text-center text-slate-500 text-xs">No job cards found.</div>';

    listEl.innerHTML = filtered.map((job) => {
      const st = STATUS[job.status] || STATUS.RECEIVED;

      return `

                ${daysOld > 3 && job.status !== 'DELIVERED' && job.status !== 'CANCELLED'

  /* ============================================================
     CHANGE STATUS
     ============================================================ */
  async function changeStatus(newStatus) {
    if (!requirePerm('repair.edit', 'Cannot change status')) return;
    const job = RM.currentJob;
    if (!job) return;

    if (job.status === newStatus) return;

    /* If DELIVERED → record final cost + balance */
    if (newStatus === 'DELIVERED') {
      const finalInput = prompt('Final repair cost (₹):', (job.finalCost || job.estimatedCost || 0).toFixed(2));
      if (finalInput === null) return;
      const finalCost = parseFloat(finalInput);
      if (isNaN(finalCost) || finalCost < 0) { C.toast('Invalid amount', 'warning'); return; }

      const remaining = finalCost - (job.advancePaid || 0);
      if (remaining > 0) {
        const collect = await C.confirmDialog(
          'Collect Payment?',
          'Balance due: ₹' + remaining.toFixed(2) + '\n\nCollect now?',
          'Collected',
          false
        );
        if (collect) {
          /* Add to cash book via voucher */
          const voucher = {
            id: 'vch-rep-' + Date.now(),
            type: 'RECEIPT',
            date: C.fmtDate(new Date()),
            amount: remaining,
            category: 'Repair Payment — ' + job.customerName,
            account: 'Cash-in-Hand',
            narration: 'Job ' + job.jobNo + ' — final payment',
            createdAt: new Date().toISOString(),
            _autoGenerated: true,
            _sourceRepairId: job.id
          };
          if (!Array.isArray(S.vouchers)) S.vouchers = [];
          S.vouchers.unshift(voucher);
          C.safeSave('sfp_vouchers', S.vouchers);
          try { await Cl.pushOne('vouchers', voucher); } catch (e) {}
        }
      }

      job.finalCost = +finalCost.toFixed(2);
      job.balanceDue = Math.max(0, finalCost - (job.advancePaid || 0));
      job.deliveredAt = new Date().toISOString();
    }

    job.status = newStatus;
    job.updatedAt = new Date().toISOString();

    if (!Array.isArray(job.statusHistory)) job.statusHistory = [];
    job.statusHistory.push({
      status: newStatus,
      timestamp: new Date().toISOString(),
      by: window.SF?.perms?.getUserMeta?.()?.name || 'Staff'
    });

    C.safeSave('sfp_repairs', S.repairs);

    try {
      await Cl.pushOne('repairs', job);
    } catch (e) { C.toast('Saved locally. Sync pending.', 'warning', 3000); }

    try { window.SF.state.logAudit('REPAIR_STATUS', job.jobNo + ' → ' + (STATUS[newStatus]?.label || newStatus)); } catch (e) {}

    C.toast('✅ Status: ' + (STATUS[newStatus]?.label || newStatus), 'success', 2500);
    C.playBeep();

    openDetail(job.id);
    renderList();
  }


  /* ============================================================
     DELETE
     ============================================================ */
  async function deleteJob() {
    if (!requirePerm('repair.delete', 'Only owner can delete')) return;
    const job = RM.currentJob;
    if (!job) return;

    const pin = prompt('🔒 Master PIN to delete:');
    if (!pin) return;
    if (pin !== (S.profile?.masterPin || '1234')) { C.toast('Incorrect PIN', 'error'); C.playBeep(); return; }

    const ok = await C.confirmDialog('Delete Job Card?', job.jobNo + '\n' + job.customerName + '\n\nThis cannot be undone.', 'Delete', true);
    if (!ok) return;

    S.repairs = (S.repairs || []).filter((r) => r.id !== job.id);
    C.safeSave('sfp_repairs', S.repairs);
    try { await Cl.deleteOne('repairs', job.id); } catch (e) {}

    try { window.SF.state.logAudit('REPAIR_DELETE', job.jobNo + ' | ' + job.customerName); } catch (e) {}

    C.toast('Job deleted', 'success');
    closeModal();
    renderList();
  }

            <strong style="color:#475569;">📦 Accessories:</strong> ${job.accessories.map((a) => C.escapeHTML(a)).join(', ')}
          </div>
        ` : ''}

        <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px;">
          <thead>
            <tr style="background:linear-gradient(90deg,#6366f1,#4338ca);color:white;">
              <th style="padding:7px 10px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;">Particulars</th>
              <th style="padding:7px 10px;text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;width:120px;">Amount (₹)</th>
            </tr>
          </thead>
          <tbody>
            <tr style="border-bottom:1px solid #e2e8f0;">
              <td style="padding:7px 10px;color:#334155;">Estimated Repair Cost</td>
              <td style="padding:7px 10px;text-align:right;font-family:monospace;font-weight:700;">${(job.estimatedCost || 0).toFixed(2)}</td>
            </tr>
            <tr style="border-bottom:1px solid #e2e8f0;">
              <td style="padding:7px 10px;color:#334155;">Advance Paid</td>
              <td style="padding:7px 10px;text-align:right;font-family:monospace;color:#059669;font-weight:700;">-${(job.advancePaid || 0).toFixed(2)}</td>
            </tr>
            ${job.finalCost > 0 ? `
              <tr style="border-bottom:1px solid #e2e8f0;">
                <td style="padding:7px 10px;color:#334155;">Final Repair Cost</td>
                <td style="padding:7px 10px;text-align:right;font-family:monospace;font-weight:700;">${job.finalCost.toFixed(2)}</td>
              </tr>
            ` : ''}
            <tr style="background:#eef2ff;border-top:2px solid #6366f1;">
              <td style="padding:9px 10px;font-weight:900;font-size:13px;color:#3730a3;text-transform:uppercase;">Balance Due</td>
              <td style="padding:9px 10px;text-align:right;font-family:monospace;font-weight:900;font-size:15px;color:#3730a3;">₹ ${Math.max(0, balance).toFixed(2)}</td>
            </tr>
          </tbody>
        </table>

        ${job.warrantyDays > 0 ? `
          <div style="background:#ecfdf5;border:1px solid #86efac;border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:10px;color:#065f46;">
            🛡️ <strong>Warranty on this repair: ${job.warrantyDays} days</strong> (from delivery date)
          </div>
        ` : ''}

        <div style="background:#f8fafc;border-left:3px solid #6366f1;padding:6px 10px;font-size:9px;color:#475569;line-height:1.5;border-radius:3px;">
          <strong style="color:#0f172a;">Terms:</strong><br>
          1. Please bring this receipt when collecting the device.<br>
          2. Warranty covers the repaired part only, not physical damage or liquid.<br>
          3. Devices not collected within 30 days may attract storage charges.<br>
          4. Shop is not responsible for data loss during repair.
        </div>

        <div style="margin-top:auto;padding-top:15px;display:flex;justify-content:space-between;align-items:flex-end;">
          <div style="font-size:8px;color:#94a3b8;font-family:monospace;">SmartFix ERP © 2026 • ${C.escapeHTML(prof.name || '')}</div>
          <div style="text-align:center;">
            <div style="height:30px;"></div>
            <div style="border-top:1px solid #94a3b8;padding-top:3px;font-size:9px;font-weight:700;color:#475569;width:150px;">Customer Signature</div>
          </div>
        </div>

      </div>
    `;

    /* iframe print */
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none;';
    iframe.setAttribute('aria-hidden', 'true');
    document.body.appendChild(iframe);
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Job Card</title><style>
      @page { size: A5 portrait; margin: 6mm; }
      * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html, body { margin:0; padding:0; background:#fff; color:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:10px; }
      .slip-wrapper { width:148mm; min-height:210mm; margin:0 auto; padding:6mm 8mm; display:flex; flex-direction:column; }
    </style></head><body><div class="slip-wrapper">${slipHTML}</div></body></html>`);
    doc.close();
    const triggerPrint = () => {
      try { iframe.contentWindow.focus(); iframe.contentWindow.print(); } catch (e) { C.toast('Print blocked', 'error'); }
      setTimeout(() => { try { document.body.removeChild(iframe); } catch (e) {} }, 1500);
    };
    if (iframe.contentWindow.document.readyState === 'complete') setTimeout(triggerPrint, 500);
    else { iframe.onload = () => setTimeout(triggerPrint, 500); setTimeout(triggerPrint, 1200); }
  }


  /* ============================================================
     WHATSAPP SHARE
     ============================================================ */
  function shareWhatsApp() {
    const job = RM.currentJob;
    if (!job) return;
    const prof = S.profile || {};
    const st = STATUS[job.status] || STATUS.RECEIVED;
    const balance = (job.finalCost || job.estimatedCost || 0) - (job.advancePaid || 0);

    const msg =
      `*${prof.name || 'Store'}*\n` +
      `🔧 *Repair Job Card*\n` +
      `━━━━━━━━━━━━━━━\n` +
      `📋 Job No: *${job.jobNo}*\n` +
      `📅 Date: ${job.date}\n` +
      `👤 Name: ${job.customerName}\n\n` +
      `📱 Device: ${job.deviceBrand || ''} ${job.deviceModel || ''}\n` +
      `${job.deviceIMEI ? '🔢 IMEI: ' + job.deviceIMEI + '\n' : ''}` +
      `\n🛠 Issue: ${job.issueDescription}\n\n` +
      `💰 Estimate: ₹${(job.estimatedCost || 0).toFixed(2)}\n` +
      `✅ Advance: ₹${(job.advancePaid || 0).toFixed(2)}\n` +
      `💵 Balance: ₹${Math.max(0, balance).toFixed(2)}\n\n` +
      `📌 Status: ${st.icon} ${st.label}\n` +
      `${job.warrantyDays > 0 ? '🛡️ Warranty: ' + job.warrantyDays + ' days\n' : ''}` +
      `\n${prof.phone ? '📞 ' + prof.phone : ''}\n` +
      `🙏 Thank you!`;

    const phone = job.customerPhone.replace(/\D/g, '');
    const url = phone.length === 10
      ? 'https://wa.me/91' + phone + '?text=' + encodeURIComponent(msg)
      : 'https://wa.me/?text=' + encodeURIComponent(msg);

    window.open(url, '_blank');
  }


  /* ============================================================
     EXPOSE
     ============================================================ */
  window.SF = window.SF || {};
  window.SF.repair = {
    init: init_repairModule,
    save,
    resetForm,
    editJob,
    renderList,
    openDetail,
    closeModal,
    changeStatus,
    deleteJob,
    printSlip,
    shareWhatsApp
  };

  window.init_repairModule = init_repairModule;

  if (document.getElementById('repairModule')) {
    init_repairModule();
  }
})();
</script>
