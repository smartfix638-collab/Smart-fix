<section id="repairModule" class="grid grid-cols-1 lg:grid-cols-12 gap-4">

  <div class="lg:col-span-5 space-y-3">

    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">

                class="text-[10px] text-slate-500 hover:text-slate-300 font-bold hidden">✕ Cancel Edit</button>
      </div>
      <input type="hidden" id="repEditId" value="">

        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Job No (Auto)</label>
          <input type="text" id="repJobNo" readonly

        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Date</label>
          <input type="date" id="repDate"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100">
        </div>
      </div>
    </div>

    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h3 class="text-[11px] font-bold uppercase tracking-wider text-sky-400 border-b border-slate-800 pb-2">👤 Customer</h3>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Name *</label>
          <input type="text" id="repCustName" list="repCustomerList" placeholder="Customer name"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
          <datalist id="repCustomerList"></datalist>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Phone *</label>
          <input type="tel" id="repCustPhone" maxlength="10" placeholder="10-digit" inputmode="numeric"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono">
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Address</label>
        <input type="text" id="repCustAddr" placeholder="City / Address"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
      </div>
    </div>

    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h3 class="text-[11px] font-bold uppercase tracking-wider text-sky-400 border-b border-slate-800 pb-2">📱 Device</h3>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Brand</label>
          <input type="text" id="repBrand" list="repBrandList" placeholder="Samsung / iPhone"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold">
          <datalist id="repBrandList">
            <option value="Apple"><option value="Samsung"><option value="Xiaomi">
            <option value="OnePlus"><option value="OPPO"><option value="Vivo">
            <option value="Realme"><option value="Motorola"><option value="Google">
            <option value="Nokia"><option value="Other">
          </datalist>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Model *</label>
          <input type="text" id="repModel" placeholder="Galaxy A15"

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">IMEI</label>

        </div>

          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Color</label>

        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Device Password / Pattern</label>
        <input type="text" id="repPassword" placeholder="If provided (optional)"

      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Accessories Received</label>
        <div class="flex flex-wrap gap-3 text-[11px] text-slate-300">
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="SIM"> SIM</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="Memory Card"> Memory Card</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="Cover"> Cover</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="Charger"> Charger</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" class="rep-acc" value="Box"> Box</label>
        </div>
      </div>
    </div>

    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h3 class="text-[11px] font-bold uppercase tracking-wider text-sky-400 border-b border-slate-800 pb-2">🛠 Issue & Cost</h3>

        <div>

            <option value="15">15 days</option>
            <option value="30" selected>30 days</option>

            <option value="90">90 days</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Technician</label>
        <select id="repTechnician"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
          <option value="">— Unassigned —</option>
        </select>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Internal Notes</label>
        <input type="text" id="repNotes" placeholder="Optional note"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
      </div>
    </div>

    <button type="button" id="repSaveBtn" onclick="SF.repair.save()"
            class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-black py-3.5 rounded-2xl text-sm shadow-lg shadow-indigo-600/30 transition">
      💾 Save Job Card
    </button>

    <div id="repDebugBox" class="bg-slate-950/60 border border-slate-800 rounded-lg p-2 text-[10px] font-mono text-slate-500 hidden">
      <div id="repDebugText"></div>
    </div>

  </div>

  <div class="lg:col-span-7 space-y-3">

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      <div class="bg-sky-950/40 border border-sky-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-sky-400">Total Jobs</div>
        <div id="repStatTotal" class="text-lg font-black text-sky-300 mt-0.5">0</div>
      </div>
      <div class="bg-amber-950/40 border border-amber-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-amber-400">In Progress</div>
        <div id="repStatProgress" class="text-lg font-black text-amber-300 mt-0.5">0</div>
      </div>
      <div class="bg-emerald-950/40 border border-emerald-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-emerald-400">Ready</div>
        <div id="repStatReady" class="text-lg font-black text-emerald-300 mt-0.5">0</div>
      </div>
      <div class="bg-violet-950/40 border border-violet-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-violet-400">Delivered</div>
        <div id="repStatDelivered" class="text-lg font-black text-violet-300 mt-0.5">0</div>
      </div>
    </div>

    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-3 flex flex-wrap gap-2 items-center">
      <input type="text" id="repSearchInput" oninput="SF.repair.renderList()"
             placeholder="🔍 Job no / Name / Phone / IMEI / Model..."
             class="flex-1 min-w-[200px] bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
      <select id="repStatusFilter" onchange="SF.repair.renderList()"
              class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
        <option value="ALL">All Status</option>

        <option value="DIAGNOSED">🔬 Diagnosed</option>
        <option value="WAITING_APPROVAL">⏳ Waiting</option>
        <option value="IN_REPAIR">🔧 In Repair</option>
        <option value="READY">✅ Ready</option>
        <option value="DELIVERED">📦 Delivered</option>

      <button type="button" onclick="SF.repair.reloadFromCloud()" title="Reload from cloud"
              class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-2 rounded-lg text-xs transition">↻</button>

    <div id="repJobList" class="space-y-2">

<script>
(function () {
  'use strict';

  const S  = window.SF?.state?.state;
  const C  = window.SF?.common;

  if (!S || !C) {
    console.error('Repair: SF globals not ready (state/common missing)');
    return;
  }

  const LOCAL_KEY = 'sfp_repairs';
  const COLLECTION = 'repairs';

  const STATUS = {
    RECEIVED:         { label: 'Received',          icon: '📥', text: 'text-sky-300',     bg: 'bg-sky-950/60',     border: 'border-sky-800/60' },
    DIAGNOSED:        { label: 'Diagnosed',         icon: '🔬', text: 'text-purple-300',  bg: 'bg-purple-950/60',  border: 'border-purple-800/60' },
    WAITING_APPROVAL: { label: 'Waiting Approval',  icon: '⏳', text: 'text-amber-300',   bg: 'bg-amber-950/60',   border: 'border-amber-800/60' },
    IN_REPAIR:        { label: 'In Repair',         icon: '🔧', text: 'text-orange-300',  bg: 'bg-orange-950/60',  border: 'border-orange-800/60' },
    READY:            { label: 'Ready',             icon: '✅', text: 'text-emerald-300', bg: 'bg-emerald-950/60', border: 'border-emerald-800/60' },
    DELIVERED:        { label: 'Delivered',         icon: '📦', text: 'text-violet-300',  bg: 'bg-violet-950/60',  border: 'border-violet-800/60' },
    CANCELLED:        { label: 'Cancelled',         icon: '❌', text: 'text-rose-300',    bg: 'bg-rose-950/60',    border: 'border-rose-800/60' }
  };

  const RM = {
    editingId: null,
    currentJob: null,
    jobs: [],
    unsub: null
  };


  /* ============ STORAGE ============ */
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      }
    } catch (e) { console.warn('Repair: local load failed', e); }
    return [];
  }

  function saveLocal(list) {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      console.error('Repair: local save failed', e);
      C.toast('Storage full! Free up space.', 'error', 4000);
      return false;
    }
  }

  function debug(msg) {
    console.log('%c🔧 [Repair]', 'color:#8b5cf6;font-weight:bold', msg);
    const box = document.getElementById('repDebugBox');
    const txt = document.getElementById('repDebugText');
    if (box && txt) {
      box.classList.remove('hidden');
      txt.textContent = msg;
    }
  }


  /* ============ FIRESTORE ============ */
  async function getFirestore() {
    try {
      const cfg = await import('./js/firebase-config.js');
      const fs = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      return { db: cfg.db, ...fs };
    } catch (e) {
      console.error('Firestore import failed:', e);
      return null;
    }
  }

  async function syncToCloud(job) {
    const storeId = getStoreId();
    if (!storeId || !job.id) return;
    try {
      const fb = await getFirestore();
      if (!fb) return;
      await fb.setDoc(
        fb.doc(fb.db, 'stores', storeId, COLLECTION, job.id),
        { ...job, _updatedAt: fb.serverTimestamp() },
        { merge: true }
      );
      debug('☁️ Synced: ' + job.id);
    } catch (e) {
      console.warn('Cloud sync failed:', e);
      debug('⚠️ Sync failed: ' + (e.code || e.message));
    }
  }

  async function deleteFromCloud(jobId) {
    const storeId = getStoreId();
    if (!storeId || !jobId) return;
    try {
      const fb = await getFirestore();
      if (!fb) return;
      await fb.deleteDoc(fb.doc(fb.db, 'stores', storeId, COLLECTION, jobId));
      debug('☁️ Deleted: ' + jobId);
    } catch (e) {}
  }

  async function loadFromCloud() {
    const storeId = getStoreId();
    if (!storeId) return;
    try {
      const fb = await getFirestore();
      if (!fb) return;
      const q = fb.query(
        fb.collection(fb.db, 'stores', storeId, COLLECTION),
        fb.orderBy('_updatedAt', 'desc')
      );
      const snap = await fb.getDocs(q);
      const arr = [];
      snap.forEach((d) => {
        const data = d.data();
        delete data._updatedAt;
        arr.push(data);
      });
      if (arr.length > 0) {
        RM.jobs = arr;
        saveLocal(arr);
        renderList();
        debug('☁️ Loaded ' + arr.length + ' jobs');
      }
    } catch (e) {
      console.warn('Cloud load failed:', e);
    }
  }

  function subscribeCloud() {
    const storeId = getStoreId();
    if (!storeId) return;
    (async () => {
      try {
        const fb = await getFirestore();
        if (!fb) return;
        if (RM.unsub) { try { RM.unsub(); } catch (e) {} }
        RM.unsub = fb.onSnapshot(
          fb.collection(fb.db, 'stores', storeId, COLLECTION),
          (snap) => {
            const arr = [];
            snap.forEach((d) => {
              const data = d.data();
              delete data._updatedAt;
              arr.push(data);
            });
            if (arr.length === 0 && RM.jobs.length > 0) return;
            RM.jobs = arr;
            saveLocal(arr);
            renderList();
          },
          (err) => console.warn('Realtime error:', err.code)
        );
      } catch (e) {}
    })();
  }


  /* ============ HELPERS ============ */
  function getStoreId() {
    const meta = window.SF?.perms?.getUserMeta?.() || {};
    const store = S.store || {};
    return meta.storeId || store.storeId || store.uid || null;
  }

  function requirePerm(perm, msg) {
    if (!window.SF?.perms?.can?.(perm)) {
      C.toast('🔒 ' + (msg || 'Permission denied'), 'error', 3000);
      return false;
    }
    return true;
  }

  function generateJobNo() {
    const fy = C.getFY(new Date()).short;
    const prefix = 'JOB-' + fy + '-';
    let max = 0;
    (RM.jobs || []).forEach((j) => {
      if (j.jobNo && j.jobNo.startsWith(prefix)) {
        const n = parseInt(j.jobNo.slice(prefix.length), 10) || 0;
        if (n > max) max = n;
      }
    });
    return prefix + String(max + 1).padStart(4, '0');
  }


  /* ============ INIT ============ */
  async function init_repairModule() {
    console.log('%c🔧 Repair module initialized (v4.5.3)', 'color:#8b5cf6;font-weight:bold');

    if (!window.SF?.perms?.can?.('repair.view')) {
      const c = document.getElementById('moduleContainer');
      if (c) c.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:28px;background:#1e1b2e;border:1px solid #7f1d1d;border-radius:16px;text-align:center;"><div style="font-size:42px;margin-bottom:12px">🔒</div><div style="font-size:16px;font-weight:800;color:#fca5a5;">Access Denied</div></div>';
      return { onUnload: () => {} };
    }

    RM.editingId = null;
    RM.currentJob = null;
    RM.jobs = loadLocal();
    debug('📦 Local jobs: ' + RM.jobs.length);

    const dEl = document.getElementById('repDate');
    if (dEl && !dEl.value) dEl.value = C.fmtDate(new Date());
    const jobNoEl = document.getElementById('repJobNo');
    if (jobNoEl) jobNoEl.value = generateJobNo();

    populateTechnicians();
    populateCustomerList();
    renderList();

    setTimeout(() => {
      loadFromCloud();
      subscribeCloud();
    }, 500);

    if (window.SF?.state?.on) {
      window.SF.state.on('change:staff', () => populateTechnicians());
      window.SF.state.on('change:parties', () => populateCustomerList());
    }

    return {
      onUnload: () => {
        if (RM.unsub) { try { RM.unsub(); } catch (e) {} RM.unsub = null; }
      }
    };
  }


  function populateTechnicians() {
    const sel = document.getElementById('repTechnician');
    if (!sel) return;
    const staff = S.staff || [];
    const current = sel.value;
    sel.innerHTML = '<option value="">— Unassigned —</option>' +
      staff.map((s) => `<option value="${s.id}">${C.escapeHTML(s.name)}${s.designation ? ' — ' + C.escapeHTML(s.designation) : ''}</option>`).join('');
    if (current) sel.value = current;
  }

  function populateCustomerList() {
    const dl = document.getElementById('repCustomerList');
    if (!dl) return;
    const parties = (S.parties || []).filter((p) => p.type === 'CUSTOMER');
    dl.innerHTML = parties.map((p) => `<option value="${C.escapeHTML(p.name)}">${C.escapeHTML(p.phone || '')}</option>`).join('');
  }


  /* ============ SAVE ============ */
  async function save() {
    debug('💾 Save called');
    if (!requirePerm('repair.create', 'Cannot create job cards')) { debug('❌ Permission denied'); return; }

    try {
      const date = document.getElementById('repDate')?.value || C.fmtDate(new Date());
      const custName = (document.getElementById('repCustName')?.value || '').trim();
      const custPhone = (document.getElementById('repCustPhone')?.value || '').trim();
      const custAddr = (document.getElementById('repCustAddr')?.value || '').trim();
      const brand = (document.getElementById('repBrand')?.value || '').trim();
      const model = (document.getElementById('repModel')?.value || '').trim();
      const imei = (document.getElementById('repIMEI')?.value || '').trim();
      const color = (document.getElementById('repColor')?.value || '').trim();
      const password = (document.getElementById('repPassword')?.value || '').trim();
      const issue = (document.getElementById('repIssue')?.value || '').trim();
      const estimate = parseFloat(document.getElementById('repEstimate')?.value) || 0;
      const advance = parseFloat(document.getElementById('repAdvance')?.value) || 0;
      const warrantyDays = parseInt(document.getElementById('repWarrantyDays')?.value, 10) || 0;
      const techId = document.getElementById('repTechnician')?.value || '';
      const notes = (document.getElementById('repNotes')?.value || '').trim();

      const accessories = [];
      document.querySelectorAll('.rep-acc:checked').forEach((cb) => accessories.push(cb.value));

      if (!custName || custName.length < 2) { C.toast('Enter customer name', 'warning'); return; }
      if (!/^\d{10}$/.test(custPhone)) { C.toast('Enter valid 10-digit phone', 'warning'); return; }
      if (!model) { C.toast('Enter device model', 'warning'); return; }
      if (!issue || issue.length < 3) { C.toast('Describe the problem', 'warning'); return; }

      let techName = '';
      if (techId) {
        const t = (S.staff || []).find((x) => x.id === techId);
        if (t) techName = t.name;
      }

      let jobNo = document.getElementById('repJobNo')?.value || '';
      if (!jobNo || jobNo.includes('TMP')) {
        jobNo = generateJobNo();
        const jobNoEl = document.getElementById('repJobNo');
        if (jobNoEl) jobNoEl.value = jobNo;
      }

      const isEdit = !!RM.editingId;
      const existing = isEdit ? RM.jobs.find((x) => x.id === RM.editingId) : null;

      const record = {
        id: isEdit ? RM.editingId : jobNo,
        jobNo: isEdit ? (existing?.jobNo || jobNo) : jobNo,
        date, customerName: custName, customerPhone: custPhone, customerAddress: custAddr,
        deviceBrand: brand, deviceModel: model, deviceIMEI: imei, deviceColor: color, devicePassword: password,
        accessories, issueDescription: issue,
        estimatedCost: +estimate.toFixed(2), advancePaid: +advance.toFixed(2),
        finalCost: isEdit ? (existing?.finalCost || 0) : 0,
        balanceDue: isEdit ? (existing?.balanceDue || 0) : 0,
        status: isEdit ? (existing?.status || 'RECEIVED') : 'RECEIVED',
        technicianId: techId, technicianName: techName, notes, warrantyDays,
        partsUsed: isEdit ? (existing?.partsUsed || []) : [],
        statusHistory: isEdit
          ? (existing?.statusHistory || [])
          : [{ status: 'RECEIVED', timestamp: new Date().toISOString(), by: (window.SF?.perms?.getUserMeta?.()?.name || 'Staff') }],
        createdAt: isEdit ? (existing?.createdAt || new Date().toISOString()) : new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      if (isEdit) {
        const idx = RM.jobs.findIndex((x) => x.id === RM.editingId);
        if (idx !== -1) RM.jobs[idx] = record;
        else RM.jobs.unshift(record);
      } else {
        RM.jobs.unshift(record);
      }

      saveLocal(RM.jobs);
      C.toast(isEdit ? '✅ Job updated' : '✅ Job created: ' + record.jobNo, 'success', 3000);
      C.playBeep();
      syncToCloud(record);

      try {
        if (window.SF?.state?.logAudit) {
          window.SF.state.logAudit(isEdit ? 'REPAIR_UPDATE' : 'REPAIR_CREATE', record.jobNo + ' | ' + custName + ' | ' + model);
        }
      } catch (e) {}

      resetForm();
      renderList();
      debug('✅ Saved');
    } catch (err) {
      console.error('Save error:', err);
      debug('❌ Error: ' + err.message);
      C.toast('Save failed: ' + err.message, 'error', 4000);
    }
  }

  /* ============ LIST ============ */

    const listEl = document.getElementById('repJobList');

    const q = (document.getElementById('repSearchInput')?.value || '').trim().toLowerCase();
    const statusFilter = document.getElementById('repStatusFilter')?.value || 'ALL';

    const total = jobs.length;
    const progress = jobs.filter((r) => ['RECEIVED','DIAGNOSED','WAITING_APPROVAL','IN_REPAIR'].includes(r.status)).length;
    const ready = jobs.filter((r) => r.status === 'READY').length;
    const delivered = jobs.filter((r) => r.status === 'DELIVERED').length;
    setText('repStatTotal', total);
    setText('repStatProgress', progress);
    setText('repStatReady', ready);
    setText('repStatDelivered', delivered);

    let filtered = jobs;
    if (statusFilter !== 'ALL') filtered = filtered.filter((r) => r.status === statusFilter);

  /* ============ STATUS CHANGE ============ */
  async function changeStatus(newStatus) {
    if (!requirePerm('repair.edit', 'Cannot change status')) return;
    const job = RM.currentJob;
    if (!job) return;
    if (job.status === newStatus) return;

    if (newStatus === 'DELIVERED') {
      const finalInput = prompt('Final repair cost (₹):', (job.finalCost || job.estimatedCost || 0).toFixed(2));
      if (finalInput === null) return;
      const finalCost = parseFloat(finalInput);
      if (isNaN(finalCost) || finalCost < 0) { C.toast('Invalid amount', 'warning'); return; }

      const remaining = finalCost - (job.advancePaid || 0);
      if (remaining > 0) {
        const collect = await C.confirmDialog(
          'Collect Payment?',
          'Balance: ₹' + remaining.toFixed(2) + '\n\nMark as collected?',
          'Collected',
          false
        );
        if (collect) {
          const voucher = {
            id: 'vch-rep-' + Date.now(),
            type: 'RECEIPT', date: C.fmtDate(new Date()), amount: remaining,
            category: 'Repair Payment — ' + job.customerName,
            account: 'Cash-in-Hand',
            narration: 'Job ' + job.jobNo + ' — final payment',
            createdAt: new Date().toISOString(),
            _autoGenerated: true, _sourceRepairId: job.id
          };
          if (!Array.isArray(S.vouchers)) S.vouchers = [];
          S.vouchers.unshift(voucher);
          C.safeSave('sfp_vouchers', S.vouchers);
          try {
            const fb = await getFirestore();
            if (fb) await fb.setDoc(fb.doc(fb.db, 'stores', getStoreId(), 'vouchers', voucher.id), voucher, { merge: true });
          } catch (e) {}
        }
      }

      job.finalCost = +finalCost.toFixed(2);
      job.balanceDue = Math.max(0, finalCost - (job.advancePaid || 0));
      job.deliveredAt = new Date().toISOString();
    }

    job.status = newStatus;
    job.updatedAt = new Date().toISOString();
    if (!Array.isArray(job.statusHistory)) job.statusHistory = [];
    job.statusHistory.push({
      status: newStatus,
      timestamp: new Date().toISOString(),
      by: window.SF?.perms?.getUserMeta?.()?.name || 'Staff'
    });

    const idx = RM.jobs.findIndex((x) => x.id === job.id);
    if (idx !== -1) RM.jobs[idx] = job;

    saveLocal(RM.jobs);
    syncToCloud(job);

    C.toast('✅ Status: ' + (STATUS[newStatus]?.label || newStatus), 'success', 2500);
    C.playBeep();

    openDetail(job.id);
    renderList();
  }


  /* ============ DELETE JOB ============ */
  async function deleteJob() {
    if (!requirePerm('repair.delete', 'Only owner can delete')) return;
    const job = RM.currentJob;
    if (!job) return;

    const pin = prompt('🔒 Master PIN:');
    if (!pin) return;
    if (pin !== (S.profile?.masterPin || '1234')) { C.toast('Incorrect PIN', 'error'); C.playErrorBeep(); return; }

    const ok = await C.confirmDialog('Delete Job?', job.jobNo + '\n' + job.customerName, 'Delete', true);
    if (!ok) return;

    const linkedVouchers = (S.vouchers || []).filter((v) => v._sourceRepairId === job.id);

    if (linkedVouchers.length > 0) {
      S.vouchers = (S.vouchers || []).filter((v) => v._sourceRepairId !== job.id);
      C.safeSave('sfp_vouchers', S.vouchers);
    }
    RM.jobs = RM.jobs.filter((r) => r.id !== job.id);
    saveLocal(RM.jobs);

    await deleteFromCloud(job.id);

    if (linkedVouchers.length > 0) {
      try {
        const fb = await getFirestore();
        if (fb) {
          for (const v of linkedVouchers) {
            await fb.deleteDoc(fb.doc(fb.db, 'stores', getStoreId(), 'vouchers', v.id));
          }
        }
      } catch (e) { console.warn('Voucher delete failed:', e); }
    }

    try {
      if (window.SF?.state?.logAudit) window.SF.state.logAudit('REPAIR_DELETE', job.jobNo);
    } catch (e) {}

    C.toast('Job deleted', 'success');
    closeModal();
    renderList();

    try { window.SF.dashboard?.reload?.(); } catch (e) {}
  }

        ${prof.phone   ? `<div class="center small">☎ ${C.escapeHTML(prof.phone)}</div>` : ''}
        <div class="center small">Shop Code: <b>${C.escapeHTML(shopCode)}</b></div>
        <hr class="solid">
        
        <div class="center bold big mt4">JOB CARD</div>
        <div class="center bold">${C.escapeHTML(job.jobNo)}</div>
        <div class="center small">${datePretty}</div>
        <hr class="solid">
        
        <div class="center bold big">${st.icon} ${st.label.toUpperCase()}</div>
        <hr class="solid">

        <table class="tbl">
          <tr><td>Customer</td><td class="bold right">${C.escapeHTML(job.customerName)}</td></tr>
          <tr><td>Phone</td><td class="mono right">${C.escapeHTML(job.customerPhone)}</td></tr>
          ${job.customerAddress ? `<tr><td>Address</td><td class="small right">${C.escapeHTML(job.customerAddress)}</td></tr>` : ''}
        </table>
        <hr class="solid">

        <table class="tbl">
          <tr><td>Device</td><td class="bold right">${C.escapeHTML((job.deviceBrand || '') + ' ' + (job.deviceModel || ''))}</td></tr>
          ${job.deviceIMEI ? `<tr><td>IMEI</td><td class="mono small right">${C.escapeHTML(job.deviceIMEI)}</td></tr>` : ''}
          ${job.deviceColor ? `<tr><td>Color</td><td class="right">${C.escapeHTML(job.deviceColor)}</td></tr>` : ''}
        </table>
        <hr class="solid">

        <div class="bold">Issue:</div>
        <div class="small mt2">${C.escapeHTML(job.issueDescription || '')}</div>
        ${(job.accessories || []).length ? `<div class="small mt4"><b>Acc:</b> ${job.accessories.map(a => C.escapeHTML(a)).join(', ')}</div>` : ''}
        <hr class="solid">

        <table class="tbl">
          <tr><td>Estimate</td><td class="right mono">₹${(job.estimatedCost || 0).toFixed(2)}</td></tr>
          <tr><td>Advance</td><td class="right mono">-₹${(job.advancePaid || 0).toFixed(2)}</td></tr>
          ${job.finalCost > 0 ? `<tr><td>Final</td><td class="right mono">₹${job.finalCost.toFixed(2)}</td></tr>` : ''}
          <tr class="bold big"><td style="padding-top:4px">BALANCE</td><td class="right mono" style="padding-top:4px">₹${Math.max(0, balance).toFixed(2)}</td></tr>
        </table>
        <hr class="solid">

        ${job.warrantyDays > 0 ? `<div class="center bold mt4">Warranty: ${job.warrantyDays} days</div><hr class="solid">` : ''}

        <div class="center mt4">
          <img src="${portalQrUrl}" class="qr" alt="QR">
          <div class="bold mt2">Track Status Online</div>
          <div class="small">Shop: <b>${C.escapeHTML(shopCode)}</b> | Job: <b>${C.escapeHTML(job.jobNo)}</b></div>
        </div>
        <hr class="solid">

        <div class="small mt2">1. Bring this receipt when collecting.</div>
        <div class="small">2. Warranty covers repaired part only.</div>
        <div class="center mt8">
          <div class="sig-line">Customer Sign</div>
        </div>
        <div class="center small mt4">Powered by SmartFix ERP</div>
      </div>
    `;

    const css = `
      @page { 
        size: ${isA4 ? 'A5 portrait' : printSize + ' auto'}; 
        margin: 0; 
      }
      * { 
        box-sizing: border-box; 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
      }
      html, body {
        margin: 0; padding: 0; background: #fff; color: #000;
        /* থার্মাল প্রিন্টারে লেখা গাঢ় আসার জন্য Arial এবং Bold */
        font-family: Arial, Helvetica, sans-serif;
        font-size: ${fontBase}; 
        font-weight: 600;
        line-height: 1.4;
        width: ${paperWidth}; max-width: 100vw;
      }
      .receipt { width: 100%; padding: ${padding}; margin: 0 auto; }
      .center { text-align: center; }
      .bold   { font-weight: 900; }
      .big    { font-size: 1.15em; }
      .small  { font-size: 0.85em; }
      .mono   { font-family: 'Courier New', monospace; font-weight: 900; }
      .mt2 { margin-top: 2px; } .mt4 { margin-top: 6px; } .mt8 { margin-top: 10px; }
      
      .tbl { width: 100%; border-collapse: collapse; }
      .tbl td { padding: 2px 0; vertical-align: top; word-break: break-word; }
      .tbl td:first-child { width: 35%; font-weight: bold; }
      .tbl td.right { text-align: right; }
      
      /* ড্যাশ লাইনের বদলে সলিড লাইন, যাতে প্রিন্টারে ফুটে ওঠে */
      hr { border: none; border-top: 1px solid #000; margin: 4px 0; }
      
      /* QR কোড স্পষ্ট করার জন্য ফিল্টার */
      .qr { width: ${qrSize}px; height: ${qrSize}px; filter: grayscale(100%) contrast(300%); }
      
      .sig-line {
        border-top: 1px solid #000; display: inline-block;
        padding-top: 2px; min-width: 100px; font-size: 0.9em;
      }
    `;

    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none;';
    document.body.appendChild(iframe);
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${C.escapeHTML(job.jobNo)}</title><style>${css}</style></head><body>${html}</body></html>`);
    doc.close();

    let printed = false;
    const doPrint = () => {
      if (printed) return;
      printed = true;
      try { iframe.contentWindow.focus(); iframe.contentWindow.print(); }
      catch (e) { C.toast('Print blocked — allow pop-ups', 'error'); }
    };

    const img = doc.querySelector('img.qr');
    if (img && !img.complete) {
      img.onload  = () => setTimeout(doPrint, 300); // QR লোড হতে সময় দিন
      img.onerror = () => setTimeout(doPrint, 300); 
      setTimeout(doPrint, 4000); // ৪ সেকেন্ড পরেও লোড না হলে প্রিন্ট হবে
    } else {
      setTimeout(doPrint, 500);
    }

    const cleanup = () => { try { document.body.removeChild(iframe); } catch (e) {} };
    try { iframe.contentWindow.addEventListener('afterprint', () => setTimeout(cleanup, 500)); } catch (e) {}
    setTimeout(cleanup, 60000);
  }


  /* ============ WHATSAPP ============ */
  function shareWhatsApp() {
    const job = RM.currentJob;
    if (!job) return;
    const prof = S.profile || {};
    const shopCode = S.store?.shopCode || prof.shopCode || '';
    const st = STATUS[job.status] || STATUS.RECEIVED;
    const balance = (job.finalCost || job.estimatedCost || 0) - (job.advancePaid || 0);
    const baseUrl = window.location.origin + window.location.pathname.replace(/\/app\.html.*$/, '/').replace(/\/index\.html.*$/, '/');

    const msg =
      `*${prof.name || 'Store'}*\n🔧 *Repair Job Card*\n━━━━━━━━━━━━━━━\n` +
      `📋 Job No: *${job.jobNo}*\n📅 Date: ${job.date}\n👤 Name: ${job.customerName}\n\n` +
      `📱 Device: ${job.deviceBrand || ''} ${job.deviceModel || ''}\n${job.deviceIMEI ? '🔢 IMEI: ' + job.deviceIMEI + '\n' : ''}` +
      `\n🛠 Issue: ${job.issueDescription}\n\n💰 Estimate: ₹${(job.estimatedCost || 0).toFixed(2)}\n✅ Advance: ₹${(job.advancePaid || 0).toFixed(2)}\n💵 Balance: ₹${Math.max(0, balance).toFixed(2)}\n\n` +
      `📌 Status: ${st.icon} ${st.label}\n${job.warrantyDays > 0 ? '🛡️ Warranty: ' + job.warrantyDays + ' days\n' : ''}\n` +
      `📱 *Track:* ${baseUrl}index.html#customer\n🔑 Shop Code: *${shopCode}*\n📞 Phone: ${job.customerPhone}\n📋 Job: ${job.jobNo}\n\n${prof.phone ? '☎️ ' + prof.phone : ''}\n🙏 Thank you!`;

    const phone = (job.customerPhone || '').replace(/\D/g, '');
    const url = phone.length === 10
      ? 'https://wa.me/91' + phone + '?text=' + encodeURIComponent(msg)
      : 'https://wa.me/?text=' + encodeURIComponent(msg);
    window.open(url, '_blank');
  }


  /* ============ EXPOSE ============ */
  window.SF = window.SF || {};
  window.SF.repair = {
    init: init_repairModule,
    save, resetForm, editJob, renderList,
    openDetail, closeModal, changeStatus, deleteJob,
    printSlip, shareWhatsApp,
    reloadFromCloud: async () => {
      RM.jobs = loadLocal();
      renderList();
      await loadFromCloud();
      C.toast('🔄 Reloaded from cloud', 'success', 2000);
    },
    getJobs: () => RM.jobs
  };

  window.init_repairModule = init_repairModule;

  if (document.getElementById('repairModule')) {
    init_repairModule();
  }
})();
</script>
