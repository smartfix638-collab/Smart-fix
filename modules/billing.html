<!-- ============================================================
     SMARTFIX ERP — Billing / POS (v4.4.0)
     GST + Non-GST support
     ============================================================ -->

<section id="billingModule" class="grid grid-cols-1 lg:grid-cols-12 gap-4">

  <div class="lg:col-span-5 space-y-3">

    <!-- ============ BILL TYPE TOGGLE ============ -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-3">
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">🧾 Bill Type</div>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="billTypeGST" onclick="SF.billing.setBillType('GST')"
                class="py-2.5 rounded-lg text-xs font-bold transition bg-emerald-600 text-white">
          ✅ GST Bill
        </button>
        <button type="button" id="billTypeNonGST" onclick="SF.billing.setBillType('NON_GST')"
                class="py-2.5 rounded-lg text-xs font-bold transition bg-slate-950 border border-slate-700 text-slate-400">
          ⚪ Non-GST Bill
        </button>
      </div>
      <div class="text-[10px] text-slate-500 mt-2">
        <span id="billTypeHint">GST invoice with tax breakup (CGST/SGST/IGST)</span>
      </div>
    </div>

    <!-- ============ INVOICE HEADER ============ -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h2 class="font-bold text-xs uppercase tracking-wider text-white">📄 Invoice Details</h2>
        <span id="billFyBadge" class="text-[10px] bg-sky-950 text-sky-300 font-mono font-bold px-2 py-0.5 rounded border border-sky-800">FY</span>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Invoice No</label>
          <input type="text" id="billInvNo" readonly class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono font-bold text-sky-300">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Date</label>
          <input type="date" id="billInvDate" onchange="SF.billing.onDateChange()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100">
        </div>
      </div>
    </div>

    <!-- ============ CUSTOMER ============ -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h3 class="text-[11px] font-bold uppercase tracking-wider text-sky-400 border-b border-slate-800 pb-2">👤 Customer Details</h3>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Name</label>
          <input type="text" id="billCustName" list="billCustomerList" oninput="SF.billing.renderPreview()" placeholder="Cash Customer" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
          <datalist id="billCustomerList"></datalist>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Phone</label>
          <input type="tel" id="billCustPhone" oninput="SF.billing.renderPreview()" placeholder="10-digit" maxlength="10" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono">
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Address</label>
        <input type="text" id="billCustAddr" oninput="SF.billing.renderPreview()" placeholder="City, State" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div id="billGSTINWrap">
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">GSTIN</label>
          <input type="text" id="billCustGSTIN" oninput="SF.billing.renderPreview()" placeholder="Optional" maxlength="15" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono uppercase">
        </div>
        <div id="billGSTTypeWrap">
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">GST Type</label>
          <select id="billGstType" onchange="SF.billing.renderPreview()" class="w-full bg-slate-950 border border-sky-700/60 rounded-lg px-2.5 py-1.5 text-xs text-sky-200 font-semibold">
            <option value="INTRA">Intra (CGST+SGST)</option>
            <option value="INTER">Inter (IGST)</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Payment Mode</label>
        <select id="billLedger" onchange="SF.billing.renderPreview()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs">
          <option value="Cash-in-Hand">Cash</option>
          <option value="Bank / UPI">UPI / QR</option>
          <option value="Card Payment">Card</option>
          <option value="Bajaj / EMI Finance">Bajaj EMI</option>
          <option value="Credit / Sundry Debtors">Udhar (Credit)</option>
        </select>
      </div>
    </div>

    <!-- ============ ADD PRODUCT ============ -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-[11px] font-bold uppercase tracking-wider text-sky-400">📦 Add Product</h3>
        <button type="button" onclick="SF.billing.toggleScanner()" id="billScannerBtn" class="text-[10px] bg-sky-600 hover:bg-sky-700 text-white font-bold px-2.5 py-1 rounded-lg transition">📷 Scan</button>
      </div>
      <div id="billScannerWrap" class="overflow-hidden rounded-lg border border-sky-700" style="display:none"><div id="billReader" style="width:100%"></div></div>
      <div class="relative">
        <input type="text" id="billBarcodeInput" onkeydown="SF.billing.handleBarcodeKey(event)" placeholder="⚡ Scan barcode or IMEI + Enter" class="w-full bg-sky-950/50 border border-sky-700 rounded-lg px-3 py-2 text-xs font-mono font-bold text-sky-100 placeholder-sky-400/60">
        <span class="absolute right-2 top-2 text-[9px] text-sky-400 font-bold uppercase">Auto-add</span>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[9px] font-bold uppercase mb-0.5 text-slate-500">IMEI / Serial</label>
          <input type="text" id="billItemIMEI" oninput="SF.billing.lookupIMEI(this.value)" placeholder="Type IMEI..." class="w-full bg-yellow-950/40 border border-yellow-800/60 rounded-lg px-2 py-1.5 text-xs font-mono text-yellow-100">
        </div>
        <div>
          <label class="block text-[9px] font-bold uppercase mb-0.5 text-slate-500">Model</label>
          <input type="text" id="billItemModel" placeholder="Model name" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs">
        </div>
      </div>
      <div id="billItemMetaRow" class="grid grid-cols-4 gap-1.5">
        <div id="billItemHSNWrap"><label class="block text-[9px] font-bold uppercase mb-0.5 text-slate-500">HSN</label><input type="text" id="billItemHSN" value="8517" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-1.5 py-1.5 text-xs font-mono text-center"></div>
        <div id="billItemGSTWrap"><label class="block text-[9px] font-bold uppercase mb-0.5 text-slate-500">GST%</label>
          <select id="billItemGST" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-1 py-1.5 text-xs">
            <option value="18">18</option><option value="12">12</option><option value="28">28</option><option value="0">0</option>
          </select>
        </div>
        <div><label class="block text-[9px] font-bold uppercase mb-0.5 text-slate-500">Qty</label><input type="number" id="billItemQty" value="1" min="1" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-1.5 py-1.5 text-xs text-center font-bold"></div>
        <div><label class="block text-[9px] font-bold uppercase mb-0.5 text-slate-500">Rate ₹</label><input type="number" id="billItemRate" placeholder="0" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-1.5 py-1.5 text-xs font-bold text-emerald-300"></div>
      </div>
      <button type="button" onclick="SF.billing.addManualItem()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 rounded-lg text-xs transition">+ Add to Invoice</button>
    </div>

    <!-- ============ DISCOUNT ============ -->
    <div class="bg-amber-950/40 border border-amber-800/60 rounded-2xl p-4">
      <div class="flex items-center justify-between gap-3">
        <div class="flex-1">
          <label class="block text-[10px] font-bold uppercase text-amber-200">Special Discount (₹)</label>
          <span id="billDiscountPct" class="text-[9px] text-amber-400">0% of subtotal</span>
        </div>
        <input type="number" id="billDiscount" value="0" min="0" oninput="SF.billing.renderPreview()" class="w-32 bg-slate-950 border border-amber-700 rounded-lg px-2.5 py-1.5 text-xs font-bold text-right text-rose-300">
      </div>
    </div>

    <!-- ============ CART ============ -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-[11px] font-bold uppercase tracking-wider text-sky-400">🛒 Cart</h3>
        <span id="billCartCount" class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-bold">0 items</span>
      </div>
      <div id="billCartItems" class="space-y-1.5 max-h-56 overflow-y-auto">
        <div class="text-center text-slate-500 text-xs py-4">No items yet.</div>
      </div>
    </div>

    <button type="button" onclick="SF.billing.finalize()" class="w-full bg-gradient-to-r from-sky-600 to-sky-700 hover:from-sky-500 hover:to-sky-600 text-white font-black py-3.5 rounded-2xl text-sm shadow-lg shadow-sky-600/30 transition flex items-center justify-center gap-2">
      <span>🖨️</span><span>Save & Print Invoice</span>
    </button>

  </div>

  <!-- RIGHT: PREVIEW -->
  <div class="lg:col-span-7">
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 overflow-x-auto">
      <div class="flex justify-between items-center mb-3">
        <span id="billPreviewTitle" class="text-[10px] font-bold uppercase tracking-wider text-slate-400">📄 Live Invoice Preview (A4)</span>
        <button type="button" onclick="SF.billing.finalize()" class="text-[10px] bg-sky-600 hover:bg-sky-700 text-white font-bold px-3 py-1 rounded-lg">Quick Print</button>
      </div>
      <div id="billInvoicePreview" class="bg-white text-slate-900 shadow-2xl mx-auto" style="width:100%;max-width:202mm;min-height:282mm;padding:6mm 7mm;box-sizing:border-box;font-size:10px;"></div>
    </div>
  </div>

</section>


<script>
(function () {
  'use strict';

  const S  = window.SF?.state?.state;
  const C  = window.SF?.common;
  const Cl = window.SF?.cloud;

  if (!S || !C) { console.error('Billing module: SF globals not ready'); return; }

  let billType = 'GST';

  function requirePerm(perm, msg) {
    if (!window.SF?.perms?.can?.(perm)) {
      C.toast('🔒 ' + (msg || 'Permission denied'), 'error', 3000);
      return false;
    }
    return true;
  }


  /* ============================================================
     BILL TYPE TOGGLE
     ============================================================ */
  function setBillType(type) {
    billType = type === 'NON_GST' ? 'NON_GST' : 'GST';

    const gstBtn = document.getElementById('billTypeGST');
    const nonGstBtn = document.getElementById('billTypeNonGST');
    const hint = document.getElementById('billTypeHint');
    const gstinWrap = document.getElementById('billGSTINWrap');
    const gstTypeWrap = document.getElementById('billGSTTypeWrap');
    const hsnWrap = document.getElementById('billItemHSNWrap');
    const gstRateWrap = document.getElementById('billItemGSTWrap');
    const previewTitle = document.getElementById('billPreviewTitle');

    if (billType === 'GST') {
      if (gstBtn) gstBtn.className = 'py-2.5 rounded-lg text-xs font-bold transition bg-emerald-600 text-white';
      if (nonGstBtn) nonGstBtn.className = 'py-2.5 rounded-lg text-xs font-bold transition bg-slate-950 border border-slate-700 text-slate-400';
      if (hint) hint.textContent = 'GST invoice with tax breakup (CGST/SGST/IGST)';
      if (gstinWrap) gstinWrap.style.display = '';
      if (gstTypeWrap) gstTypeWrap.style.display = '';
      if (hsnWrap) hsnWrap.style.display = '';
      if (gstRateWrap) gstRateWrap.style.display = '';
      if (previewTitle) previewTitle.textContent = '📄 Live GST Invoice Preview (A4)';
    } else {
      if (gstBtn) gstBtn.className = 'py-2.5 rounded-lg text-xs font-bold transition bg-slate-950 border border-slate-700 text-slate-400';
      if (nonGstBtn) nonGstBtn.className = 'py-2.5 rounded-lg text-xs font-bold transition bg-violet-600 text-white';
      if (hint) hint.textContent = 'Simple bill — no GST, no tax breakup (for unregistered sales)';
      if (gstinWrap) gstinWrap.style.display = 'none';
      if (gstTypeWrap) gstTypeWrap.style.display = 'none';
      if (hsnWrap) hsnWrap.style.display = 'none';
      if (gstRateWrap) gstRateWrap.style.display = 'none';
      if (previewTitle) previewTitle.textContent = '📄 Live Non-GST Bill Preview (A4)';
    }

    renderPreview();
  }


  /* ============================================================
     RENDER PREVIEW
     ============================================================ */
  function renderPreview() {
    const el = document.getElementById('billInvoicePreview');
    if (!el) return;

    const invNo      = document.getElementById('billInvNo')?.value || 'PENDING';
    const invDateStr = document.getElementById('billInvDate')?.value || C.fmtDate(new Date());
    const custName   = (document.getElementById('billCustName')?.value || 'Cash Customer').trim() || 'Cash Customer';
    const custPhone  = (document.getElementById('billCustPhone')?.value || '').trim() || '—';
    const custAddr   = (document.getElementById('billCustAddr')?.value || '').trim() || '—';
    const custGSTIN  = (document.getElementById('billCustGSTIN')?.value || '').trim() || '—';
    const taxType    = document.getElementById('billGstType')?.value || 'INTRA';
    const discount   = parseFloat(document.getElementById('billDiscount')?.value) || 0;

    const p = S.profile || {};
    const shopCode = S.store?.shopCode || p.shopCode || '—';
    const items = S.activeCart || [];

    const datePretty = C.fmtDatePretty(new Date(invDateStr + 'T12:00:00'));
    const baseUrl = window.location.origin + window.location.pathname.replace(/\/app\.html.*$/, '/').replace(/\/index\.html.*$/, '/');
    const portalQrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(baseUrl + 'index.html#customer')}`;

    if (billType === 'NON_GST') {
      el.innerHTML = renderNonGstHTML({ invNo, datePretty, custName, custPhone, custAddr, discount, p, shopCode, items, baseUrl, portalQrUrl });
    } else {
      el.innerHTML = renderGstHTML({ invNo, datePretty, custName, custPhone, custAddr, custGSTIN, taxType, discount, p, shopCode, items, baseUrl, portalQrUrl });
    }
  }


  /* ============================================================
     NON-GST TEMPLATE
     ============================================================ */
  function renderNonGstHTML({ invNo, datePretty, custName, custPhone, custAddr, discount, p, shopCode, items, baseUrl, portalQrUrl }) {
    let totalAmount = 0, totalQty = 0;
    const rows = items.map((it, idx) => {
      const lineTotal = (it.rate || 0) * (it.qty || 1);
      totalAmount += lineTotal;
      totalQty += (it.qty || 1);
      return `
        <tr style="height:16mm">
          <td style="border:1px solid #6d28d9;padding:5px;text-align:center;font-weight:700;color:#0f172a;">${idx + 1}</td>
          <td style="border:1px solid #6d28d9;padding:5px;">
            <div style="font-weight:700;color:#0f172a;font-size:11.5px;">${C.escapeHTML(it.model || '')}</div>
            ${it.imei ? `<div style="font-size:9px;color:#6d28d9;font-family:monospace;margin-top:1px;">IMEI: ${C.escapeHTML(it.imei)}</div>` : ''}
          </td>
          <td style="border:1px solid #6d28d9;padding:5px;text-align:center;font-weight:700;color:#0f172a;">${it.qty || 1}</td>
          <td style="border:1px solid #6d28d9;padding:5px;text-align:right;font-family:monospace;color:#0f172a;">${(it.rate || 0).toFixed(2)}</td>
          <td style="border:1px solid #6d28d9;padding:5px;text-align:right;font-family:monospace;font-weight:700;color:#0f172a;">${lineTotal.toFixed(2)}</td>
        </tr>
      `;
    }).join('');

    const minRows = 8;
    let emptyRows = '';
    for (let i = items.length; i < minRows; i++) {
      emptyRows += `<tr style="height:14mm"><td style="border:1px solid #6d28d9;padding:5px;">&nbsp;</td><td style="border:1px solid #6d28d9;padding:5px;">&nbsp;</td><td style="border:1px solid #6d28d9;padding:5px;">&nbsp;</td><td style="border:1px solid #6d28d9;padding:5px;">&nbsp;</td><td style="border:1px solid #6d28d9;padding:5px;">&nbsp;</td></tr>`;
    }

    const finalPayable = Math.max(0, totalAmount - discount);
    const discountPct = totalAmount > 0 ? ((discount / totalAmount) * 100).toFixed(1) : 0;
    const words = C.numberToWords(finalPayable);
    const upiUri = `upi://pay?pa=${encodeURIComponent(p.upiId || '')}&pn=${encodeURIComponent(p.name || 'Store')}&am=${finalPayable.toFixed(2)}&cu=INR`;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(upiUri)}`;

    return `
      <div style="display:flex;flex-direction:column;justify-content:space-between;min-height:270mm;height:100%;background:white;color:#0f172a;">

        <div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:8px;border-bottom:2px solid #6d28d9;">
            <div style="display:flex;gap:12px;align-items:flex-start;">
              ${p.logo ? `<img src="${p.logo}" style="height:52px;width:52px;object-fit:contain;">` : `<div style="width:48px;height:48px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;box-shadow:0 4px 12px rgba(109,40,217,0.3);">🔧</div>`}
              <div>
                <div style="font-size:20px;font-weight:900;color:#5b21b6;letter-spacing:-0.02em;line-height:1;">${C.escapeHTML(p.name || 'My Store')}</div>
                <div style="font-size:9px;color:#475569;margin-top:4px;max-width:240px;line-height:1.35;">${C.escapeHTML(p.address || '')}</div>
                <div style="font-size:9px;font-weight:700;color:#0f172a;margin-top:2px;">${C.escapeHTML(p.phone || '')}</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="display:inline-block;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:white;font-size:11px;font-weight:900;padding:6px 14px;border-radius:5px;letter-spacing:2px;">
                INVOICE
              </div>
              <div style="font-size:7.5px;color:#64748b;font-weight:700;margin-top:5px;">
                Shop Code: <span style="font-family:monospace;color:#6d28d9;font-size:8px;">${C.escapeHTML(shopCode)}</span>
              </div>
            </div>
          </div>

          <div style="border-bottom:1px solid #6d28d9;padding:3px;text-align:center;font-size:9px;font-weight:800;background:#f5f3ff;color:#6d28d9;letter-spacing:0.3px;">
            ✨ All Smartphones • Best Prices • Easy EMI Available ✨
          </div>

          <div style="border:1px solid #6d28d9;border-top:none;">
            <div style="display:grid;grid-template-columns:6fr 6fr;font-size:10px;">
              <div style="border-right:1px solid #6d28d9;padding:6px;">
                <div style="font-size:8px;font-weight:800;color:#6d28d9;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid #ddd6fe;padding-bottom:2px;margin-bottom:4px;">Bill To</div>
                <div style="display:flex;margin-bottom:2px;"><span style="width:60px;color:#64748b;font-weight:700;">Name:</span><span style="font-weight:800;color:#0f172a;">${C.escapeHTML(custName)}</span></div>
                <div style="display:flex;margin-bottom:2px;"><span style="width:60px;color:#64748b;font-weight:700;">Address:</span><span style="color:#334155;">${C.escapeHTML(custAddr)}</span></div>
                <div style="display:flex;"><span style="width:60px;color:#64748b;font-weight:700;">Phone:</span><span style="font-family:monospace;color:#334155;">${C.escapeHTML(custPhone)}</span></div>
              </div>
              <div style="padding:6px;">
                <div style="display:flex;justify-content:space-between;padding-bottom:3px;border-bottom:1px solid #ddd6fe;margin-bottom:3px;">
                  <span style="color:#64748b;font-weight:700;">Invoice No:</span>
                  <strong style="font-family:monospace;color:#6d28d9;font-size:11px;">${C.escapeHTML(invNo)}</strong>
                </div>
                <div style="display:flex;justify-content:space-between;">
                  <span style="color:#64748b;font-weight:700;">Date:</span>
                  <strong style="font-family:monospace;color:#0f172a;">${datePretty}</strong>
                </div>
              </div>
            </div>
          </div>

          <table style="width:100%;border-collapse:collapse;font-size:10px;margin-top:0;">
            <thead>
              <tr style="background:#ede9fe;color:#5b21b6;font-size:9px;text-transform:uppercase;font-weight:800;letter-spacing:0.3px;">
                <th style="border:1px solid #6d28d9;padding:5px;width:30px;">#</th>
                <th style="border:1px solid #6d28d9;padding:5px;text-align:left;">Item Description</th>
                <th style="border:1px solid #6d28d9;padding:5px;width:44px;">Qty</th>
                <th style="border:1px solid #6d28d9;padding:5px;width:78px;text-align:right;">Rate ₹</th>
                <th style="border:1px solid #6d28d9;padding:5px;width:88px;text-align:right;">Amount ₹</th>
              </tr>
            </thead>
            <tbody>
              ${rows || '<tr><td colspan="5" style="border:1px solid #6d28d9;padding:14px;text-align:center;color:#94a3b8;">No items yet</td></tr>'}
              ${emptyRows}
            </tbody>
            <tfoot>
              <tr style="background:#f5f3ff;font-weight:800;font-size:10px;">
                <td colspan="2" style="border:1px solid #6d28d9;padding:5px;text-align:right;text-transform:uppercase;color:#5b21b6;">Total</td>
                <td style="border:1px solid #6d28d9;padding:5px;text-align:center;font-family:monospace;color:#6d28d9;">${totalQty}</td>
                <td style="border:1px solid #6d28d9;padding:5px;"></td>

                  ${discount > 0 ? `<div style="display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid #dbeafe;color:#dc2626;font-weight:800;"><span>Discount (${discountPct}%)</span><span style="font-family:monospace;">-${discount.toFixed(2)}</span></div>` : ''}
                  <div style="display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid #dbeafe;"><span style="color:#334155;font-weight:600;">Add: ${taxType === 'INTRA' ? 'CGST + SGST' : 'IGST'}</span><span style="font-family:monospace;font-weight:700;color:#0f172a;">${finalTax.toFixed(2)}</span></div>
                  <div style="display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid #dbeafe;"><span style="color:#334155;font-weight:600;">Total Tax</span><span style="font-family:monospace;font-weight:700;color:#0f172a;">${finalTax.toFixed(2)}</span></div>
                  <div style="display:flex;justify-content:space-between;padding:10px 8px;background:#0369a1;color:white;font-weight:900;font-size:13px;"><span style="letter-spacing:0.5px;">TOTAL</span><span style="font-family:monospace;">₹${finalPayable.toFixed(2)}</span></div>
                </div>
                <div style="padding:8px;text-align:right;">
                  <div style="font-size:7.5px;color:#94a3b8;font-weight:700;">(E. & O.E.)</div>
                  <div style="font-size:9px;color:#475569;margin-top:4px;line-height:1.3;">Certified that the particulars given above are true and correct.</div>
                  <div style="font-size:10px;font-weight:800;color:#0f172a;margin-top:8px;">For ${C.escapeHTML(p.name || 'Store')}</div>
                  <div style="height:38px;"></div>
                  <div style="border-top:1px solid #64748b;width:140px;margin-left:auto;font-size:8px;font-weight:800;padding-top:3px;text-align:center;color:#475569;">Authorised Signatory</div>
                </div>
              </div>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px;padding:5px 8px;background:linear-gradient(90deg,#eff6ff,#f0fdf4,#fef3c7);border-radius:5px;font-size:8px;">
            <div style="color:#0369a1;font-weight:800;">⭐ SmartFix ERP — Cloud Edition</div>
            <div style="color:#64748b;font-family:monospace;">Powered by Firebase • © 2026</div>
          </div>
        </div>
      </div>
    `;
  }


  /* ============================================================
     CART
     ============================================================ */
  function renderCart() {
    const el = document.getElementById('billCartItems');
    const cnt = document.getElementById('billCartCount');
    if (!el) return;
    const items = S.activeCart || [];
    if (cnt) cnt.textContent = items.length + ' item' + (items.length !== 1 ? 's' : '');

    if (items.length === 0) {
      el.innerHTML = '<div class="text-center text-slate-500 text-xs py-4">No items yet.</div>';
      return;
    }

    el.innerHTML = items.map((it, idx) => `
      <div class="flex items-center gap-2 bg-slate-950/70 border border-slate-800 rounded-lg p-2 text-xs">
        <div class="flex-1 min-w-0">
          <div class="font-bold text-white truncate">${C.escapeHTML(it.model || '')}</div>
          ${it.imei ? `<div class="text-[9px] text-sky-400 font-mono truncate">${C.escapeHTML(it.imei)}</div>` : ''}
          <div class="text-[10px] text-slate-500">${it.qty} × ₹${(it.rate || 0).toFixed(2)}${billType === 'GST' ? ' • GST ' + it.gst + '%' : ''}</div>
        </div>
        <div class="text-right flex-shrink-0"><div class="font-black text-emerald-400 font-mono text-sm">₹${((it.rate || 0) * (it.qty || 1)).toFixed(2)}</div></div>
        <button type="button" onclick="SF.billing.removeItem(${idx})" class="w-6 h-6 flex items-center justify-center rounded-md bg-rose-950/60 text-rose-400 hover:bg-rose-900/60 hover:text-rose-300 font-bold text-xs flex-shrink-0">✕</button>
      </div>
    `).join('');
  }

  function pushItem(item) {
    if (!S.activeCart) S.activeCart = [];
    if (item.imei) {
      const normImei = C.normalizeIMEI(item.imei);
      const dup = S.activeCart.some((x) => C.normalizeIMEI(x.imei) === normImei);
      if (dup) { C.toast('IMEI already in cart', 'warning'); C.playErrorBeep(); return false; }
    }
    S.activeCart.push(item);
    C.safeSave('sfp_active_cart', S.activeCart);
    renderCart(); renderPreview(); C.playBeep();
    return true;
  }

  function addManualItem() {
    if (!requirePerm('billing.create')) return;
    const model = (document.getElementById('billItemModel')?.value || '').trim();
    const imei  = (document.getElementById('billItemIMEI')?.value || '').trim();
    const hsn   = billType === 'GST' ? (document.getElementById('billItemHSN')?.value || '8517').trim() : '';
    const gst   = billType === 'GST' ? (parseFloat(document.getElementById('billItemGST')?.value) || 18) : 0;
    const qty   = parseInt(document.getElementById('billItemQty')?.value, 10) || 1;
    const rate  = parseFloat(document.getElementById('billItemRate')?.value) || 0;

    if (!model) { C.toast('Enter model name', 'warning'); return; }
    if (rate <= 0) { C.toast('Enter valid rate', 'warning'); return; }

    let stockId = null, purchaseCost = 0;
    if (imei) {
      const normImei = C.normalizeIMEI(imei);
      const stockItem = S.inventory.find((x) => x.imei && C.normalizeIMEI(x.imei) === normImei && x.status !== 'Sold');
      if (stockItem) { stockId = stockItem.id; purchaseCost = stockItem.purchaseCost || 0; }
    }

    const ok = pushItem({ stockId, model, imei, hsn, gst, qty, rate, purchaseCost });
    if (ok) {
      document.getElementById('billItemModel').value = '';
      document.getElementById('billItemIMEI').value = '';
      document.getElementById('billItemRate').value = '';
      document.getElementById('billItemModel').focus();
    }
  }

  function removeItem(idx) {
    if (!S.activeCart) return;
    S.activeCart.splice(idx, 1);
    C.safeSave('sfp_active_cart', S.activeCart);
    renderCart(); renderPreview();
  }


  /* ============================================================
     BARCODE
     ============================================================ */
  function handleBarcodeKey(e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const code = (e.target.value || '').trim();
    if (!code) return;
    e.target.value = '';
    handleScannedCode(code);
  }

  function handleScannedCode(code) {
    if (!requirePerm('billing.create')) return;
    const norm = C.normalizeIMEI(code);
    const stockItem = S.inventory.find((x) => (x.imei && C.normalizeIMEI(x.imei) === norm) || (x.model && x.model.toLowerCase() === code.toLowerCase()));
    if (stockItem) {
      if (stockItem.status === 'Sold') { C.toast('Already SOLD: ' + stockItem.model, 'error'); C.playErrorBeep(); return; }
      pushItem({
        stockId: stockItem.id, model: stockItem.model, imei: stockItem.imei || '',
        hsn: billType === 'GST' ? '8517' : '', gst: billType === 'GST' ? (stockItem.gst || 18) : 0,
        qty: 1, rate: stockItem.cost || 0, purchaseCost: stockItem.purchaseCost || 0
      });
      return;
    }
    C.playErrorBeep();
    const rate = prompt('"' + code + '" not in stock.\n\nEnter selling price (₹):', '0');
    if (!rate || isNaN(rate) || parseFloat(rate) <= 0) return;
    const model = prompt('Enter model name:', 'Mobile Device') || 'Device';
    pushItem({ stockId: null, model, imei: code, hsn: billType === 'GST' ? '8517' : '', gst: billType === 'GST' ? 18 : 0, qty: 1, rate: parseFloat(rate), purchaseCost: 0 });
  }

  function lookupIMEI(val) {
    const norm = C.normalizeIMEI(val);
    if (!norm || norm.length < 5) return;
    const stockItem = S.inventory.find((x) => x.imei && C.normalizeIMEI(x.imei) === norm && x.status !== 'Sold');
    if (stockItem) {
      document.getElementById('billItemModel').value = stockItem.model;
      document.getElementById('billItemRate').value = stockItem.cost;
      C.playBeep();
    }
  }


  /* ============================================================
     INVOICE NUMBER
     ============================================================ */
  async function refreshInvoiceNo() {
    const el = document.getElementById('billInvNo');
    if (!el) return;
    el.value = 'Fetching...';
    try {
      const d = new Date(document.getElementById('billInvDate')?.value || new Date());
      const fy = C.getFY(d).short;
      const no = await Cl.nextAtomicNumber('invoice', fy);
      el.value = no || 'SFP-' + fy + '-TMP';
    } catch (e) { el.value = 'SFP-ERROR'; }
  }

  function onDateChange() {
    const d = document.getElementById('billInvDate')?.value;
    if (d) {
      const fy = C.getFY(new Date(d)).label;
      const badge = document.getElementById('billFyBadge');
      if (badge) badge.textContent = fy;
    }
    refreshInvoiceNo();
    renderPreview();
  }


  /* ============================================================
     SCANNER
     ============================================================ */
  let scannerActive = false;
  let html5Qr = null;

  async function toggleScanner() {
    const wrap = document.getElementById('billScannerWrap');
    const btn  = document.getElementById('billScannerBtn');

    if (typeof Html5Qrcode === 'undefined') {
      try {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
          s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
      } catch (e) { C.toast('Scanner library failed', 'error'); return; }
    }

    if (scannerActive) {
      try { await html5Qr.stop(); await html5Qr.clear(); } catch (e) {}
      scannerActive = false;
      if (wrap) wrap.style.display = 'none';
      if (btn) btn.textContent = '📷 Scan';
      return;
    }

    if (wrap) wrap.style.display = 'block';
    if (btn) btn.textContent = '✕ Close';

    try {
      html5Qr = new Html5Qrcode('billReader');
      await html5Qr.start({ facingMode: 'environment' }, { fps: 12, qrbox: { width: 280, height: 160 } }, (decodedText) => { handleScannedCode(decodedText); }, () => {});
      scannerActive = true;
    } catch (e) {
      C.toast('Camera error: ' + (e.message || 'denied'), 'error');
      if (wrap) wrap.style.display = 'none';
      if (btn) btn.textContent = '📷 Scan';
    }
  }


  /* ============================================================
     FINALIZE
     ============================================================ */
  async function finalize() {
    if (!requirePerm('billing.create', 'You cannot create invoices')) return;

    const items = S.activeCart || [];
    if (items.length === 0) { C.toast('Cart is empty', 'warning'); return; }

    for (const it of items) {
      if (it.imei) {
        const norm = C.normalizeIMEI(it.imei);
        const sold = S.inventory.find((x) => x.imei && C.normalizeIMEI(x.imei) === norm && x.status === 'Sold');
        if (sold) { C.toast('IMEI already sold: ' + it.imei, 'error'); return; }
      }
    }

    const invNo = document.getElementById('billInvNo')?.value || '';
    if (!invNo || invNo === 'Fetching...' || invNo.includes('ERROR')) {
      C.toast('Invoice number not ready.', 'warning'); return;
    }

    const invDate   = document.getElementById('billInvDate')?.value || C.fmtDate(new Date());
    const custName  = (document.getElementById('billCustName')?.value || 'Cash Customer').trim() || 'Cash Customer';
    const custPhone = (document.getElementById('billCustPhone')?.value || '').trim();
    const custAddr  = (document.getElementById('billCustAddr')?.value || '').trim();
    const custGSTIN = billType === 'GST' ? (document.getElementById('billCustGSTIN')?.value || '').trim() : '';
    const ledger    = document.getElementById('billLedger')?.value || 'Cash-in-Hand';
    const taxType   = billType === 'GST' ? (document.getElementById('billGstType')?.value || 'INTRA') : 'NONE';
    const discount  = parseFloat(document.getElementById('billDiscount')?.value) || 0;

    let tGross = 0, tTaxable = 0, tTax = 0, tPurchase = 0;
    let tCGST = 0, tSGST = 0, tIGST = 0;

    items.forEach((it) => {
      const lineTotal = (it.rate || 0) * (it.qty || 1);
      if (billType === 'NON_GST') {
        tGross += lineTotal;
        tTaxable += lineTotal;
        tPurchase += (it.purchaseCost || 0) * (it.qty || 1);
      } else {
        const lineTaxable = lineTotal / (1 + (it.gst || 0) / 100);
        const lineTax = lineTotal - lineTaxable;
        tGross += lineTotal;
        tTaxable += lineTaxable;
        tTax += lineTax;
        tPurchase += (it.purchaseCost || 0) * (it.qty || 1);
        if (taxType === 'INTRA') { tCGST += lineTax / 2; tSGST += lineTax / 2; }
        else { tIGST += lineTax; }
      }
    });

    if (discount < 0 || discount > tGross) { C.toast('Discount must be between ₹0 and total', 'warning'); return; }

    const finalPayable = tGross - discount;
    const factor = tGross > 0 ? finalPayable / tGross : 1;
    const fTaxable = tTaxable * factor;
    const fTax = tTax * factor;
    const fCGST = tCGST * factor;
    const fSGST = tSGST * factor;
    const fIGST = tIGST * factor;

    const record = {
      id: invNo, invoiceNo: invNo, date: invDate,
      billType: billType,
      financialYear: C.getFY(new Date(invDate)).label,
      customerName: custName, customerPhone: custPhone,
      customerAddress: custAddr, customerGSTIN: custGSTIN,
      taxType, ledger, discount,
      items: JSON.parse(JSON.stringify(items)),
      totalTaxable: +fTaxable.toFixed(2),
      totalCGST: +fCGST.toFixed(2), totalSGST: +fSGST.toFixed(2), totalIGST: +fIGST.toFixed(2),
      totalTax: +fTax.toFixed(2), totalGross: +finalPayable.toFixed(2),
      totalPurchaseCost: +tPurchase.toFixed(2),
      createdAt: new Date().toISOString()
    };

    if (!Array.isArray(S.invoices)) S.invoices = [];
    S.invoices.unshift(record);
    C.safeSave('sfp_invoices', S.invoices);

    items.forEach((it) => {
      if (it.stockId) {
        const stk = S.inventory.find((x) => x.id === it.stockId);
        if (stk) { stk.status = 'Sold'; stk.soldInvoice = invNo; stk.soldDate = invDate; }
      }
    });
    C.safeSave('sfp_stock', S.inventory);

    try {
      await Cl.pushOne('invoices', record);
      for (const it of items) {
        if (it.stockId) {
          const stk = S.inventory.find((x) => x.id === it.stockId);
          if (stk) await Cl.pushOne('inventory', stk);
        }
      }
    } catch (e) { C.toast('Saved locally. Sync pending.', 'warning', 4000); }

    try { window.SF.state.logAudit('INVOICE_CREATE', (billType === 'NON_GST' ? '[NonGST] ' : '') + invNo + ' | ' + custName + ' | ₹' + finalPayable.toFixed(2)); } catch (e) {}

    printInvoice();

    S.activeCart = [];
    C.safeSave('sfp_active_cart', S.activeCart);
    renderCart();
    refreshInvoiceNo();

    document.getElementById('billCustName').value = '';
    document.getElementById('billCustPhone').value = '';
    document.getElementById('billCustAddr').value = '';
    const gstinEl = document.getElementById('billCustGSTIN');
    if (gstinEl) gstinEl.value = '';
    document.getElementById('billDiscount').value = '0';

    renderPreview();

    setTimeout(() => {
      try { C.toast('✅ ' + (billType === 'NON_GST' ? 'Bill' : 'Invoice') + ' ' + invNo + ' saved', 'success', 2500); } catch (e) {}
    }, 1200);
  }


  /* ============================================================
     PRINT — iframe
     ============================================================ */
  function printInvoice() {
    const srcEl = document.getElementById('billInvoicePreview');
    if (!srcEl || !srcEl.innerHTML.trim()) { C.toast('Nothing to print', 'warning'); return; }
    const html = srcEl.innerHTML;

    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none;';
    document.body.appendChild(iframe);
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Invoice</title><style>
      @page { size: A4 portrait; margin: 4mm; }
      * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html, body { margin:0; padding:0; background:#fff; color:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:10px; }
      .print-wrapper { width:202mm; min-height:285mm; margin:0 auto; padding:2mm 3mm; }
      table { border-collapse: collapse; }
      tr { page-break-inside: avoid; }
      img { max-width:100%; }
      button { display:none !important; }
    </style></head><body><div class="print-wrapper">${html}</div></body></html>`);
    doc.close();
    const triggerPrint = () => {
      try { iframe.contentWindow.focus(); iframe.contentWindow.print(); } catch (e) { C.toast('Print blocked. Allow popups.', 'error', 4000); }
      setTimeout(() => { try { document.body.removeChild(iframe); } catch (e) {} }, 1500);
    };
    if (iframe.contentWindow.document.readyState === 'complete') setTimeout(triggerPrint, 500);
    else { iframe.onload = () => setTimeout(triggerPrint, 500); setTimeout(triggerPrint, 1200); }
  }


  function populateCustomerList() {
    const dl = document.getElementById('billCustomerList');
    if (!dl) return;
    const parties = S.parties || [];
    dl.innerHTML = parties.filter((p) => p.type === 'CUSTOMER').map((p) => `<option value="${C.escapeHTML(p.name)}">${C.escapeHTML(p.phone || '')}</option>`).join('');
  }


  /* ============================================================
     INIT
     ============================================================ */
  async function init_billingModule() {
    console.log('%c🧾 Billing module initialized (v4.4.0)', 'color:#0ea5e9;font-weight:bold');

    if (!window.SF?.perms?.can?.('billing.view')) {
      const c = document.getElementById('moduleContainer');
      if (c) c.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:28px;background:#1e1b2e;border:1px solid #7f1d1d;border-radius:16px;text-align:center;"><div style="font-size:42px;margin-bottom:12px">🔒</div><div style="font-size:16px;font-weight:800;color:#fca5a5;">Access Denied</div></div>';
      return { onUnload: () => {} };
    }

    const dateEl = document.getElementById('billInvDate');
    if (dateEl && !dateEl.value) dateEl.value = C.fmtDate(new Date());

    const fy = C.getFY(new Date());
    const badge = document.getElementById('billFyBadge');
    if (badge) badge.textContent = fy.label;

    /* Default GST */
    billType = 'GST';
    setBillType('GST');

    await refreshInvoiceNo();

    try {
      const cart = JSON.parse(localStorage.getItem('sfp_active_cart') || '[]');
      if (Array.isArray(cart) && cart.length > 0) S.activeCart = cart;
    } catch (e) {}

    renderCart(); renderPreview();

    setTimeout(() => {
      const b = document.getElementById('billBarcodeInput');
      if (b && window.innerWidth > 640) b.focus();
    }, 400);

    if (window.SF?.state?.on) {
      window.SF.state.on('profile:updated', () => renderPreview());
      window.SF.state.on('change:inventory', () => populateCustomerList());
      window.SF.state.on('change:parties', () => populateCustomerList());
    }

    populateCustomerList();

    return { onUnload: () => {} };
  }


  window.SF = window.SF || {};
  window.SF.billing = {
    renderPreview, renderCart, addManualItem, removeItem,
    handleBarcodeKey, handleScannedCode, lookupIMEI,
    onDateChange, toggleScanner, finalize, refreshInvoiceNo,
    printInvoice, setBillType, init: init_billingModule
  };

  window.init_billingModule = init_billingModule;

  if (document.getElementById('billingModule')) {
    init_billingModule();
  }
})();
</script>
