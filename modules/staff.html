<!-- ============================================================
     SMARTFIX ERP — Staff & Salary Module
     File: modules/staff.html
     Version: 4.0.0
     ============================================================ -->

<section id="staffModule" class="grid grid-cols-1 lg:grid-cols-12 gap-4">

  <!-- ============================================================
       LEFT PANEL — STAFF MASTER + PAY SALARY
       ============================================================ -->
  <div class="lg:col-span-4 space-y-3">

    <!-- ============ STAFF MASTER ============ -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="font-bold text-xs uppercase tracking-wider text-white" id="stfFormTitle">
          👨‍💼 New Staff
        </h2>
        <button type="button" onclick="SF.staff.resetForm()" id="stfResetBtn"
                class="text-[10px] text-slate-500 hover:text-slate-300 font-bold hidden">
          ✕ Cancel
        </button>
      </div>

      <input type="hidden" id="stfEditId" value="">

      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Full Name *</label>
        <input type="text" id="stfName" placeholder="e.g. Ramesh Kumar"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-semibold">
      </div>

      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Designation</label>
        <input type="text" id="stfDesignation" placeholder="e.g. Salesman, Technician"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs">
      </div>

      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Phone</label>
        <input type="tel" id="stfPhone" placeholder="10-digit" maxlength="10"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-mono">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Monthly Salary ₹ *</label>
          <input type="number" id="stfSalary" placeholder="0" step="0.01"
                 class="w-full bg-slate-950 border border-emerald-700/60 rounded-lg px-2.5 py-2 text-xs font-bold text-emerald-300 text-right">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Joining Date</label>
          <input type="date" id="stfJoining"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs">
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Address (Optional)</label>
        <textarea id="stfAddress" rows="2" placeholder="Address"
                  class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs resize-none"></textarea>
      </div>

      <button type="button" id="stfSaveBtn" onclick="SF.staff.save()"
              class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-black py-3 rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition">
        💾 Save Staff
      </button>
    </div>

    <!-- ============ PAY SALARY ============ -->
    <div class="bg-emerald-950/30 border border-emerald-800/60 rounded-2xl p-4 space-y-3">
      <h3 class="text-[11px] font-bold uppercase tracking-wider text-emerald-300 border-b border-emerald-800/60 pb-2">
        💰 Pay Salary
      </h3>

      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Select Staff *</label>
        <select id="stfSalaryStaff" onchange="SF.staff.onStaffSelected()"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-bold">
          <option value="">— Choose staff —</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Month</label>
          <select id="stfSalaryMonth"
                  class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Year</label>
          <input type="number" id="stfSalaryYear"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-bold">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Amount ₹ *</label>
          <input type="number" id="stfSalaryAmount" placeholder="0" step="0.01"
                 class="w-full bg-slate-950 border border-emerald-700/60 rounded-lg px-2.5 py-2 text-xs font-bold text-emerald-300 text-right">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Pay Date</label>
          <input type="date" id="stfSalaryPayDate"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Paid Via</label>
          <select id="stfSalaryPayMode"
                  class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs">
            <option value="Cash-in-Hand">Cash</option>
            <option value="Bank / UPI">Bank / UPI</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Bonus ₹</label>
          <input type="number" id="stfSalaryBonus" value="0" step="0.01"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-right">
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold uppercase mb-1 text-slate-400">Note (Optional)</label>
        <input type="text" id="stfSalaryNote" placeholder="e.g. Advance adjustment"
               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs">
      </div>

      <button type="button" onclick="SF.staff.paySalary()"
              class="w-full bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white font-black py-3 rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition">
        💵 Pay Salary & Print Slip
      </button>
    </div>

  </div>


  <!-- ============================================================
       RIGHT PANEL — STAFF LIST + PAYMENT HISTORY
       ============================================================ -->
  <div class="lg:col-span-8 space-y-3">

    <!-- ============ STATS ============ -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-slate-500">Total Staff</div>
        <div id="stfStatCount" class="text-lg font-black text-white mt-0.5">0</div>
      </div>
      <div class="bg-indigo-950/40 border border-indigo-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-indigo-400">Monthly Payroll</div>
        <div id="stfStatPayroll" class="text-lg font-black text-indigo-300 mt-0.5">₹0</div>
      </div>
      <div class="bg-emerald-950/40 border border-emerald-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-emerald-400">Paid (This Month)</div>
        <div id="stfStatPaidMonth" class="text-lg font-black text-emerald-300 mt-0.5">₹0</div>
      </div>
      <div class="bg-amber-950/40 border border-amber-800/40 rounded-xl p-3">
        <div class="text-[9px] font-bold uppercase text-amber-400">Total Paid (All)</div>
        <div id="stfStatPaidTotal" class="text-lg font-black text-amber-300 mt-0.5">₹0</div>
      </div>
    </div>

    <!-- ============ STAFF LIST ============ -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex flex-wrap justify-between items-center gap-2">
        <h3 class="font-bold text-xs uppercase tracking-wider text-slate-300">
          👥 Staff Members
        </h3>
        <input type="text" id="stfSearchInput" oninput="SF.staff.renderStaffList()"
               placeholder="🔍 Search name, phone..."
               class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-[11px] text-slate-200 w-48">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse min-w-[700px]">
          <thead class="bg-slate-950/70 text-slate-500 uppercase text-[10px]">
            <tr>
              <th class="p-2.5 border-b border-slate-800">Name</th>
              <th class="p-2.5 border-b border-slate-800">Designation</th>
              <th class="p-2.5 border-b border-slate-800">Phone</th>
              <th class="p-2.5 border-b border-slate-800 text-right">Salary</th>
              <th class="p-2.5 border-b border-slate-800">Joined</th>
              <th class="p-2.5 border-b border-slate-800 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="stfListBody" class="divide-y divide-slate-800/60">
            <tr>
              <td colspan="6" class="text-center py-8 text-slate-500 text-xs">
                No staff added yet.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ============ SALARY HISTORY ============ -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex flex-wrap justify-between items-center gap-2">
        <h3 class="font-bold text-xs uppercase tracking-wider text-slate-300">
          💵 Salary Payment History
        </h3>
        <div class="flex items-center gap-2">
          <span id="stfPayCount" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-1 rounded font-mono">
            0 payments
          </span>
          <input type="text" id="stfPayFilter"
                 oninput="SF.staff.renderPayHistory()"
                 placeholder="🔍 Filter..."
                 class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-[11px] text-slate-200 w-36">
        </div>
      </div>

      <div class="overflow-x-auto max-h-[60vh]">
        <table class="w-full text-left text-xs border-collapse min-w-[800px]">
          <thead class="bg-slate-950 sticky top-0 z-10">
            <tr>
              <th class="p-2.5 text-[10px] uppercase text-slate-500 font-bold whitespace-nowrap">Pay Date</th>
              <th class="p-2.5 text-[10px] uppercase text-slate-500 font-bold">Staff</th>
              <th class="p-2.5 text-[10px] uppercase text-slate-500 font-bold">For Month</th>
              <th class="p-2.5 text-[10px] uppercase text-slate-500 font-bold text-right whitespace-nowrap">Salary</th>
              <th class="p-2.5 text-[10px] uppercase text-slate-500 font-bold text-right whitespace-nowrap">Bonus</th>
              <th class="p-2.5 text-[10px] uppercase text-slate-500 font-bold text-right whitespace-nowrap">Total</th>
              <th class="p-2.5 text-[10px] uppercase text-slate-500 font-bold text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="stfPayHistoryBody" class="divide-y divide-slate-800/60">
            <tr>
              <td colspan="7" class="text-center py-8 text-slate-500 text-xs">
                No salary payments yet.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

</section>


<!-- ============================================================
     STAFF MODULE LOGIC
     ============================================================ -->
<script>
(function () {
  'use strict';

  const S  = window.SF?.state?.state;
  const C  = window.SF?.common;
  const Cl = window.SF?.cloud;

  if (!S || !C) {
    console.error('Staff module: SF globals not ready');
    return;
  }

  /* ============================================================
     MODULE STATE
     ============================================================ */
  const SM = {
    editingId: null
  };


  /* ============================================================
     1. INIT
     ============================================================ */
  function init_staffModule() {
    console.log('%c👨‍💼 Staff module initialized', 'color:#8b5cf6;font-weight:bold');

    SM.editingId = null;

    /* Default joining date */
    const jEl = document.getElementById('stfJoining');
    if (jEl && !jEl.value) jEl.value = C.fmtDate(new Date());

    /* Default salary pay date */
    const pdEl = document.getElementById('stfSalaryPayDate');
    if (pdEl && !pdEl.value) pdEl.value = C.fmtDate(new Date());

    /* Default year + month */
    const today = new Date();
    const yEl = document.getElementById('stfSalaryYear');
    if (yEl) yEl.value = today.getFullYear();
    const mEl = document.getElementById('stfSalaryMonth');
    if (mEl) mEl.value = today.getMonth() + 1;

    resetForm();
    populateStaffDropdown();
    renderStaffList();
    renderPayHistory();

    /* Subscribe to state changes */
    if (window.SF?.state?.on) {
      window.SF.state.on('change:staff', () => {
        populateStaffDropdown();
        renderStaffList();
      });
      window.SF.state.on('change:salaryPayments', () => {
        renderPayHistory();
        updateStats();
      });
    }

    updateStats();

    /* Focus name */
    setTimeout(() => {
      const n = document.getElementById('stfName');
      if (n && window.innerWidth > 640) n.focus();
    }, 250);

    return {
      onUnload: () => {
        console.log('Staff module unloading');
      }
    };
  }


  /* ============================================================
     2. SAVE STAFF
     ============================================================ */
  async function save() {
    const name        = (document.getElementById('stfName')?.value || '').trim();
    const designation = (document.getElementById('stfDesignation')?.value || '').trim();
    const phone       = (document.getElementById('stfPhone')?.value || '').trim();
    const salary      = parseFloat(document.getElementById('stfSalary')?.value) || 0;
    const joining     = document.getElementById('stfJoining')?.value || C.fmtDate(new Date());
    const address     = (document.getElementById('stfAddress')?.value || '').trim();

    if (!name || name.length < 2) {
      C.toast('Enter staff name (min 2 chars)', 'warning');
      return;
    }
    if (salary <= 0) {
      C.toast('Enter valid monthly salary', 'warning');
      return;
    }
    if (phone && !/^\d{10}$/.test(phone)) {
      C.toast('Phone must be 10 digits', 'warning');
      return;
    }

    /* Duplicate check */
    const dup = (S.staff || []).find((x) =>
      x.name.toLowerCase() === name.toLowerCase() && x.id !== SM.editingId
    );
    if (dup) {
      C.toast('Staff already exists: ' + name, 'warning');
      return;
    }

    const staff = {
      id: SM.editingId || ('stf-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6)),
      name,
      designation,
      phone,
      salary: +salary.toFixed(2),
      joining,
      address,
      createdAt: new Date().toISOString()
    };

    if (!Array.isArray(S.staff)) S.staff = [];

    if (SM.editingId) {
      const idx = S.staff.findIndex((x) => x.id === SM.editingId);
      if (idx === -1) { C.toast('Staff not found', 'error'); return; }
      S.staff[idx] = { ...S.staff[idx], ...staff };
      C.toast('Staff updated: ' + name, 'success');
      try { window.SF.state.logAudit('STAFF_UPDATE', name + ' | ₹' + salary); } catch (e) {}
    } else {
      S.staff.push(staff);
      C.toast('Staff saved: ' + name, 'success');
      try { window.SF.state.logAudit('STAFF_CREATE', name + ' | ₹' + salary); } catch (e) {}
    }

    C.safeSave('sfp_staff', S.staff);

    /* Push to cloud */
    try {
      await Cl.pushOne('staff', staff);
    } catch (e) {
      console.warn('Cloud push failed:', e);
    }

    C.playBeep();
    resetForm();
    populateStaffDropdown();
    renderStaffList();
    updateStats();
  }


  /* ============================================================
     3. RESET FORM
     ============================================================ */
  function resetForm() {
    SM.editingId = null;
    const ids = ['stfName', 'stfDesignation', 'stfPhone', 'stfSalary', 'stfAddress'];
    ids.forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    const jEl = document.getElementById('stfJoining');
    if (jEl) jEl.value = C.fmtDate(new Date());
    const idEl = document.getElementById('stfEditId');
    if (idEl) idEl.value = '';

    const titleEl = document.getElementById('stfFormTitle');
    if (titleEl) titleEl.textContent = '👨‍💼 New Staff';
    const resetBtn = document.getElementById('stfResetBtn');
    if (resetBtn) resetBtn.classList.add('hidden');
    const saveBtn = document.getElementById('stfSaveBtn');
    if (saveBtn) saveBtn.textContent = '💾 Save Staff';
  }


  /* ============================================================
     4. EDIT STAFF
     ============================================================ */
  function edit(id) {
    const s = (S.staff || []).find((x) => x.id === id);
    if (!s) { C.toast('Not found', 'error'); return; }

    SM.editingId = id;

    const setVal = (elId, v) => {
      const el = document.getElementById(elId);
      if (el) el.value = v ?? '';
    };
    setVal('stfName', s.name);
    setVal('stfDesignation', s.designation);
    setVal('stfPhone', s.phone);
    setVal('stfSalary', s.salary);
    setVal('stfJoining', s.joining);
    setVal('stfAddress', s.address);
    setVal('stfEditId', id);

    const titleEl = document.getElementById('stfFormTitle');
    if (titleEl) titleEl.textContent = '✏ Edit Staff';
    const resetBtn = document.getElementById('stfResetBtn');
    if (resetBtn) resetBtn.classList.remove('hidden');
    const saveBtn = document.getElementById('stfSaveBtn');
    if (saveBtn) saveBtn.textContent = '💾 Update Staff';

    document.querySelector('#staffModule')?.scrollIntoView({ behavior: 'smooth' });
    setTimeout(() => {
      const n = document.getElementById('stfName');
      if (n) n.focus();
    }, 200);
  }


  /* ============================================================
     5. DELETE STAFF
     ============================================================ */
  async function deleteStaff(id) {
    const s = (S.staff || []).find((x) => x.id === id);
    if (!s) return;

    const pin = prompt('🔒 Master PIN to delete this staff:');
    if (!pin) return;
    if (pin !== (S.profile?.masterPin || '1234')) {
      C.toast('Incorrect PIN', 'error');
      C.playErrorBeep();
      return;
    }

    /* Count payments */
    const paymentCount = (S.salaryPayments || []).filter((p) => p.staffId === id).length;

    const ok = await C.confirmDialog(
      'Delete Staff?',
      s.name + '\n' + (s.designation || '—') + '\n\nMonthly: ₹' + (s.salary || 0).toFixed(2) +
      '\n\nHistorical salary payments (' + paymentCount + ') will NOT be deleted.',
      'Delete',
      true
    );
    if (!ok) return;

    S.staff = S.staff.filter((x) => x.id !== id);
    C.safeSave('sfp_staff', S.staff);

    try {
      await Cl.deleteOne('staff', id);
    } catch (e) {}

    try {
      window.SF.state.logAudit('STAFF_DELETE', s.name);
    } catch (e) {}

    C.toast('Staff deleted: ' + s.name, 'success');
    populateStaffDropdown();
    renderStaffList();
    updateStats();
  }


  /* ============================================================
     6. POPULATE STAFF DROPDOWN
     ============================================================ */
  function populateStaffDropdown() {
    const sel = document.getElementById('stfSalaryStaff');
    if (!sel) return;

    const staff = S.staff || [];
    const currentVal = sel.value;

    sel.innerHTML = '<option value="">— Choose staff —</option>' +
      staff.map((s) =>
        `<option value="${s.id}">${C.escapeHTML(s.name)} — ₹${(s.salary || 0).toFixed(0)}</option>`
      ).join('');

    /* Restore selection if still exists */
    if (currentVal && staff.some((s) => s.id === currentVal)) {
      sel.value = currentVal;
    }
  }


  /* ============================================================
     7. ON STAFF SELECTED — AUTO-FILL SALARY
     ============================================================ */
  function onStaffSelected() {
    const sel = document.getElementById('stfSalaryStaff');
    const staffId = sel?.value;
    if (!staffId) return;

    const s = (S.staff || []).find((x) => x.id === staffId);
    if (!s) return;

    const amtEl = document.getElementById('stfSalaryAmount');
    if (amtEl) amtEl.value = s.salary || 0;
  }


  /* ============================================================
     8. PAY SALARY
     ============================================================ */
  async function paySalary() {
    const staffId  = document.getElementById('stfSalaryStaff')?.value;
    const month    = parseInt(document.getElementById('stfSalaryMonth')?.value, 10);
    const year     = parseInt(document.getElementById('stfSalaryYear')?.value, 10);
    const amount   = parseFloat(document.getElementById('stfSalaryAmount')?.value) || 0;
    const payDate  = document.getElementById('stfSalaryPayDate')?.value || C.fmtDate(new Date());
    const payMode  = document.getElementById('stfSalaryPayMode')?.value || 'Cash-in-Hand';
    const bonus    = parseFloat(document.getElementById('stfSalaryBonus')?.value) || 0;
    const note     = (document.getElementById('stfSalaryNote')?.value || '').trim();

    if (!staffId) {
      C.toast('Select a staff member', 'warning');
      return;
    }
    if (amount <= 0) {
      C.toast('Enter valid salary amount', 'warning');
      return;
    }
    if (!month || month < 1 || month > 12) {
      C.toast('Invalid month', 'warning');
      return;
    }
    if (!year || year < 2000 || year > 2100) {
      C.toast('Invalid year', 'warning');
      return;
    }

    const s = (S.staff || []).find((x) => x.id === staffId);
    if (!s) { C.toast('Staff not found', 'error'); return; }

    /* Duplicate check: same staff + same month + same year */
    const dup = (S.salaryPayments || []).find(
      (p) => p.staffId === staffId && p.month === month && p.year === year
    );
    if (dup) {
      const ok = await C.confirmDialog(
        'Already Paid?',
        'Salary for ' + monthName(month) + ' ' + year + ' has already been paid:\n\n' +
        '₹' + (dup.total || 0).toFixed(2) + ' on ' + dup.payDate +
        '\n\nContinue with another payment?',
        'Pay Again',
        true
      );
      if (!ok) return;
    }

    const monthLabel = monthName(month) + ' ' + year;
    const total = +(amount + bonus).toFixed(2);

    /* Record */
    const payment = {
      id: 'sal-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      staffId,
      staffName: s.name,
      designation: s.designation || '',
      payDate,
      month,
      year,
      monthLabel,
      salary: +amount.toFixed(2),
      bonus: +bonus.toFixed(2),
      total,
      payMode,
      note,
      createdAt: new Date().toISOString()
    };

    if (!Array.isArray(S.salaryPayments)) S.salaryPayments = [];
    S.salaryPayments.unshift(payment);
    C.safeSave('sfp_salary_payments', S.salaryPayments);

    /* Also record as EXPENSE voucher for books consistency */
    const voucher = {
      id: 'vch-sal-' + Date.now(),
      type: 'EXPENSE',
      date: payDate,
      amount: total,
      category: 'Staff Salary — ' + s.name,
      account: payMode,
      narration: 'Salary for ' + monthLabel + (bonus > 0 ? ' + Bonus ₹' + bonus : '') + (note ? ' | ' + note : ''),
      createdAt: new Date().toISOString(),
      _autoGenerated: true,
      _sourcePaymentId: payment.id
    };
    if (!Array.isArray(S.vouchers)) S.vouchers = [];
    S.vouchers.unshift(voucher);
    C.safeSave('sfp_vouchers', S.vouchers);

    /* Cloud push */
    try {
      await Cl.pushOne('salaryPayments', payment);
      await Cl.pushOne('vouchers', voucher);
    } catch (e) {
      console.warn('Cloud push failed:', e);
      C.toast('Saved locally. Will sync when online.', 'warning', 3500);
    }

    /* Audit */
    try {
      window.SF.state.logAudit('SALARY_PAID', s.name + ' | ' + monthLabel + ' | ₹' + total);
    } catch (e) {}

    C.toast(
      'Salary paid: ' + s.name + ' — ' + monthLabel + ' — ₹' + total.toFixed(2),
      'success', 4000
    );
    C.playBeep();

    /* Print slip */
    printSalarySlip(payment.id);

    /* Reset pay fields */
    document.getElementById('stfSalaryAmount').value = '';
    document.getElementById('stfSalaryBonus').value = '0';
    document.getElementById('stfSalaryNote').value = '';
    document.getElementById('stfSalaryStaff').value = '';

    /* Refresh UI */
    renderPayHistory();
    updateStats();
  }


  /* ============================================================
     9. RENDER STAFF LIST
     ============================================================ */
  function renderStaffList() {
    const body = document.getElementById('stfListBody');
    if (!body) return;

    const searchQ = (document.getElementById('stfSearchInput')?.value || '').trim().toLowerCase();
    const staff = S.staff || [];

    let filtered = staff;
    if (searchQ) {
      filtered = staff.filter((s) => {
        const blob = (s.name + ' ' + (s.designation || '') + ' ' + (s.phone || '')).toLowerCase();
        return blob.includes(searchQ);
      });
    }

    /* Sort by name */
    filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    if (filtered.length === 0) {
      body.innerHTML = `
        <tr>
          <td colspan="6" class="text-center py-8 text-slate-500 text-xs">
            ${searchQ ? 'No matches.' : 'No staff added yet.'}
          </td>

    body.innerHTML = filtered.map((s) => `
      <tr class="hover:bg-slate-800/30 transition">
        <td class="p-2.5 border-b border-slate-800/60">
          <div class="font-bold text-white text-[12px]">${C.escapeHTML(s.name)}</div>
          ${s.address ? `<div class="text-[10px] text-slate-500 truncate max-w-[180px]">${C.escapeHTML(s.address)}</div>` : ''}
        </td>
        <td class="p-2.5 border-b border-slate-800/60 text-slate-300 text-[11.5px]">
          ${C.escapeHTML(s.designation || '—')}
        </td>
        <td class="p-2.5 border-b border-slate-800/60 font-mono text-slate-400 text-[11px]">
          ${C.escapeHTML(s.phone || '—')}
        </td>
        <td class="p-2.5 border-b border-slate-800/60 text-right font-mono font-bold text-emerald-400 text-[11.5px]">

        <td class="p-2.5 border-b border-slate-800/60 font-mono text-slate-500 text-[10.5px]">
          ${C.escapeHTML(s.joining || '—')}

        <td class="p-2.5 border-b border-slate-800/60 text-center">
          <div class="inline-flex gap-1">
            <button type="button" onclick="SF.staff.quickPay('${s.id}')"

                    class="text-[10px] bg-emerald-950/60 hover:bg-emerald-900/60 text-emerald-400 font-bold px-2 py-1 rounded">
              💰
            </button>
            <button type="button" onclick="SF.staff.edit('${s.id}')"

                    class="text-[10px] bg-amber-950/60 hover:bg-amber-900/60 text-amber-400 font-bold px-2 py-1 rounded">
              ✏

            <button type="button" onclick="SF.staff.deleteStaff('${s.id}')"

  /* ============================================================
     10. QUICK PAY — from list button
     ============================================================ */
  function quickPay(staffId) {
    const sel = document.getElementById('stfSalaryStaff');
    if (sel) sel.value = staffId;
    onStaffSelected();

    /* Scroll pay section into view */
    document.getElementById('stfSalaryStaff')?.scrollIntoView({ behavior: 'smooth', block: 'center' });

    setTimeout(() => {
      const amtEl = document.getElementById('stfSalaryAmount');
      if (amtEl) amtEl.focus();
    }, 400);

  /* ============================================================
     11. RENDER PAY HISTORY
     ============================================================ */
  function renderPayHistory() {
    const body = document.getElementById('stfPayHistoryBody');
    const cntEl = document.getElementById('stfPayCount');
    if (!body) return;

    const filterQ = (document.getElementById('stfPayFilter')?.value || '').trim().toLowerCase();
    const payments = S.salaryPayments || [];

    if (cntEl) cntEl.textContent = payments.length + ' payment' + (payments.length !== 1 ? 's' : '');

    let filtered = payments;
    if (filterQ) {
      filtered = payments.filter((p) => {
        const blob = (
          (p.staffName || '') + ' ' +
          (p.monthLabel || '') + ' ' +
          (p.payDate || '') + ' ' +
          (p.note || '')
        ).toLowerCase();
        return blob.includes(filterQ);
      });
    }

    if (filtered.length === 0) {
      body.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-8 text-slate-500 text-xs">
            ${filterQ ? 'No matches.' : 'No salary payments yet.'}
          </td>
        </tr>`;
      return;
    }

    body.innerHTML = filtered.map((p) => {
      const idx = payments.indexOf(p);
      return `
        <tr class="hover:bg-slate-800/30 transition">
          <td class="p-2.5 border-b border-slate-800/60 font-mono text-slate-400 text-[11px] whitespace-nowrap">

  /* ============================================================
     12. DELETE PAYMENT
     ============================================================ */
  async function deletePayment(idx) {
    const payments = S.salaryPayments || [];
    const p = payments[idx];
    if (!p) return;

    const pin = prompt('🔒 Master PIN to delete this payment:');
    if (!pin) return;
    if (pin !== (S.profile?.masterPin || '1234')) {
      C.toast('Incorrect PIN', 'error');
      C.playErrorBeep();
      return;
    }

    const ok = await C.confirmDialog(
      'Delete Salary Payment?',
      p.staffName + '\n' + p.monthLabel + '\n₹' + (p.total || 0).toFixed(2) +
      '\n\nLinked voucher will also be deleted.',
      'Delete',
      true
    );
    if (!ok) return;

    /* Remove linked voucher */
    if (p.id) {
      S.vouchers = (S.vouchers || []).filter((v) => v._sourcePaymentId !== p.id);
      C.safeSave('sfp_vouchers', S.vouchers);
    }

    payments.splice(idx, 1);
    C.safeSave('sfp_salary_payments', S.salaryPayments);

    try {
      await Cl.deleteOne('salaryPayments', p.id);
    } catch (e) {}

    try {
      window.SF.state.logAudit('SALARY_DELETE', p.staffName + ' | ' + p.monthLabel + ' | ₹' + p.total);
    } catch (e) {}

    C.toast('Salary payment deleted', 'success');
    renderPayHistory();
    updateStats();
  }

    setTimeout(() => {

        target.innerHTML = '';

  /* ============================================================
     14. UPDATE STATS
     ============================================================ */
  function updateStats() {
    const staff = S.staff || [];
    const payments = S.salaryPayments || [];

    const monthlyPayroll = staff.reduce((a, s) => a + (s.salary || 0), 0);
    const totalPaid = payments.reduce((a, p) => a + (p.total || 0), 0);

    /* This month paid */
    const today = new Date();
    const thisMonth = today.getMonth() + 1;
    const thisYear  = today.getFullYear();
    const monthPaid = payments
      .filter((p) => p.month === thisMonth && p.year === thisYear)
      .reduce((a, p) => a + (p.total || 0), 0);

    setText('stfStatCount', staff.length);
    setText('stfStatPayroll', '₹' + fmt0(monthlyPayroll));
    setText('stfStatPaidMonth', '₹' + fmt0(monthPaid));
    setText('stfStatPaidTotal', '₹' + fmt0(totalPaid));
  }


  /* ============================================================
     15. HELPERS
     ============================================================ */
  function monthName(m) {
    const names = ['', 'January', 'February', 'March', 'April', 'May', 'June',
                   'July', 'August', 'September', 'October', 'November', 'December'];
    return names[m] || '';
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function fmt0(n) {
    const v = Number(n) || 0;
    return v.toLocaleString('en-IN', { maximumFractionDigits: 0 });
  }

  function fmt2(n) {
    const v = Number(n) || 0;
    return v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }


  /* ============================================================
     16. EXPOSE API
     ============================================================ */
  window.SF = window.SF || {};
  window.SF.staff = {
    init: init_staffModule,
    save,
    edit,
    resetForm,
    deleteStaff,
    populateStaffDropdown,
    onStaffSelected,
    paySalary,
    quickPay,
    renderStaffList,
    renderPayHistory,
    deletePayment,
    printSlip,
    updateStats
  };

  /* Router expects this */
  window.init_staffModule = init_staffModule;

  /* Auto-init fallback */
  if (document.getElementById('staffModule')) {
    init_staffModule();
  }
})();
</script>
