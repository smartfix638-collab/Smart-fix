  /* ============================================================
     INIT
     ============================================================ */
  function init_manualModule() {
    console.log('%c📖 Manual module initialized (v4.4.0)', 'color:#8b5cf6;font-weight:bold');

    /* Load saved language */
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved && T[saved]) MAN.lang = saved;
    } catch (e) {}

    /* Default section */
    MAN.currentSection = 'getting-started';

    renderLangButtons();
    renderSidebar();
    renderContent();
    updateHeaderText();

    return { onUnload: () => {} };
  }


  /* ============================================================
     LANGUAGE
     ============================================================ */
  function setLang(lang) {
    if (!T[lang]) return;
    MAN.lang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}

    renderLangButtons();
    renderSidebar();
    renderContent();
    updateHeaderText();
  }

  function renderLangButtons() {
    document.querySelectorAll('.man-lang-btn').forEach((btn) => {
      const l = btn.dataset.lang;
      if (l === MAN.lang) {
        btn.className = 'man-lang-btn px-3 py-1.5 rounded-md text-[11px] font-bold transition bg-violet-600 text-white';
      } else {
        btn.className = 'man-lang-btn px-3 py-1.5 rounded-md text-[11px] font-bold transition text-slate-400 hover:text-white';
      }
    });
  }

  function updateHeaderText() {
    const t = T[MAN.lang];
    const titleEl = document.getElementById('manTitle');
    const subEl = document.getElementById('manSubtitle');
    const contentsEl = document.getElementById('manContentsLabel');
    const searchEl = document.getElementById('manSearchInput');
    if (titleEl) titleEl.textContent = t.title;
    if (subEl) subEl.textContent = t.subtitle;
    if (contentsEl) contentsEl.textContent = t.contents;
    if (searchEl) searchEl.placeholder = t.searchPlaceholder;
  }


  /* ============================================================
     SIDEBAR
     ============================================================ */
  function renderSidebar() {
    const sidebar = document.getElementById('manSidebar');
    if (!sidebar) return;

    const sections = Object.keys(T[MAN.lang].sections);
    const q = MAN.searchQuery.toLowerCase();

    const filtered = q
      ? sections.filter((key) => {
          const label = T[MAN.lang].sections[key].toLowerCase();
          if (label.includes(q)) return true;
          /* Also search in content */
          const content = (CONTENT[key]?.[MAN.lang] || '').toLowerCase();
          return content.includes(q);
        })
      : sections;

    if (filtered.length === 0) {
      sidebar.innerHTML = `<div class="p-3 text-center text-[11px] text-slate-500">${T[MAN.lang].noResults} "${C.escapeHTML(MAN.searchQuery)}"</div>`;
      return;
    }

    sidebar.innerHTML = filtered.map((key) => {
      const label = T[MAN.lang].sections[key];
      const active = key === MAN.currentSection;
      return `
        <button type="button" onclick="SF.manual.goTo('${key}')"
                class="w-full text-left px-3 py-2 rounded-lg text-[12px] font-semibold transition ${active ? 'bg-violet-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
          ${label}
        </button>
      `;
    }).join('');
  }


  /* ============================================================
     CONTENT
     ============================================================ */
  function renderContent() {
    const content = document.getElementById('manContent');
    if (!content) return;

    const html = CONTENT[MAN.currentSection]?.[MAN.lang] || CONTENT[MAN.currentSection]?.['en'] || '<p class="text-slate-400">Content not available.</p>';
    content.innerHTML = html;
    content.scrollTop = 0;
  }


  /* ============================================================
     NAVIGATE
     ============================================================ */
  function goTo(sectionKey) {
    if (!CONTENT[sectionKey]) return;
    MAN.currentSection = sectionKey;
    renderSidebar();
    renderContent();
    try { localStorage.setItem(SCROLL_KEY, '0'); } catch (e) {}
  }


  /* ============================================================
     SEARCH
     ============================================================ */
  function search() {
    const el = document.getElementById('manSearchInput');
    MAN.searchQuery = (el?.value || '').trim();
    renderSidebar();
  }


  /* ============================================================
     EXPOSE
     ============================================================ */
  window.SF = window.SF || {};
  window.SF.manual = {
    init: init_manualModule,
    setLang,
    goTo,
    search,
    getLang: () => MAN.lang
  };

  window.init_manualModule = init_manualModule;

  if (document.getElementById('manualModule')) {
    init_manualModule();
  }
})();
</script>
