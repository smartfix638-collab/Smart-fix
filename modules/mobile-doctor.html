<!-- ============================================================
     SMARTFIX ERP — Mobile Doctor Pro (v5.0.0 - Total Diagnostic)
     ============================================================ -->

<div id="mobileDoctorModule" class="min-h-screen bg-[#030712] text-slate-100 font-sans p-2 md:p-4 select-none relative overflow-x-hidden">
  <div class="fixed top-0 left-1/4 w-[500px] h-[300px] bg-cyan-600/10 blur-[130px] rounded-full pointer-events-none -z-10"></div>

  <header class="bg-[#0b1120]/80 backdrop-blur-xl border border-cyan-900/40 rounded-2xl p-3 md:px-5 md:py-3 mb-4 shadow-[0_0_25px_rgba(6,182,212,0.1)] flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 p-[1px]">
        <div class="w-full h-full bg-[#070d19] rounded-[11px] flex items-center justify-center text-cyan-400 font-bold text-xl">🩺</div>
      </div>
      <div>
        <h1 class="text-base font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 uppercase">SMARTFIX DOCTOR</h1>
        <p class="text-[11px] text-slate-400">Scan QR to check real device hardware</p>
      </div>
    </div>

    <div class="flex items-center gap-3 flex-wrap">
      <div id="mdDeviceHeaderCard" class="hidden items-center gap-3 bg-[#0d1628]/90 border border-cyan-800/60 rounded-xl px-3.5 py-1.5">
        <div class="w-7 h-7 rounded-lg bg-cyan-950/80 flex items-center justify-center text-sm">📱</div>
        <div>
          <div id="mdHeaderModel" class="text-xs font-black text-white font-mono">Device Connected</div>
          <div class="text-[10px] text-emerald-400 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>Live Test</div>
        </div>
      </div>

      <button type="button" id="mdConnectBtn" onclick="SF.mobileDoctor.connect()"
              class="bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold px-5 py-2.5 rounded-xl text-xs shadow-lg flex items-center gap-2 cursor-pointer">
        <span>📷</span><span id="mdConnectBtnText">Scan QR to Connect</span>
      </button>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
    <main class="lg:col-span-12 space-y-4">
      
      <!-- Metric Cards -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
        <div class="bg-[#0b1120]/90 border border-cyan-600/40 rounded-xl p-3">
          <div class="text-[10px] text-cyan-400 font-bold uppercase">Network</div>
          <div id="mdCardNetVal" class="text-sm font-black text-white mt-1 truncate">--</div>
        </div>
        
        <div class="bg-[#0b1120]/90 border border-emerald-600/40 rounded-xl p-3">
          <div class="text-[10px] text-emerald-400 font-bold uppercase">Battery</div>
          <div id="mdCardBatteryVal" class="text-sm font-black text-white mt-1">--%</div>
        </div>

        <div class="bg-[#0b1120]/90 border border-amber-600/40 rounded-xl p-3">
          <div class="text-[10px] text-amber-400 font-bold uppercase">Charging</div>
          <div id="mdCardChargeVal" class="text-sm font-black text-white mt-1 truncate">--</div>
        </div>

        <div class="bg-[#0b1120]/90 border border-purple-600/40 rounded-xl p-3">
          <div class="text-[10px] text-purple-400 font-bold uppercase">RAM</div>
          <div id="mdCardRamVal" class="text-sm font-black text-white mt-1 truncate">--</div>
        </div>

        <div class="bg-[#0b1120]/90 border border-rose-600/40 rounded-xl p-3">
          <div class="text-[10px] text-rose-400 font-bold uppercase">CPU Cores</div>
          <div id="mdCardCpuVal" class="text-sm font-black text-white mt-1 truncate">--</div>
        </div>

        <div class="bg-[#0b1120]/90 border border-blue-600/40 rounded-xl p-3">
          <div class="text-[10px] text-blue-400 font-bold uppercase">Screen</div>
          <div id="mdCardScreenVal" class="text-sm font-black text-white mt-1 truncate">--</div>
        </div>
      </div>

      <!-- Detail List -->
      <div class="bg-[#0b1120]/80 border border-cyan-900/40 rounded-2xl p-5">
        <h3 class="text-sm font-black text-cyan-400 mb-4">📊 Full Diagnostic Report</h3>
        <div id="mdDetailedReport" class="text-xs text-slate-300 space-y-3">
          <div class="text-center py-10 text-slate-500">Connect a device to view full report.</div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
(function () {
  'use strict';
  window.SF = window.SF || {};
  
  const C = window.SF?.common || {
    toast: (msg) => alert(msg)
  };

  const MD = {
    connected: false,
    currentSessionId: null,
    pollInterval: null
  };

  async function connect() {
    if (MD.connected) {
      MD.connected = false;
      clearInterval(MD.pollInterval);
      document.getElementById('mdDeviceHeaderCard').classList.add('hidden');
      document.getElementById('mdConnectBtnText').textContent = 'Scan QR to Connect';
      
      // Reset Cards
      ['NetVal','BatteryVal','ChargeVal','RamVal','CpuVal','ScreenVal'].forEach(id => {
        document.getElementById(id).textContent = '--';
      });
      document.getElementById('mdDetailedReport').innerHTML = '<div class="text-center py-10 text-slate-500">Connect a device to view full report.</div>';
      return;
    }

    MD.currentSessionId = 'doc-' + Date.now();
    const baseUrl = window.location.origin + window.location.pathname.replace(/\/app\.html.*$/, '/').replace(/\/index\.html.*$/, '/');
    const testUrl = baseUrl + 'phone-test.html?id=' + MD.currentSessionId;
    const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(testUrl)}`;

    const overlay = document.createElement('div');
    overlay.id = 'qrOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;';
    
    overlay.innerHTML = `
      <div style="background:#0b1120;border:2px solid #0ea5e9;border-radius:20px;padding:30px;text-align:center;max-width:380px;width:100%;">
        <h3 style="color:#38bdf8;font-size:20px;font-weight:900;margin-bottom:10px;">Scan to Test Device</h3>
        <div style="background:white;padding:10px;border-radius:12px;display:inline-block;">
          <img src="${qrImageUrl}" style="width:220px;height:220px;">
        </div>
        <div style="margin-top:20px;font-size:12px;color:#f59e0b;font-weight:bold;">⏳ Waiting for mobile connection...</div>
        <button onclick="document.getElementById('qrOverlay').remove(); clearInterval(SF.mobileDoctor.state.pollInterval);" style="margin-top:20px;background:#1e293b;color:white;padding:8px 20px;border-radius:8px;border:none;cursor:pointer;">Cancel</button>
      </div>
    `;
    
    document.body.appendChild(overlay);
    MD.connected = true;

    // Poll localStorage for data
    MD.pollInterval = setInterval(() => {
      const dataStr = localStorage.getItem('sfp_doc_session_' + MD.currentSessionId);
      if (dataStr) {
        const data = JSON.parse(dataStr);
        clearInterval(MD.pollInterval);
        
        const modal = document.getElementById('qrOverlay');
        if (modal) modal.remove();

        C.toast('✅ Device Connected!');
        document.getElementById('mdDeviceHeaderCard').classList.remove('hidden');
        document.getElementById('mdDeviceHeaderCard').classList.add('flex');
        
        // Populate Cards
        document.getElementById('mdCardNetVal').textContent = data.network.split(' ')[0]; // Just 4G/5G
        document.getElementById('mdCardBatteryVal').textContent = data.battery;
        document.getElementById('mdCardChargeVal').textContent = data.charging.split(' ')[0]; // Yes/No
        document.getElementById('mdCardRamVal').textContent = data.ram;
        document.getElementById('mdCardCpuVal').textContent = data.cpu;
        document.getElementById('mdCardScreenVal').textContent = data.screen.split(' ')[0] + 'px';

        // Populate Detailed Report
        document.getElementById('mdDetailedReport').innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="bg-slate-900 p-3 rounded-lg flex justify-between"><span class="text-slate-400">📱 OS Platform:</span><span class="font-bold text-white">${data.os}</span></div>
            <div class="bg-slate-900 p-3 rounded-lg flex justify-between"><span class="text-slate-400">📶 Network:</span><span class="font-bold text-sky-400">${data.network}</span></div>
            <div class="bg-slate-900 p-3 rounded-lg flex justify-between"><span class="text-slate-400">🔋 Battery:</span><span class="font-bold text-emerald-400">${data.battery} (${data.charging})</span></div>
            <div class="bg-slate-900 p-3 rounded-lg flex justify-between"><span class="text-slate-400">🧠 RAM:</span><span class="font-bold text-purple-400">${data.ram}</span></div>
            <div class="bg-slate-900 p-3 rounded-lg flex justify-between"><span class="text-slate-400">⚙️ CPU:</span><span class="font-bold text-amber-400">${data.cpu}</span></div>
            <div class="bg-slate-900 p-3 rounded-lg flex justify-between"><span class="text-slate-400">🖥️ Display:</span><span class="font-bold text-blue-400">${data.screen}</span></div>
            <div class="bg-slate-900 p-3 rounded-lg flex justify-between col-span-1 md:col-span-2"><span class="text-slate-400">💾 Browser Storage Limit:</span><span class="font-bold text-rose-400">${data.storage}</span></div>
          </div>
        `;

        document.getElementById('mdConnectBtnText').textContent = 'Disconnect';
      }
    }, 1000);
  }

  window.SF.mobileDoctor = { connect, state: MD };
})();
</script>
