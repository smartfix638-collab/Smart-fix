<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>System Console</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%231a1a1a'/%3E%3Ctext x='50%25' y='65%25' font-size='300' text-anchor='middle' fill='%23dc2626'%3E%E2%9A%A0%3C/text%3E%3C/svg%3E">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a1a; color: #e2e8f0;
    overflow-x: hidden;
  }
  .hidden { display: none !important; }
  .bg-mesh {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(220, 38, 38, 0.12), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12), transparent 50%);
    pointer-events: none;
  }
  .glass {
    background: linear-gradient(135deg, rgba(30, 27, 75, 0.6), rgba(15, 23, 42, 0.75));
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(139, 92, 246, 0.2);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
  }
  .input-field {
    width: 100%; background: rgba(10, 10, 26, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 10px;
    padding: 12px 14px; color: #e2e8f0; font-size: 14px;
    font-family: inherit; transition: all 0.15s;
  }
  .input-field::placeholder { color: #64748b; }
  .input-field:focus {
    outline: none; border-color: rgba(220, 38, 38, 0.6);
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
  }
  .btn-primary {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    font-weight: 700; font-size: 14px; color: white; cursor: pointer;
    background: linear-gradient(135deg, #dc2626, #991b1b);
    box-shadow: 0 8px 24px rgba(220, 38, 38, 0.35);
    transition: all 0.2s; font-family: inherit;
  }
  .btn-primary:active:not(:disabled) { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 6px; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-badge {
    display: inline-block; padding: 5px 12px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
  }
  .status-loading { background: #78350f; color: #fbbf24; }
  .status-ready   { background: #064e3b; color: #34d399; }
  .status-error   { background: #7f1d1d; color: #f87171; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
</style>
</head>
<body>

<div class="bg-mesh"></div>

<!-- ═══════════════════════════════════════════════════════════
     STAGE 1: LOGIN
     ═══════════════════════════════════════════════════════════ -->
<div id="stage1" style="position: relative; z-index: 10; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;">
  <div style="width: 100%; max-width: 440px;">

    <div style="text-align: center; margin-bottom: 24px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #334155, #0f172a); border: 1px solid rgba(220, 38, 38, 0.3); margin-bottom: 12px;">
        <span style="font-size: 30px;">⚙️</span>
      </div>
      <h1 style="font-size: 22px; font-weight: 900; color: #fff; margin: 0;">System Console</h1>
      <p style="font-size: 10px; color: #64748b; margin: 6px 0 0; font-family: monospace;">Stage 1 of 2 · Authentication</p>
    </div>

    <div class="glass" style="border-radius: 16px; padding: 24px;">

      <!-- Loading status -->
      <div id="sdkStatus" style="text-align: center; margin-bottom: 16px;">
        <span id="sdkBadge" class="status-badge status-loading">⏳ Loading Firebase...</span>
      </div>

      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; letter-spacing: 0.05em;">Email</label>
        <input id="adminEmail" type="email" placeholder="email@domain.com" class="input-field" autocapitalize="none" spellcheck="false" autocomplete="off">
      </div>

      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; letter-spacing: 0.05em;">Password</label>
        <input id="adminPass" type="password" placeholder="••••••••" class="input-field" autocomplete="off" onkeydown="if(event.key==='Enter')window.stage1Login()">
      </div>

      <button id="loginBtn" type="button" class="btn-primary" disabled style="opacity: 0.5;">
        Continue →
      </button>

      <div id="loginError" style="color: #f87171; font-size: 12px; text-align: center; min-height: 18px; margin-top: 12px; font-family: monospace;"></div>

    </div>

    <div style="text-align: center; margin-top: 16px; font-size: 9px; color: #475569; font-family: monospace;">
      v1.0 · Restricted Access
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════
     STAGE 2: PIN
     ═══════════════════════════════════════════════════════════ -->
<div id="stage2" class="hidden" style="position: relative; z-index: 10; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;">
  <div style="width: 100%; max-width: 440px;">

    <div style="text-align: center; margin-bottom: 24px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #dc2626, #7f1d1d); box-shadow: 0 8px 30px rgba(220, 38, 38, 0.4); margin-bottom: 12px;">
        <span style="font-size: 30px;">🔐</span>
      </div>
      <h1 style="font-size: 20px; font-weight: 900; color: #fff; margin: 0;">Second Factor Required</h1>
      <p style="font-size: 10px; color: #64748b; margin: 6px 0 0; font-family: monospace;">Stage 2 of 2 · Secret PIN</p>
      <p id="stage2User" style="font-size: 11px; color: #cbd5e1; margin: 10px 0 0;"></p>
    </div>

    <div class="glass" style="border-radius: 16px; padding: 24px;">

      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; letter-spacing: 0.05em;">Master Access PIN</label>
        <input id="adminPin" type="password" inputmode="numeric" placeholder="••••••" maxlength="10"
               class="input-field" style="text-align: center; font-size: 20px; letter-spacing: 6px;"
               autocomplete="off"
               onkeydown="if(event.key==='Enter')window.stage2Verify()">
      </div>

      <button id="pinBtn" type="button" class="btn-primary" onclick="window.stage2Verify()">
        🔓 Unlock Console
      </button>

      <div id="pinError" style="color: #f87171; font-size: 12px; text-align: center; min-height: 18px; margin-top: 12px; font-family: monospace;"></div>

      <button type="button" onclick="window.stage1Back()" style="width: 100%; background: transparent; border: none; color: #64748b; font-size: 11px; font-weight: 700; padding: 10px 0 0; cursor: pointer; font-family: inherit;">
        ← Back
      </button>

    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════
     DASHBOARD
     ═══════════════════════════════════════════════════════════ -->
<div id="dashboard" class="hidden" style="position: relative; z-index: 10;">
  <div style="max-width: 1600px; margin: 0 auto; padding: 16px;">

    <div class="glass" style="border-radius: 16px; padding: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #dc2626, #991b1b); display: flex; align-items: center; justify-content: center; font-size: 24px;">🛡️</div>
        <div>
          <h1 style="font-size: 18px; font-weight: 900; color: #fff; margin: 0;">Control Center</h1>
          <p style="font-size: 11px; color: #94a3b8; margin: 3px 0 0;">
            Admin: <span id="adminEmailDisplay" style="color: #fca5a5; font-family: monospace;">—</span>
          </p>
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button type="button" onclick="window.loadAll()" style="background: #1e293b; color: #cbd5e1; border: none; padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;">↻ Refresh</button>
        <button type="button" onclick="window.adminLogout()" style="background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;">⏏ Exit</button>
      </div>
    </div>

    <div id="statGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px;">
      <div class="glass" style="border-radius: 12px; padding: 14px;">
        <div style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: #fca5a5; letter-spacing: 0.05em;">Total Stores</div>
        <div id="statTotal" style="font-size: 26px; font-weight: 900; color: #fff; margin-top: 4px;">0</div>
      </div>
      <div class="glass" style="border-radius: 12px; padding: 14px;">
        <div style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: #6ee7b7; letter-spacing: 0.05em;">Active</div>
        <div id="statActive" style="font-size: 26px; font-weight: 900; color: #fff; margin-top: 4px;">0</div>
      </div>
      <div class="glass" style="border-radius: 12px; padding: 14px;">
        <div style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: #fcd34d; letter-spacing: 0.05em;">Trial</div>
        <div id="statTrial" style="font-size: 26px; font-weight: 900; color: #fff; margin-top: 4px;">0</div>
      </div>
      <div class="glass" style="border-radius: 12px; padding: 14px;">
        <div style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: #f87171; letter-spacing: 0.05em;">Suspended</div>
        <div id="statSuspended" style="font-size: 26px; font-weight: 900; color: #fff; margin-top: 4px;">0</div>
      </div>
      <div class="glass" style="border-radius: 12px; padding: 14px;">
        <div style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: #c4b5fd; letter-spacing: 0.05em;">Total Users</div>
        <div id="statUsers" style="font-size: 26px; font-weight: 900; color: #fff; margin-top: 4px;">0</div>
      </div>
    </div>

    <div class="glass" style="border-radius: 16px; padding: 12px; margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px;">
      <input id="searchBox" oninput="window.renderStores()" placeholder="🔍 Search shops..." style="flex: 1; min-width: 180px; background: #0a0a1a; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 12px; font-family: inherit;">
      <select id="filterStatus" onchange="window.renderStores()" style="background: #0a0a1a; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 12px; font-family: inherit;">
        <option value="ALL">All Status</option>
        <option value="trial">Trial</option>
        <option value="active">Active</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>

    <div class="glass" style="border-radius: 16px; margin-top: 12px; overflow: hidden;">
      <div style="padding: 14px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-weight: 700; font-size: 14px; color: #fff; margin: 0;">📋 All Stores</h2>
        <span id="storeCount" style="font-size: 10px; background: #1e293b; color: #94a3b8; padding: 4px 10px; border-radius: 12px; font-family: monospace;">0</span>
      </div>
      <div id="storeList" style="max-height: 600px; overflow-y: auto;">
        <div style="text-align: center; padding: 48px; color: #64748b; font-size: 12px;">Loading...</div>
      </div>
    </div>

  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════
     MODAL
     ═══════════════════════════════════════════════════════════ -->
<div id="storeModal" class="hidden" style="position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);">
  <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px;">
    <div class="glass" style="border-radius: 16px; max-width: 800px; width: 100%; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden;">
      <div style="padding: 14px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;">
        <div style="min-width: 0; flex: 1;">
          <h3 id="modalStoreName" style="font-weight: 900; color: #fff; font-size: 15px; margin: 0;">Store</h3>
          <p id="modalStoreEmail" style="font-size: 11px; color: #94a3b8; margin: 3px 0 0; font-family: monospace; overflow: hidden; text-overflow: ellipsis;">—</p>
        </div>
        <button type="button" onclick="window.closeModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 24px; font-weight: 700; cursor: pointer; width: 36px; height: 36px; font-family: inherit;">✕</button>
      </div>
      <div id="modalBody" style="padding: 16px; overflow-y: auto; flex: 1;"></div>
      <div style="padding: 12px; border-top: 1px solid #1e293b; display: flex; flex-wrap: wrap; gap: 8px;">
        <button id="modalToggleBtn" type="button" onclick="window.toggleStoreStatus()" style="flex: 1; min-width: 120px; font-weight: 700; padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; border: none; color: white;">⏸ Suspend</button>
        <button type="button" onclick="window.resetCounters()" style="flex: 1; min-width: 120px; background: #334155; color: #fff; font-weight: 700; padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; border: none;">🔄 Reset Counters</button>
        <button type="button" onclick="window.wipeStoreData()" style="flex: 1; min-width: 120px; background: #b45309; color: #fff; font-weight: 700; padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; border: none;">⚠️ Wipe Data</button>
        <button type="button" onclick="window.deleteStoreEntirely()" style="flex: 1; min-width: 120px; background: #b91c1c; color: #fff; font-weight: 700; padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; border: none;">☢️ Delete Store</button>
      </div>
    </div>
  </div>
</div>


<script type="module">
/* ============================================================
   SmartFix System Console — Self-Contained
   No external file imports — everything inline
   ============================================================ */

/* ═══ Firebase Config (INLINE) ═══ */
const firebaseConfig = {
  apiKey:            "AIzaSyDbAlfyb040xKffRx20SGBvwuitsA1zTSE",
  authDomain:        "smartfix-a6733.firebaseapp.com",
  projectId:         "smartfix-a6733",
  storageBucket:     "smartfix-a6733.firebasestorage.app",
  messagingSenderId: "346183509613",
  appId:             "1:346183509613:web:d710eb153e1aef89cb8164"
};

/* ═══ Global State ═══ */
const ADMIN = {
  user: null,
  stage1Email: '',
  stores: [],
  currentStore: null,
  pinVerified: false,
  sessionStart: null,
  auth: null,
  db: null,
  authMod: null,
  fsMod: null
};

const loginBtn = document.getElementById('loginBtn');
const sdkBadge = document.getElementById('sdkBadge');

console.log('🚀 Console page loaded');
console.log('Project:', firebaseConfig.projectId);

/* ═══ Load Firebase SDK ═══ */
(async () => {
  try {
    console.log('📦 Loading Firebase SDK...');

    const [appMod, authMod, fsMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js')
    ]);

    const app = appMod.initializeApp(firebaseConfig);
    ADMIN.auth = authMod.getAuth(app);
    ADMIN.db = fsMod.getFirestore(app);
    ADMIN.authMod = authMod;
    ADMIN.fsMod = fsMod;

    /* Auto-check if user already signed in */
    authMod.onAuthStateChanged(ADMIN.auth, (user) => {
      if (user) {
        console.log('User already signed in:', user.email);
      }
    });

    sdkBadge.textContent = '✅ Ready';
    sdkBadge.className = 'status-badge status-ready';
    loginBtn.disabled = false;
    loginBtn.style.opacity = '1';

    console.log('✅ Firebase ready');
  } catch (e) {
    console.error('❌ SDK load failed:', e);
    sdkBadge.textContent = '❌ SDK Failed';
    sdkBadge.className = 'status-badge status-error';
    document.getElementById('loginError').textContent = 'Firebase failed to load: ' + e.message;
  }
})();

/* ═══ Stage 1: Login ═══ */
window.stage1Login = async function () {
  const email = (document.getElementById('adminEmail')?.value || '').trim().toLowerCase();
  const pass = document.getElementById('adminPass')?.value || '';
  const errEl = document.getElementById('loginError');

  errEl.textContent = '';

  if (!email || !pass) {
    errEl.textContent = 'Enter email and password.';
    return;
  }
  if (!ADMIN.auth) {
    errEl.textContent = 'Firebase not ready. Wait a moment.';
    return;
  }

  loginBtn.disabled = true;
  loginBtn.innerHTML = '<span class="spinner"></span>Authenticating...';

  try {
    console.log('🔐 Attempting login...');
    const cred = await ADMIN.authMod.signInWithEmailAndPassword(ADMIN.auth, email, pass);
    ADMIN.stage1Email = email;
    console.log('✅ Auth OK, UID:', cred.user.uid);

    /* Verify Firestore access — this proves email is whitelisted */
    try {
      await ADMIN.fsMod.getDocs(ADMIN.fsMod.collection(ADMIN.db, 'stores'));
      console.log('✅ Firestore access OK');
      showStage2();
    } catch (ruleErr) {
      console.warn('Firestore access denied:', ruleErr.code);
      await ADMIN.authMod.signOut(ADMIN.auth);
      errEl.textContent = '❌ Access denied (Firestore Rules).';
      loginBtn.disabled = false;
      loginBtn.innerHTML = 'Continue →';
    }
  } catch (e) {
    console.error('❌ Login failed:', e);
    const map = {
      'auth/invalid-credential': 'Invalid email or password.',
      'auth/wrong-password': 'Incorrect password.',
      'auth/user-not-found': 'No account with this email.',
      'auth/too-many-requests': 'Too many attempts. Wait a minute.',
      'auth/network-request-failed': 'No internet connection.',
      'auth/operation-not-allowed': 'Email/Password auth disabled in Firebase.'
    };
    errEl.textContent = map[e.code] || ('Error: ' + e.code);
    loginBtn.disabled = false;
    loginBtn.innerHTML = 'Continue →';
  }
};

/* ═══ Show Stage 2 ═══ */
function showStage2() {
  document.getElementById('stage1').classList.add('hidden');
  document.getElementById('stage2').classList.remove('hidden');
  document.getElementById('stage2User').textContent = 'Signed in as: ' + ADMIN.stage1Email;
  setTimeout(() => document.getElementById('adminPin')?.focus(), 200);
}

/* ═══ Back to Stage 1 ═══ */
window.stage1Back = async function () {
  try { await ADMIN.authMod.signOut(ADMIN.auth); } catch (e) {}
  document.getElementById('stage1').classList.remove('hidden');
  document.getElementById('stage2').classList.add('hidden');
  document.getElementById('adminEmail').value = '';
  document.getElementById('adminPass').value = '';
  document.getElementById('adminPin').value = '';
  loginBtn.disabled = false;
  loginBtn.innerHTML = 'Continue →';
  document.getElementById('loginError').textContent = '';
  document.getElementById('pinError').textContent = '';
};

/* ═══ Stage 2: PIN ═══ */
window.stage2Verify = async function () {
  const pin = (document.getElementById('adminPin')?.value || '').trim();
  const errEl = document.getElementById('pinError');
  const btn = document.getElementById('pinBtn');

  errEl.textContent = '';

  if (!pin) {
    errEl.textContent = 'Enter PIN.';
    return;
  }
  if (!ADMIN.db) {
    errEl.textContent = 'Firebase not ready.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verifying...';

  try {
    const snap = await ADMIN.fsMod.getDoc(
      ADMIN.fsMod.doc(ADMIN.db, 'adminConfig', 'security')
    );

    if (!snap.exists()) {
      errEl.textContent = '❌ Admin config not found.';
      btn.disabled = false;
      btn.innerHTML = '🔓 Unlock Console';
      return;
    }

    const data = snap.data();
    const email = (ADMIN.auth?.currentUser?.email || '').toLowerCase();
    const admins = Array.isArray(data.admins) ? data.admins.map(e => String(e).toLowerCase()) : [];

    if (!admins.includes(email)) {
      errEl.textContent = '❌ Your email is not in admins list.';
      btn.disabled = false;
      btn.innerHTML = '🔓 Unlock Console';
      return;
    }

    if (String(data.pin) !== String(pin)) {
      errEl.textContent = '❌ Invalid PIN.';
      btn.disabled = false;
      btn.innerHTML = '🔓 Unlock Console';
      return;
    }

    /* Success */
    ADMIN.pinVerified = true;
    ADMIN.sessionStart = Date.now();
    console.log('✅ Access granted');

    document.getElementById('stage1').classList.add('hidden');
    document.getElementById('stage2').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('adminEmailDisplay').textContent = ADMIN.auth.currentUser.email;

    loadAll();

  } catch (e) {
    console.error('PIN verify error:', e);
    errEl.textContent = '❌ ' + (e.code || e.message);
    btn.disabled = false;
    btn.innerHTML = '🔓 Unlock Console';
  }
};

/* ═══ Logout ═══ */
window.adminLogout = async function () {
  if (ADMIN.pinVerified && !confirm('Exit Console?')) return;
  try { await ADMIN.authMod.signOut(ADMIN.auth); } catch (e) {}
  location.reload();
};

/* ═══ Load All Stores ═══ */
window.loadAll = async function () {
  const listEl = document.getElementById('storeList');
  listEl.innerHTML = '<div style="text-align: center; padding: 48px; color: #64748b; font-size: 12px;">Loading stores...</div>';

  try {
    const storesSnap = await ADMIN.fsMod.getDocs(ADMIN.fsMod.collection(ADMIN.db, 'stores'));
    const stores = [];
    storesSnap.forEach(d => stores.push({ id: d.id, ...d.data() }));

    for (const store of stores) {
      try {
        const staffSnap = await ADMIN.fsMod.getDocs(
          ADMIN.fsMod.collection(ADMIN.db, 'stores', store.id, 'staffUsers')
        );
        store._staffCount = staffSnap.size;
      } catch (e) { store._staffCount = 0; }
    }

    ADMIN.stores = stores;

    const total = stores.length;
    const active = stores.filter(s => (s.plan || 'trial') === 'active').length;
    const trial = stores.filter(s => (s.plan || 'trial') === 'trial').length;
    const suspended = stores.filter(s => s.plan === 'suspended').length;
    const totalUsers = stores.reduce((sum, s) => sum + 1 + (s._staffCount || 0), 0);

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statTrial').textContent = trial;
    document.getElementById('statSuspended').textContent = suspended;
    document.getElementById('statUsers').textContent = totalUsers;
    document.getElementById('storeCount').textContent = total + ' stores';

    renderStores();

  } catch (e) {
    console.error('Load failed:', e);
    listEl.innerHTML = '<div style="text-align: center; padding: 48px; color: #f87171; font-size: 12px;">Cannot load: ' + (e.code || e.message) + '</div>';
  }
};

/* ═══ Render Stores ═══ */
window.renderStores = function () {
  const listEl = document.getElementById('storeList');
  const q = (document.getElementById('searchBox')?.value || '').trim().toLowerCase();
  const filterStatus = document.getElementById('filterStatus')?.value || 'ALL';

  let filtered = ADMIN.stores.slice();
  if (q) {
    filtered = filtered.filter(s => {
      const blob = ((s.shopName || '') + ' ' + (s.ownerEmail || '') + ' ' + (s.shopCode || '') + ' ' + (s.ownerPhone || '')).toLowerCase();
      return blob.includes(q);
    });
  }
  if (filterStatus !== 'ALL') filtered = filtered.filter(s => (s.plan || 'trial') === filterStatus);

  if (filtered.length === 0) {
    listEl.innerHTML = '<div style="text-align: center; padding: 48px; color: #64748b; font-size: 12px;">No stores found.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(s => {
    const plan = s.plan || 'trial';
    const planColors = { trial: '#0ea5e9', active: '#10b981', suspended: '#ef4444' };
    const color = planColors[plan] || '#64748b';
    const icon = { trial: '🎁', active: '✅', suspended: '⛔' }[plan] || '📦';
    const createdDate = s.createdAt?.seconds
      ? new Date(s.createdAt.seconds * 1000).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
      : '—';

    return `
      <div onclick="window.openStore('${s.id}')" style="padding: 14px; border-bottom: 1px solid #1e293b; cursor: pointer;" onmouseover="this.style.background='rgba(30,41,59,0.5)'" onmouseout="this.style.background='transparent'">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
          <div style="min-width: 0; flex: 1;">
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px;">
              <span style="font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; border: 1px solid ${color}; color: ${color};">${icon} ${plan.toUpperCase()}</span>
              ${s.shopCode ? `<span style="font-size: 10px; font-family: monospace; background: #1e293b; color: #38bdf8; padding: 3px 8px; border-radius: 4px;">${escapeHTML(s.shopCode)}</span>` : ''}
              <span style="font-size: 10px; color: #64748b;">${createdDate}</span>
            </div>
            <div style="font-size: 15px; font-weight: 900; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHTML(s.shopName || '(No name)')}</div>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
              ✉️ ${escapeHTML(s.ownerEmail || '—')}${s.ownerPhone ? ' • 📞 ' + escapeHTML(s.ownerPhone) : ''}
            </div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700;">Staff</div>
            <div style="font-size: 20px; font-weight: 900; color: #c4b5fd; font-family: monospace;">${s._staffCount || 0}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
};

/* ═══ Open Store ═══ */
window.openStore = async function (storeId) {
  const store = ADMIN.stores.find(s => s.id === storeId);
  if (!store) return;
  ADMIN.currentStore = store;

  document.getElementById('modalStoreName').textContent = store.shopName || 'Store';
  document.getElementById('modalStoreEmail').textContent = store.ownerEmail || '—';
  document.getElementById('storeModal').classList.remove('hidden');

  const body = document.getElementById('modalBody');
  body.innerHTML = '<div style="text-align: center; padding: 32px; color: #64748b; font-size: 12px;"><span class="spinner"></span>Loading details...</div>';

  const plan = store.plan || 'trial';
  const toggleBtn = document.getElementById('modalToggleBtn');
  if (plan === 'suspended') {
    toggleBtn.textContent = '▶ Activate';
    toggleBtn.style.background = '#059669';
  } else {
    toggleBtn.textContent = '⏸ Suspend';
    toggleBtn.style.background = '#b45309';
  }

  try {
    const cols = ['invoices', 'creditNotes', 'repairs', 'purchases', 'vouchers', 'inventory', 'parties', 'staff', 'salaryPayments', 'attendance', 'auditLog', 'staffUsers'];
    const counts = {};
    for (const c of cols) {
      try {
        const snap = await ADMIN.fsMod.getDocs(ADMIN.fsMod.collection(ADMIN.db, 'stores', storeId, c));
        counts[c] = snap.size;
      } catch (e) { counts[c] = '?'; }
    }

    let profile = {};
    try {
      const p = await ADMIN.fsMod.getDoc(ADMIN.fsMod.doc(ADMIN.db, 'stores', storeId, 'profile', 'main'));
      if (p.exists()) profile = p.data();
    } catch (e) {}

    let counters = {};
    try {
      const c = await ADMIN.fsMod.getDoc(ADMIN.fsMod.doc(ADMIN.db, 'stores', storeId, 'counters', 'main'));
      if (c.exists()) counters = c.data();
    } catch (e) {}

    body.innerHTML = `
      <div style="background: #0a0a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-size: 11px; margin-bottom: 12px;">
        <div style="display: flex; justify-content: space-between; padding: 3px 0;"><span style="color: #64748b;">Store ID:</span><span style="font-family: monospace; color: #38bdf8; font-size: 10px;">${storeId}</span></div>
        <div style="display: flex; justify-content: space-between; padding: 3px 0;"><span style="color: #64748b;">Shop Name:</span><span style="font-weight: 700; color: #fff;">${escapeHTML(store.shopName || '—')}</span></div>
        <div style="display: flex; justify-content: space-between; padding: 3px 0;"><span style="color: #64748b;">Shop Code:</span><span style="font-family: monospace; color: #38bdf8;">${escapeHTML(store.shopCode || '—')}</span></div>
        <div style="display: flex; justify-content: space-between; padding: 3px 0;"><span style="color: #64748b;">Email:</span><span style="font-family: monospace;">${escapeHTML(store.ownerEmail || '—')}</span></div>
        <div style="display: flex; justify-content: space-between; padding: 3px 0;"><span style="color: #64748b;">Phone:</span><span style="font-family: monospace;">${escapeHTML(store.ownerPhone || '—')}</span></div>
      </div>

      ${profile.name ? `
        <div style="background: #0a0a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-size: 11px; margin-bottom: 12px;">
          <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: #38bdf8; margin-bottom: 8px;">🏪 Profile</div>
          ${profile.gstin ? `<div style="display: flex; justify-content: space-between; padding: 2px 0;"><span style="color: #64748b;">GSTIN:</span><span style="font-family: monospace;">${escapeHTML(profile.gstin)}</span></div>` : ''}
          ${profile.address ? `<div style="display: flex; justify-content: space-between; padding: 2px 0;"><span style="color: #64748b;">Address:</span><span style="text-align: right;">${escapeHTML(profile.address)}</span></div>` : ''}
          ${profile.upiId ? `<div style="display: flex; justify-content: space-between; padding: 2px 0;"><span style="color: #64748b;">UPI:</span><span style="font-family: monospace;">${escapeHTML(profile.upiId)}</span></div>` : ''}
        </div>
      ` : ''}

      <div style="background: #0a0a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 12px;">
        <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: #38bdf8; margin-bottom: 8px;">🔢 Counters</div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
          <div style="background: #1e293b; border-radius: 6px; padding: 8px; text-align: center;"><div style="font-size: 9px; color: #64748b;">Invoices</div><div style="font-family: monospace; color: #7dd3fc; font-weight: 700;">${counters.invSeq || 0}</div></div>
          <div style="background: #1e293b; border-radius: 6px; padding: 8px; text-align: center;"><div style="font-size: 9px; color: #64748b;">Returns</div><div style="font-family: monospace; color: #7dd3fc; font-weight: 700;">${counters.crnSeq || 0}</div></div>
          <div style="background: #1e293b; border-radius: 6px; padding: 8px; text-align: center;"><div style="font-size: 9px; color: #64748b;">Purchases</div><div style="font-family: monospace; color: #7dd3fc; font-weight: 700;">${counters.purSeq || 0}</div></div>
        </div>
      </div>

      <div style="background: #0a0a1a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px;">
        <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: #38bdf8; margin-bottom: 8px;">📊 Data Counts</div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; font-size: 11px;">
          ${[['🧾 Invoices', counts.invoices], ['🔧 Repairs', counts.repairs], ['↩️ Returns', counts.creditNotes], ['🛒 Purchases', counts.purchases], ['📒 Vouchers', counts.vouchers], ['📦 Stock', counts.inventory], ['👥 Parties', counts.parties], ['👨‍💼 Staff', counts.staff], ['💰 Salaries', counts.salaryPayments], ['📸 Attendance', counts.attendance], ['📝 Audit', counts.auditLog], ['🔑 Logins', counts.staffUsers]].map(([label, count]) => `
            <div style="background: #1e293b; border-radius: 6px; padding: 8px; text-align: center;">
              <div style="font-size: 9px; color: #64748b;">${label}</div>
              <div style="font-family: monospace; color: #fff; font-weight: 700; font-size: 15px;">${count}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } catch (e) {
    body.innerHTML = '<div style="text-align: center; padding: 32px; color: #f87171;">Cannot load: ' + escapeHTML(e.code || e.message) + '</div>';
  }
};

window.closeModal = function () {
  document.getElementById('storeModal').classList.add('hidden');
  ADMIN.currentStore = null;
};

/* ═══ Toggle Status ═══ */
window.toggleStoreStatus = async function () {
  const store = ADMIN.currentStore;
  if (!store) return;
  const currentPlan = store.plan || 'trial';
  const newPlan = currentPlan === 'suspended' ? 'trial' : 'suspended';
  const action = newPlan === 'suspended' ? 'SUSPEND' : 'ACTIVATE';
  if (!confirm(`${newPlan === 'suspended' ? '⏸ Suspend' : '▶ Activate'}?\n\n${store.shopName}\n${store.ownerEmail}`)) return;

  try {
    await ADMIN.fsMod.setDoc(
      ADMIN.fsMod.doc(ADMIN.db, 'stores', store.id),
      { plan: newPlan, updatedAt: ADMIN.fsMod.serverTimestamp() },
      { merge: true }
    );
    alert('✅ Store ' + action + 'ED');
    closeModal();
    await loadAll();
  } catch (e) {
    alert('❌ Failed: ' + (e.code || e.message));
  }
};

/* ═══ Reset Counters ═══ */
window.resetCounters = async function () {
  const store = ADMIN.currentStore;
  if (!store) return;
  if (!confirm('🔄 Reset invoice counters to 0?\n\n' + (store.shopName || ''))) return;
  try {
    await ADMIN.fsMod.setDoc(
      ADMIN.fsMod.doc(ADMIN.db, 'stores', store.id, 'counters', 'main'),
      { invSeq: 0, crnSeq: 0, purSeq: 0, updatedAt: ADMIN.fsMod.serverTimestamp() },
      { merge: true }
    );
    alert('✅ Counters reset');
    await openStore(store.id);
  } catch (e) {
    alert('❌ Failed: ' + (e.code || e.message));
  }
};

/* ═══ Wipe Data ═══ */
window.wipeStoreData = async function () {
  const store = ADMIN.currentStore;
  if (!store) return;
  if (!confirm('⚠️ WIPE ALL DATA?\n\n' + (store.shopName || '') + '\n\nDeletes invoices, repairs, vouchers, inventory, parties, staff records, salaries, attendance.\n\nKept: login, profile, shop code, staff logins.')) return;
  const typed = prompt('Type "WIPE" to confirm:');
  if (typed !== 'WIPE') { alert('Cancelled.'); return; }

  const cols = ['invoices', 'creditNotes', 'repairs', 'purchases', 'vouchers', 'inventory', 'parties', 'staff', 'salaryPayments', 'attendance', 'auditLog'];
  let total = 0;
  for (const c of cols) {
    try {
      const snap = await ADMIN.fsMod.getDocs(ADMIN.fsMod.collection(ADMIN.db, 'stores', store.id, c));
      if (snap.empty) continue;
      const refs = [];
      snap.forEach(d => refs.push(d.ref));
      for (let i = 0; i < refs.length; i += 400) {
        const batch = ADMIN.fsMod.writeBatch(ADMIN.db);
        refs.slice(i, i + 400).forEach(r => batch.delete(r));
        await batch.commit();
        total += Math.min(400, refs.length - i);
      }
    } catch (e) {}
  }
  try {
    await ADMIN.fsMod.setDoc(
      ADMIN.fsMod.doc(ADMIN.db, 'stores', store.id, 'counters', 'main'),
      { invSeq: 0, crnSeq: 0, purSeq: 0 },
      { merge: true }
    );
  } catch (e) {}
  alert('✅ Wiped ' + total + ' items');
  await openStore(store.id);
  await loadAll();
};

/* ═══ Delete Store ═══ */
window.deleteStoreEntirely = async function () {
  const store = ADMIN.currentStore;
  if (!store) return;
  if (!confirm('☢️ DELETE ENTIRE STORE?\n\n' + (store.shopName || '') + '\n' + (store.ownerEmail || '') + '\n\nDeletes EVERYTHING!\n\nCannot be undone!')) return;
  const typed = prompt('Type "DELETE" to confirm:');
  if (typed !== 'DELETE') { alert('Cancelled.'); return; }

  const cols = ['invoices', 'creditNotes', 'repairs', 'purchases', 'vouchers', 'inventory', 'parties', 'staff', 'salaryPayments', 'attendance', 'auditLog', 'staffUsers', 'profile', 'categories', 'counters'];
  let total = 0;
  for (const c of cols) {
    try {
      const snap = await ADMIN.fsMod.getDocs(ADMIN.fsMod.collection(ADMIN.DB || ADMIN.db, 'stores', store.id, c));
      if (snap.empty) continue;
      const refs = [];
      snap.forEach(d => refs.push(d.ref));
      for (let i = 0; i < refs.length; i += 400) {
        const batch = ADMIN.fsMod.writeBatch(ADMIN.db);
        refs.slice(i, i + 400).forEach(r => batch.delete(r));
        await batch.commit();
        total += Math.min(400, refs.length - i);
      }
    } catch (e) {}
  }

  try {
    if (store.shopCode) await ADMIN.fsMod.deleteDoc(ADMIN.fsMod.doc(ADMIN.db, 'publicStoreCodes', store.shopCode));
  } catch (e) {}
  try { await ADMIN.fsMod.deleteDoc(ADMIN.fsMod.doc(ADMIN.db, 'stores', store.id)); } catch (e) {}

  alert('✅ Store deleted. ' + total + ' items removed.');
  closeModal();
  await loadAll();
};

/* ═══ Helpers ═══ */
function escapeHTML(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ═══ Inactivity auto-logout ═══ */
let inactTimer = null;
function resetInact() {
  if (inactTimer) clearTimeout(inactTimer);
  if (ADMIN.pinVerified) {
    inactTimer = setTimeout(() => {
      alert('⏰ Session expired (15 min).');
      adminLogout();
    }, 15 * 60 * 1000);
  }
}
['click', 'keydown', 'touchstart'].forEach(e => window.addEventListener(e, resetInact));

console.log('🛡️ System Console ready');
